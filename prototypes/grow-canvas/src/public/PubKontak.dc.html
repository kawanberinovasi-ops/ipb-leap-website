<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>IPB LEAP · Contact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes hop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-20px) rotate(-8deg)}70%{transform:translateY(0)}100%{transform:translateY(0)}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1.15) both}
.hop{animation:hop .9s cubic-bezier(.3,1.4,.5,1) both}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
input:focus,textarea:focus,select:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50"><dc-import name="PubNav" active="kontak" hint-size="100%,73px"></dc-import></div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
    <section class="rise" style="flex: 1 1 460px; min-width: 0; border-radius: 34px; padding: 40px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; position: relative; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(380px 260px at 100% 0%, rgba(163,214,230,.4), transparent 70%)"></div>
      <div style="position: relative">
        <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">CONTACT</span>
        <h1 style="margin: 12px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 60px; line-height: .95; letter-spacing: -.025em">Siap make your leap?</h1>
        <p style="margin: 16px 0 28px; font-size: 16px; color: rgba(255,255,255,.85); line-height: 1.6">Tanya soal pendaftaran, kolaborasi, sponsorship, atau menjadi mentor.</p>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <a class="btn" href="mailto:mentoringleaderhaipb@gmail.com" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: #FFFFFF; text-decoration: none">
            <span style="width: 46px; height: 46px; flex: none; border-radius: 14px; background: #FFFFFF; color: #32306F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
            <span><span style="display: block; font-size: 12px; font-weight: 700; opacity: .75">Email</span><strong style="font-size: 16px">mentoringleaderhaipb@gmail.com</strong></span>
          </a>
          <a class="btn" href="https://wa.me/6285559070165" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: #FFFFFF; text-decoration: none">
            <span style="width: 46px; height: 46px; flex: none; border-radius: 14px; background: #D4FF3A; color: #0D0D1A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg></span>
            <span><span style="display: block; font-size: 12px; font-weight: 700; opacity: .75">WhatsApp · M. Fauzan Ramdani</span><strong style="font-size: 16px">0855-5907-0165</strong></span>
          </a>
        </div>
      </div>
    </section>

    <section style="flex: 1 1 460px; min-width: 0; border-radius: 34px; padding: 36px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column">
      <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
        <form aria-label="Form kontak" style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 22px; font-weight: 800; color: #32306F">Kirim pesan</h2>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nama<input type="text" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Email<input type="email" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Keperluan<select style="height: 48px; padding: 0 12px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Pendaftaran mentee</option><option>Menjadi mentor</option><option>Kolaborasi &amp; sponsorship</option><option>Lainnya</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Pesan<textarea rows="5" style="resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></textarea></label>
          <button class="btn" type="button" onClick="{{send}}" style="height: 52px; border-radius: 16px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Kirim pesan</button>
        </form>
      </sc-if>
      <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px">
          <span class="hop" aria-hidden="true" style="width: 76px; height: 76px; border-radius: 24px; background: #D4FF3A; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0D0D1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M9 5h10v10"></path></svg></span>
          <h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 30px; color: #32306F">Pesan terkirim!</h2>
          <p style="margin: 0; font-size: 15px; color: #55577A">Tim IPB LEAP akan membalas lewat email.</p>
        </div>
      </sc-if>
    </section>
  </main>
  <dc-import name="PubFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false }; }
  renderVals() { return { notSent: !this.state.sent, sent: this.state.sent, send: () => this.setState({ sent: true }) }; }
}
</script>
</body>
</html>
