<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>IPB LEAP · Kegiatan Mentoring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1.15) both}
.d1{animation-delay:.08s}
.galeri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:240px;gap:14px}
.lapis{height:100%;display:flex;flex-direction:column}
.bingkai{flex:1 1 0;min-height:0;overflow:hidden}
.bingkai img{transition:transform .35s ease}
.foto:hover .bingkai img{transform:scale(1.045)}
@media (max-width: 900px){.galeri{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 560px){.galeri{grid-template-columns:minmax(0,1fr);grid-auto-rows:300px}.galeri-titel{font-size:clamp(36px,10vw,56px)!important}.foto{grid-column:span 1 !important;grid-row:span 1 !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50"><dc-import name="PubNav" active="kegiatan" hint-size="100%,73px"></dc-import></div>

  <section style="max-width: 1360px; margin: 0 auto; padding: 72px 24px 24px">
    <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #3157A5">KEGIATAN MENTORING</span>
    <h1 class="rise galeri-titel" style="margin: 12px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 64px; line-height: .96; letter-spacing: -.025em; color: #32306F">Belajar dengan turun langsung.</h1>
    <p class="rise d1" style="margin: 16px 0 0; font-size: 17px; line-height: 1.65; color: #55577A">70% perjalanan IPB LEAP adalah pengalaman nyata. Ini dokumentasi kegiatan offline dari batch ke batch.</p>
  </section>

  <main style="max-width: 1360px; margin: 0 auto; padding: 16px 24px 96px">
    <div class="galeri">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="6">
        <div class="foto" style="grid-column: span {{s.c}}; grid-row: span {{s.r}}; position: relative; border-radius: 24px; overflow: hidden; background: #FFFFFF; border: 1.5px solid #E3E7F2">
          <figure class="lapis" style="margin: 0; background: #FFFFFF;">
            <div class="bingkai"><img loading="{{s.loading}}" decoding="async" src="{{s.src}}" alt="{{s.alt}}" style="width: 100%; height: 100%; display: block; object-fit: cover; object-position: {{s.pos}}"></div>
            <figcaption style="padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 13.5px; font-weight: 800; line-height: 1.3; color: #32306F">{{s.cap}}</span>
              <span style="font-size: 12.5px; line-height: 1.4; color: #55577A">{{s.desc}}</span>
            </figcaption>
          </figure>
        </div>
      </sc-for>
    </div>
  </main>
  <dc-import name="PubFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  renderVals() {
    return { slots: [
      [2, 2, "IMG-20250227-WA0034.jpg", "50% 75%", "Kebersamaan peserta · Kick-off 2025", "Foto bersama peserta"],
      [1, 1, "IMG-20250227-WA0036.jpg", "50% 70%", "Tim kegiatan · Kick-off 2025", "Dokumentasi tim kegiatan"],
      [1, 2, "IMG_7574.JPG", "center", "Peserta wisuda · Batch 6", "Dokumentasi peserta wisuda"],
      [1, 1, "IMG_7590.JPG", "center", "Sambutan pada acara wisuda · Batch 6", "Suasana sambutan di acara wisuda"],
      [2, 1, "IMG_7560.JPG", "center", "Rangkaian wisuda · Batch 6", "Dokumentasi rangkaian acara"],
      [2, 1, "IMG_7582.JPG", "center", "Kebersamaan alumni · Batch 6", "Dokumentasi kebersamaan alumni"]
    ].map(([c,r,file,pos,cap,desc],i)=>({c,r,src:"assets/photos/"+file,pos,cap,desc,alt:cap,loading:i<2?"eager":"lazy"})) };
  }
}
</script>
</body>
</html>
