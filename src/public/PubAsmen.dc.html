<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>IPB LEAP · Our Asmen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0D2B}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes blobA{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-120px,80px) scale(1.15)}66%{transform:translate(60px,140px) scale(.9)}}
@keyframes blobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(220px,-120px) scale(1.2)}}
@keyframes blobC{0%,100%{transform:translate(0,0) scale(.9)}25%{transform:translate(160px,-60px) scale(1.1)}75%{transform:translate(-140px,90px) scale(1)}}
@keyframes gridMove{from{transform:translate(0,0)}to{transform:translate(34px,34px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes shimmer{from{background-position:-500px 0}to{background-position:500px 0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}
.b-a{animation:blobA 18s ease-in-out infinite}.b-b{animation:blobB 22s ease-in-out infinite}.b-c{animation:blobC 26s ease-in-out infinite}
.gridmove{animation:gridMove 6s linear infinite}
.ring{animation:spin 26s linear infinite}
.gtext{background:linear-gradient(90deg,#FFFFFF 0%,#D4FF3A 25%,#A3D6E6 50%,#FFFFFF 75%,#D4FF3A 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 5s linear infinite}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 100%);background-size:1000px 100%;animation:shimmer 2.2s linear infinite}
.skl{background:linear-gradient(90deg,#EEF1F8 0%,#F8FAFD 50%,#EEF1F8 100%);background-size:1000px 100%;animation:shimmer 2.2s linear infinite}
.mcard{transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
.mcard:hover{transform:translateY(-8px) rotate(-1deg)}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 14px rgba(212,255,58,.14),0 30px 60px -20px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 26px rgba(212,255,58,.05),0 30px 60px -20px rgba(0,0,0,.7)}}
.orbit{animation:orbitSpin 40s linear infinite}
.orbit .sat{animation:orbitSpin 40s linear infinite reverse}
.pulseRing{animation:pulseR 2.6s ease-in-out infinite}
.chip{transition:transform .2s, background .2s}.chip:hover{transform:translateY(-2px)}
.overlay{animation:fadeIn .25s ease both}
.sheet{animation:sheetIn .45s cubic-bezier(.2,.9,.3,1.15) both}
@media (max-width: 900px){.h1{font-size:52px !important}.li-grid{flex-direction:column !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; min-height: 100%; background: linear-gradient(180deg, #32306F 0%, #2C3F8E 30%, #24306F 60%, #0E0D2B 100%); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF">
  <div style="position: sticky; top: 0; z-index: 50"><dc-import name="PubNav" active="komunitas" hint-size="100%,73px"></dc-import></div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
    <div class="b-a" style="position: absolute; right: -8%; top: 0; width: 720px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(163,214,230,.42), transparent 65%); filter: blur(50px)"></div>
    <div class="b-b" style="position: absolute; left: -12%; top: 25%; width: 680px; height: 580px; border-radius: 50%; background: radial-gradient(circle, rgba(212,255,58,.18), transparent 65%); filter: blur(60px)"></div>
    <div class="b-c" style="position: absolute; left: 35%; top: 55%; width: 640px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(110,90,230,.45), transparent 65%); filter: blur(70px)"></div>
    <div class="gridmove" style="position: absolute; inset: -60px; background-image: radial-gradient(rgba(255,255,255,.13) 1.2px, transparent 1.6px); background-size: 34px 34px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); mask-image: linear-gradient(180deg, #000, transparent 70%)"></div>
    <div class="ring" style="position: absolute; right: -200px; top: -180px; width: 640px; height: 640px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(212,255,58,.4) 40deg, transparent 90deg, rgba(163,214,230,.4) 200deg, transparent 260deg); -webkit-mask-image: radial-gradient(circle, transparent 62%, #000 63%, #000 64%, transparent 65%); mask-image: radial-gradient(circle, transparent 62%, #000 63%, #000 64%, transparent 65%)"></div>
  </div>

  <section style="position: relative; max-width: 1360px; margin: 0 auto; padding: 80px 24px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
    <div style="flex: 1 1 560px; min-width: 0">
      <span class="rise" style="display: inline-block; font-size: 12.5px; font-weight: 800; letter-spacing: .12em; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25)">KOMUNITAS · OUR ASMEN</span>
      <h1 class="rise d1 h1" style="margin: 20px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 80px; line-height: .92; letter-spacing: -.03em">Garda depan<br><span class="gtext">setiap kelompok.</span></h1>
      <p class="rise d2" style="margin: 20px 0 0; font-size: 17px; line-height: 1.7; color: rgba(255,255,255,.84)">Associate Mentor (Asmen) mendampingi mentee sehari-hari: memastikan target bergerak, mencatat sesi, dan menjembatani mentee dengan mentornya.</p>
    </div>
    <div class="rise d2" role="img" aria-label="Satu kelompok: 1 mentor, 1 asmen, 3 sampai 5 mentee" style="flex: 0 0 420px; height: 420px; position: relative">
      <div class="orbit" style="position: absolute; inset: 30px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.28)">
        <sc-for list="{{orbit}}" as="o" hint-placeholder-count="6">
          <span class="sat" style="position: absolute; left: {{o.x}}px; top: {{o.y}}px; width: {{o.s}}px; height: {{o.s}}px; border-radius: 50%; background: {{o.bg}}; color: {{o.ink}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; box-shadow: 0 12px 24px -10px rgba(0,0,0,.6)">{{o.t}}</span>
        </sc-for>
      </div>
      <div class="pulseRing" style="position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px; border-radius: 50%; background: radial-gradient(circle, #D4FF3A, #A3D6E6); color: #0D0D1A; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 0 14px rgba(212,255,58,.14), 0 30px 60px -20px rgba(0,0,0,.7)">
        <strong style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 30px; line-height: 1">ASMEN</strong><span style="font-size: 11.5px; font-weight: 800">pusat kelompok</span>
      </div>
    </div>
  </section>

  <main style="position: relative; max-width: 1360px; margin: 0 auto; padding: 24px 24px 110px">
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 40px 26px; padding-bottom: 40px">
      <sc-for list="{{shown}}" as="m" hint-placeholder-count="8">
        <article class="mcard rise" style="position: relative; animation-delay: {{m.delay}}s; margin-top: {{m.off}}px">
          <div style="position: relative; aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; padding: 3px; background: {{m.ring}}; transform: rotate({{m.tilt}}deg)">
            <div style="position: relative; width: 100%; height: 100%; border-radius: 25px; overflow: hidden; background: #15143A">
              <img src="{{m.photo}}" alt="" width="{{m.width}}" height="{{m.height}}" loading="lazy" decoding="async" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: {{m.position}}">
              <div style="position: absolute; inset: auto 0 0 0; padding: 46px 16px 16px; background: linear-gradient(180deg, transparent, rgba(14,13,43,.96))">
                <strong style="display: block; font-size: 18px; overflow-wrap: anywhere">{{m.name}}</strong>
              </div>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </main>


  <dc-import name="PubFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    const portraits = [
        {"name": "Adnan", "position": "50% 35%", "photo": "assets/photos/asmen/adnan.webp", "width": 480, "height": 640},
        {"name": "Ammar Syuhada", "position": "50% 48%", "photo": "assets/photos/asmen/ammar-syuhada.webp", "width": 427, "height": 640},
        {"name": "Fiona Hanberia Innayah", "position": "50% 30%", "photo": "assets/photos/asmen/fiona-hanberia-innayah.webp", "width": 394, "height": 640},
        {"name": "Jassuanto", "position": "50% 36%", "photo": "assets/photos/asmen/jassuanto.webp", "width": 288, "height": 640},
        {"name": "Mochammad Rochman Alfath", "position": "50% 30%", "photo": "assets/photos/asmen/mochammad-rochman-alfath.webp", "width": 427, "height": 640},
        {"name": "Muhammad Umar Jiaul Haq", "position": "50% 35%", "photo": "assets/photos/asmen/muhammad-umar-jiaul-haq.webp", "width": 640, "height": 360},
        {"name": "Rahmatina T Oktari (Tari)", "position": "50% 32%", "photo": "assets/photos/asmen/rahmatina-t-oktari.webp", "width": 572, "height": 640},
        {"name": "Richky S Kartaatmaja", "position": "50% 35%", "photo": "assets/photos/asmen/richky-s-kartaatmaja.webp", "width": 640, "height": 640},
        {"name": "Rizka Nurul Afifa", "position": "50% 35%", "photo": "assets/photos/asmen/rizka-nurul-afifa.webp", "width": 480, "height": 640},
        {"name": "Syah Deva Ammurabi", "position": "50% 35%", "photo": "assets/photos/asmen/syah-deva-ammurabi.webp", "width": 300, "height": 300},
        {"name": "Tri Restu Wahyuning Tyas", "position": "50% 22%", "photo": "assets/photos/asmen/tri-restu-wahyuning-tyas.webp", "width": 428, "height": 640}
      ];
    const frames = ['#D4FF3A,#A3D6E6','#A3D6E6,#FFFFFF','#FFFFFF,#3157A5','#6E5AE6,#D4FF3A'];
    const shown = portraits.map((portrait, i) => ({
      ...portrait,
      ring: 'linear-gradient(140deg,' + frames[i % frames.length] + ')',
      tilt: [-2, 1.5, -1, 2][i % 4],
      off: [0, 36, 12, 48][i % 4],
      delay: (i * 0.05).toFixed(2)
    }));
    const orbit = [
      { t: 'Mentor', s: 72, m: '-36px', a: -90, bg: '#FFFFFF', ink: '#32306F' },
      { t: 'Mentee', s: 56, m: '-28px', a: -18, bg: '#3157A5', ink: '#FFFFFF' },
      { t: 'Mentee', s: 56, m: '-28px', a: 54, bg: '#6E5AE6', ink: '#FFFFFF' },
      { t: 'Mentee', s: 56, m: '-28px', a: 126, bg: '#A3D6E6', ink: '#0D0D1A' },
      { t: 'Mentee', s: 56, m: '-28px', a: 198, bg: '#3157A5', ink: '#FFFFFF' },
      { t: '+1', s: 44, m: '-22px', a: 252, bg: 'rgba(255,255,255,.2)', ink: '#FFFFFF' }
    ];
    orbit.forEach((o) => { const r = o.a * Math.PI / 180; o.x = Math.round(180 + 180 * Math.cos(r) - o.s / 2 - 1); o.y = Math.round(180 + 180 * Math.sin(r) - o.s / 2 - 1); });
    return { orbit, shown };
  }
}
</script>
</body>
</html>
