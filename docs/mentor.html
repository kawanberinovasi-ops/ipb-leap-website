class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all', sel: null }; }
  renderVals() {
    const P = {
      ent: { label: 'Entrepreneur', bg: '#D4FF3A', ink: '#0D0D1A', ring: 'linear-gradient(140deg,#D4FF3A,#A3D6E6)', photo: 'linear-gradient(160deg,#3157A5,#32306F)', cover: 'linear-gradient(120deg,#32306F,#3157A5 60%,#A3D6E6)' },
      aka: { label: 'Akademisi', bg: '#A3D6E6', ink: '#0D0D1A', ring: 'linear-gradient(140deg,#A3D6E6,#FFFFFF)', photo: 'linear-gradient(160deg,#2FA3C7,#32306F)', cover: 'linear-gradient(120deg,#0E0D2B,#3157A5 60%,#A3D6E6)' },
      pro: { label: 'Professional', bg: '#FFFFFF', ink: '#32306F', ring: 'linear-gradient(140deg,#FFFFFF,#3157A5)', photo: 'linear-gradient(160deg,#3157A5,#0E0D2B)', cover: 'linear-gradient(120deg,#32306F,#6E5AE6 60%,#A3D6E6)' },
      pol: { label: 'Politik', bg: '#6E5AE6', ink: '#FFFFFF', ring: 'linear-gradient(140deg,#6E5AE6,#D4FF3A)', photo: 'linear-gradient(160deg,#6E5AE6,#32306F)', cover: 'linear-gradient(120deg,#1A1A4E,#6E5AE6 60%,#D4FF3A)' },
      sos: { label: 'Sosial', bg: '#EEFFB8', ink: '#32306F', ring: 'linear-gradient(140deg,#EEFFB8,#6E5AE6)', photo: 'linear-gradient(160deg,#2FA3C7,#3157A5)', cover: 'linear-gradient(120deg,#3157A5,#2FA3C7 60%,#EEFFB8)' }
    };
    const order = ['ent', 'aka', 'pro', 'pol', 'sos', 'ent', 'pro', 'aka', 'sos', 'pol', 'pro', 'ent'];
    const all = order.map((k, i) => ({ id: i, k: k, name: 'Nama Mentor', headline: 'Jabatan · Instansi', photo: '' }));
    const counts = {}; all.forEach((m) => { counts[m.k] = (counts[m.k] || 0) + 1; });
    const fdefs = [{ key: 'all', label: 'Semua', count: all.length }].concat(Object.keys(P).map((k) => ({ key: k, label: P[k].label, count: counts[k] || 0 })));
    const filters = fdefs.map((f) => {
      const on = this.state.f === f.key;
      return Object.assign({}, f, { sel: on ? 'true' : 'false', bg: on ? '#D4FF3A' : 'rgba(255,255,255,.08)', ink: on ? '#0D0D1A' : '#FFFFFF', bd: on ? '#D4FF3A' : 'rgba(255,255,255,.22)', pick: () => this.setState({ f: f.key }) });
