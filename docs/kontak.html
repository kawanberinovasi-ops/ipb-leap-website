<script type="text/x-dc" data-dc="PubKontak" data-props='{}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false }; }
  renderVals() { return { notSent: !this.state.sent, sent: this.state.sent, send: () => this.setState({ sent: true }) }; }
}
</script>
<script type="text/x-dc" data-dc="PubNav" data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: null };
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    const defs = [
      { key: 'home', label: 'Beranda', href: 'index.html' },
      { key: 'tentang', label: 'Tentang', href: 'tentang.html' },
      { key: 'komunitas', label: 'Komunitas', children: [
        { label: 'Our Mentor', desc: 'Alumni IPB lintas profesi', href: 'mentor.html', short: 'MT', tint: '#E7E6F3' },
        { label: 'Our Asmen', desc: 'Associate Mentor tiap kelompok', href: 'asmen.html', short: 'AS', tint: '#E4EBF8' },
        { label: 'Our Mentee', desc: 'Talenta muda di lima pathway', href: 'mentee.html', short: 'MN', tint: '#E3F3F8' }
      ] },
      { key: 'kegiatan', label: 'Kegiatan', href: 'kegiatan.html' },
      { key: 'showcase', label: 'Leap Showcase', href: 'showcase.html' },
      { key: 'prestasi', label: 'Prestasi', href: 'prestasi.html' },
      { key: 'event', label: 'Event', href: 'event.html' },
      { key: 'kontak', label: 'Kontak', href: 'kontak.html' }
    ];
    const items = defs.map((m) => {
      const on = m.key === active;
      const open = this.state.open === m.key;
      return Object.assign({}, m, {
        isLink: !m.children, hasChildren: !!m.children, open: open,
        expanded: open ? 'true' : 'false', current: on ? 'page' : 'false',
        style: 'display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 12px; border: 0; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; ' + (on ? 'background: #32306F; color: #FFFFFF; font-weight: 700' : 'background: transparent; color: #33355A; font-weight: 600'),
        toggle: () => this.setState({ open: open ? null : m.key })
      });
    });
    return { items: items };
  }
}
</script>
<script type="text/x-dc" data-dc="PubFooter" data-props='{}'>

</script>
