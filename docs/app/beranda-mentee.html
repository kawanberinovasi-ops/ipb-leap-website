<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes dash{0%{transform:translateX(-30%);opacity:0}30%{opacity:1}100%{transform:translateX(70%);opacity:0}}

.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1.15) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}
.lift{transition:transform .18s, box-shadow .18s}

.speed{animation:dash 2.8s ease-in-out infinite}.s2{animation-delay:.7s}.s3{animation-delay:1.4s}
.hop{animation:hop .9s cubic-bezier(.3,1.4,.5,1) both}
.btn{transition:transform .18s, box-shadow .18s}
.btn:hover{transform:translateY(-2px)}
textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  constructor(props) {

  renderVals() {
    const defs = [
      { id: 't1', title: 'RSVP Sesi Mentoring #6', meta: 'Sab, 18 Okt', tag: 'Event', tagBg: '#E4EBF8', tagInk: '#3157A5' },
      { id: 't2', title: 'Update progres Oktober', meta: 'Tenggat 31 Okt', tag: 'Wajib', tagBg: '#FEF3C7', tagInk: '#92400E' },
      { id: 't3', title: 'Feedback 360° untuk Asmen & Mentor', meta: 'Dibuka 25 Okt', tag: 'Penilaian', tagBg: '#EEFFB8', tagInk: '#3A4A00' },
      { id: 't4', title: 'Unggah draft proposal final project', meta: 'Tenggat 15 Nov', tag: 'Project', tagBg: '#E7E6F3', tagInk: '#32306F' }
    ];
    const done = this.state.done;
    const tasks = defs.map((d) => {
      const on = !!done[d.id];
      return Object.assign({}, d, {
        pressed: on ? 'true' : 'false',
        mark: on ? '✓' : '',
        rowStyle: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 16px; border: 1px solid ' + (on ? '#E3E7F2' : '#EEF0F7') + '; background: ' + (on ? '#F7F8FC' : '#FFFFFF') + '; font: inherit; cursor: pointer; color: #0D0D1A',
        boxStyle: 'width: 24px; height: 24px; flex: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #0D0D1A; ' + (on ? 'background: #D4FF3A; border: 2px solid #D4FF3A' : 'background: #FFFFFF; border: 2px solid #C9CFE2'),
        titleStyle: 'font-size: 14.5px; font-weight: 700; ' + (on ? 'text-decoration: line-through; color: #8A8CA8' : ''),
        toggle: () => { const n = Object.assign({}, this.state.done); n[d.id] = !on; this.setState({ done: n }); }
      });
    });
    return {
      score: '86,4',
      tasks: tasks,
      doneCount: tasks.filter((t) => done[t.id]).length,
      updateOpen: this.state.update,
      sent: this.state.sent,
      notSent: !this.state.sent,
      openUpdate: () => this.setState({ update: true, sent: false }),
      closeUpdate: () => this.setState({ update: false, sent: false }),
      sendUpdate: () => { const n = Object.assign({}, this.state.done); n.t2 = true; this.setState({ sent: true, done: n }); }
    };
  }
}

          assessmentLink('Hasil KPI','Ajukan hasil aktual M3/M6/M9/M12 dan portfolio','hasil-kpi.html','HK'),
          assessmentLink('Raport','Hasil penilaian yang sudah diterbitkan','raport.html','RP','#EEFFB8')
        ] }
      ].concat(tail, [{ key: 'task', label: 'Task', href: 'beranda-mentee.html' }]),
      asmen: [
        { key: 'beranda', label: 'Beranda', href: 'kelompok.html' },
        { key: 'kelompok', label: 'Kelompok', children: asmenFlow }
      ].concat(tail, [{ key: 'task', label: 'Task', href: 'kelompok.html' }]),
      pengurus: [
        { key: 'beranda', label: 'Beranda', href: 'beranda-pengurus.html' },
        programP,
        { key: 'workspace', label: 'Workspace', children: wsBase }
      ].concat(tail, [{ key: 'task', label: 'Task', href: 'proker.html' }]),
      bendahara: [
        { key: 'beranda', label: 'Beranda', href: 'beranda-pengurus.html' },
        programP,
        { key: 'workspace', label: 'Workspace', children: wsBase.concat([{ label: 'Keuangan', desc: 'Khusus Bendahara: cashflow & RAB', href: 'keuangan.html', short: 'Rp', tint: '#EEFFB8' }]) }
      ].concat(tail, [{ key: 'task', label: 'Task', href: 'proker.html' }]),
      superadmin: [
        { key: 'beranda', label: 'Sistem', href: 'super-admin.html' },

        { key: 'data', label: 'Data & Batch', href: 'super-admin.html' },
        { key: 'audit', label: 'Audit Log', href: 'super-admin.html' }
      ]
    };
    menus.mentor = [menus.asmen[0],{key:'kelompok',label:'Kelompok',children:mentorFlow}].concat(tail,[menus.asmen.at(-1)]);
    const people = {
      mentee: { name: 'Nabila Putri', subtitle: 'Mentee · Kelompok Rajawali', initials: 'NP', avatarBg: 'linear-gradient(135deg,#3157A5,#A3D6E6)', roleLabel: 'Mentee', roleBg: '#E3F3F8', roleInk: '#1F5566' },
      asmen: { name: 'Raka Pratama', subtitle: 'Asmen · Kelompok Rajawali', initials: 'RP', avatarBg: 'linear-gradient(135deg,#32306F,#3157A5)', roleLabel: 'Asmen', roleBg: '#E4EBF8', roleInk: '#3157A5' },
      mentor: { name: 'Dian Hapsari', subtitle: 'Mentor · Kelompok Rajawali', initials: 'DH', avatarBg: 'linear-gradient(135deg,#0D0D1A,#32306F)', roleLabel: 'Mentor', roleBg: '#E7E6F3', roleInk: '#32306F' },
      pengurus: { name: 'Head of Operations', subtitle: 'Steering Team IPB Leap 2026', initials: 'HO', avatarBg: 'linear-gradient(135deg,#32306F,#7DBBD0)', roleLabel: 'Pengurus', roleBg: '#D4FF3A', roleInk: '#0D0D1A' },
      bendahara: { name: 'Bendahara', subtitle: 'Steering Team IPB Leap 2026', initials: 'BD', avatarBg: 'linear-gradient(135deg,#32306F,#7DBBD0)', roleLabel: 'Bendahara', roleBg: '#D4FF3A', roleInk: '#0D0D1A' },
      superadmin: { name: 'Super Admin', subtitle: 'Penjaga sistem & data', initials: 'SA', avatarBg: 'linear-gradient(135deg,#0D0D1A,#E5484D)', roleLabel: 'Super Admin', roleBg: '#0D0D1A', roleInk: '#D4FF3A' }
    };
    const p = people[role] || people.mentee;
    const scopedHref=(href)=>{if(!href)return href;const u=new URL(href,location.href);if(/(?:poc|abc|mentoring|hasil-kpi|catat-sesi|progres|penilaian|raport|observer|kelompok-penilaian)\.html$/.test(u.pathname)){
      const current=new URLSearchParams(location.search);for(const key of ['cohort','mentee','group','period','record','source'])if(current.has(key)&&!u.searchParams.has(key))u.searchParams.set(key,current.get(key));
      if(location.pathname.includes('/review-penilaian/'))u.searchParams.set('peran',role==='pengurus'?'program':role);
      return u.pathname+u.search;}return href;};
    const items = (menus[role] || menus.mentee).map((m) => {
      m=Object.assign({},m,{href:scopedHref(m.href),children:m.children?.map(ch=>Object.assign({},ch,{href:scopedHref(ch.href)}))});
      const on = m.key === active;
      const open = this.state.open === m.key;
      return Object.assign({}, m, {
        isLink: !m.children,
        hasChildren: !!m.children,
        open: open,
        expanded: open ? 'true' : 'false',
        current: on ? 'page' : 'false',
        style: 'display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; font: inherit; font-size: 14.5px; cursor: pointer; text-decoration: none; ' + (on ? 'background: ' + c.navOnBg + '; color: ' + c.navOnInk + '; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 18px -10px rgba(50,48,111,.8)' : 'background: transparent; color: ' + c.navInk + '; font-weight: 600'),
        toggle: () => this.setState({ open: open ? null : m.key, notif: false, me: false })
      });
    });
    return Object.assign({}, p, {
      c: c,
      ...(actor?{name:actor.display_name,subtitle:granted.map(r=>({mentee:'Mentee',asmen:'Asmen',mentor:'Mentor',program:'Pengurus',finance:'Bendahara',system:'Super Admin'}[r]||r)).join(' · '),initials:(actor.display_name||'').split(/\s+/).slice(0,2).map(n=>n[0]).join('')}:{}),
      logout: async(e)=>{e.preventDefault();if(location.pathname.includes('/review-penilaian/')){location.href='index.html';return;}try{await(await import(new URL('../assets/assessment/session.mjs',location.href).href)).signOut(e);}catch(error){alert(error.message||'Belum berhasil keluar. Coba lagi.');}},
      items: items,
      homeHref: items[0].href,
      notifOpen: this.state.notif,
      meOpen: this.state.me,
      notifExpanded: this.state.notif ? 'true' : 'false',
      meExpanded: this.state.me ? 'true' : 'false',
      toggleNotif: () => this.setState({ notif: !this.state.notif, me: false, open: null }),
      toggleMe: () => this.setState({ me: !this.state.me, notif: false, open: null })
    });
  }
}
