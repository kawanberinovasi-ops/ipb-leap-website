<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/file-manager.html">

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.rise{animation:rise .35s cubic-bezier(.2,.9,.3,1.15) both}
.toast{animation:toast 2.2s ease both}
.item{transition:transform .15s, box-shadow .15s}
.item:hover{transform:translateY(-3px);box-shadow:0 16px 30px -20px rgba(50,48,111,.55)}
.side:hover{background:#EEF1F8}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="FileManager"></div>
<template data-dc="FileManager">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="pengurus" active="workspace" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; min-height: 860px">
      <aside style="flex: 1 1 220px; max-width: 250px; min-width: 0; padding: 16px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0 0 10px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 24px; color: #32306F">File Manager</h1>
        <label style="height: 46px; border-radius: 14px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-bottom: 10px">+ Unggah<input type="file" onChange="{{onUpload}}" style="position: absolute; left: -9999px"></label>
        <button class="side" type="button" onClick="{{goRoot}}" style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 0; background: #EEF2FC; font: inherit; font-size: 14px; font-weight: 800; color: #32306F; cursor: pointer; text-align: left">Shared Drive IPB LEAP</button>
        <button class="side" type="button" style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #33355A; cursor: pointer; text-align: left">Drive saya</button>
        <button class="side" type="button" style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #33355A; cursor: pointer; text-align: left">Terbaru</button>
        <button class="side" type="button" style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #33355A; cursor: pointer; text-align: left">Berbintang</button>
        <button class="side" type="button" style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #33355A; cursor: pointer; text-align: left">Sampah</button>
        <div style="margin-top: auto; padding: 14px; border-radius: 16px; background: #F5F7FC; font-size: 12.5px; color: #55577A">
          <div style="display: flex; align-items: center; gap: 6px; font-weight: 800; color: #166534; margin-bottom: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #16A34A"></span>Tersambung via akun Google</div>
          <div style="height: 6px; border-radius: 6px; background: #E3E7F2; overflow: hidden"><div style="width: 38%; height: 100%; background: #3157A5"></div></div>
          <span style="display: block; margin-top: 6px">38 GB dari 100 GB terpakai</span>
        </div>
      </aside>

      <section style="flex: 999 1 520px; min-width: 0; padding: 18px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
          <nav aria-label="Lokasi folder" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 15px">
            <sc-for list="{{crumbs}}" as="c" hint-placeholder-count="2">
              <button type="button" onClick="{{c.go}}" style="{{c.style}}">{{c.name}}</button><span style="{{c.sepStyle}}">›</span>
            </sc-for>
          </nav>
          <div style="display: flex; gap: 6px; align-items: center">
            <input type="search" aria-label="Cari di Drive" placeholder="Cari file…" style="height: 38px; width: 200px; padding: 0 12px; border-radius: 12px; border: 1px solid #E3E7F2; background: #F5F7FC; font: inherit; font-size: 13px">
            <button type="button" onClick="{{newFolder}}" style="height: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">+ Folder</button>
            <div role="group" aria-label="Tampilan" style="display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: #E9EDF7">
              <button type="button" onClick="{{asGrid}}" aria-pressed="{{gridPressed}}" style="{{gridStyle}}">Grid</button>
              <button type="button" onClick="{{asList}}" aria-pressed="{{listPressed}}" style="{{listStyle}}">List</button>
            </div>
          </div>
        </div>

        <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
          <div class="rise" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px">
            <sc-for list="{{entries}}" as="e" hint-placeholder-count="8">
              <button class="item" type="button" onClick="{{e.click}}" aria-pressed="{{e.pressed}}" style="{{e.cardStyle}}">
                <span aria-hidden="true" style="height: 88px; border-radius: 14px; background: {{e.thumb}}; display: flex; align-items: center; justify-content: center; position: relative">
                  <span style="{{e.iconStyle}}"></span>
                </span>
                <span style="display: block; margin-top: 10px; font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{e.name}}</span>
                <span style="display: block; font-size: 12px; color: #6B6D8C; text-align: left">{{e.meta}}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
          <div class="rise" style="display: flex; flex-direction: column">
            <sc-for list="{{entries}}" as="e" hint-placeholder-count="8">
              <button type="button" onClick="{{e.click}}" aria-pressed="{{e.pressed}}" style="{{e.rowStyle}}">
                <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: {{e.thumb}}; display: flex; align-items: center; justify-content: center"><span style="{{e.iconSmall}}"></span></span>
                <span style="flex: 1; min-width: 0; text-align: left; font-weight: 700; font-size: 14px">{{e.name}}</span>
                <span style="width: 140px; font-size: 12.5px; color: #6B6D8C; text-align: left">{{e.owner}}</span>
                <span style="width: 120px; font-size: 12.5px; color: #6B6D8C; text-align: left">{{e.meta}}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </section>

      <aside style="flex: 1 1 280px; max-width: 330px; min-width: 0; padding: 18px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column; gap: 12px">
        <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
          <div class="rise" style="display: flex; flex-direction: column; gap: 12px">
            <div style="height: 200px; border-radius: 18px; background: {{sel.thumb}}; padding: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
              <div style="width: 70%; height: 100%; border-radius: 8px; background: #FFFFFF; box-shadow: 0 14px 24px -14px rgba(13,13,26,.5); padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
                <span style="height: 8px; width: 60%; border-radius: 4px; background: {{sel.color}}"></span>
                <span style="height: 5px; width: 90%; border-radius: 3px; background: #E3E7F2"></span>
                <span style="height: 5px; width: 75%; border-radius: 3px; background: #E3E7F2"></span>
                <span style="height: 5px; width: 85%; border-radius: 3px; background: #E3E7F2"></span>
                <span style="height: 5px; width: 60%; border-radius: 3px; background: #E3E7F2"></span>
              </div>
            </div>
            <div><strong style="display: block; font-size: 16px; word-break: break-word">{{sel.name}}</strong><span style="font-size: 12.5px; color: #6B6D8C">{{sel.kind}} · {{sel.meta}} · oleh {{sel.owner}}</span></div>
            <a href="{{sel.url}}" target="_blank" rel="noopener" style="height: 44px; border-radius: 14px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font-weight: 800; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center">{{sel.openLabel}} ↗</a>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button type="button" style="height: 40px; border-radius: 12px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Unduh</button>
              <button type="button" style="height: 40px; border-radius: 12px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Bagikan</button>
              <button type="button" onClick="{{rename}}" style="height: 40px; border-radius: 12px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Ganti nama</button>
              <button type="button" onClick="{{trash}}" style="height: 40px; border-radius: 12px; border: 1px solid rgba(229,72,77,.35); background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; color: #C2363B; cursor: pointer">Ke sampah</button>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Pindahkan ke folder
              <span style="display: flex; gap: 6px">
                <select aria-label="Folder tujuan" onChange="{{onTarget}}" style="flex: 1; height: 40px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13px; background: #FFFFFF">
                  <option value="">Pilih folder…</option>
                  <option value="root">Shared Drive IPB LEAP</option>
                  <option value="f1">Proker</option>
                  <option value="f1a">Proker › Leadership Camp</option>
                  <option value="f2">Keuangan</option>
                  <option value="f3">Branding &amp; Desain</option>
                  <option value="f4">Partner &amp; Sponsor</option>
                  <option value="f5">Arsip Surat</option>
                </select>
                <button type="button" onClick="{{move}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">Pindah</button>
              </span>
            </label>
            <div style="padding: 12px; border-radius: 14px; background: #F5F7FC; font-size: 12.5px; color: #55577A; line-height: 1.5">Akses mengikuti role: pengurus bisa edit, peserta hanya melihat file yang dibagikan.</div>
          </div>
        </sc-if>
        <sc-if value="{{noSel}}" hint-placeholder-val="{{ false }}">
          <div style="margin: auto; text-align: center; color: #6B6D8C; font-size: 14px; line-height: 1.6">Pilih file untuk melihat preview,<br>membuka, atau memindahkannya.</div>
        </sc-if>
      </aside>
    </div>
  </main>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 14px 20px; border-radius: 16px; background: #0D0D1A; color: #FFFFFF; font-weight: 700; font-size: 14px; z-index: 90">{{toastText}}</div>
  </sc-if>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; gap: 6px; cursor: pointer">Batch 2026
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="position: relative">
          <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
          </sc-if>
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="{{it.style}}">{{it.label}}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 310px; padding: 8px; border-radius: 20px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{it.children}}" as="ch" hint-placeholder-count="3">
                  <a href="{{ch.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: {{c.ink}}">
                    <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #32306F">{{ch.short}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ch.label}}</span><span style="font-size: 12.5px; color: {{c.muted}}; line-height: 1.4">{{ch.desc}}</span></span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; position: relative">
      <button type="button" aria-label="Cari (Ctrl K)" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line2}}; background: {{c.field}}; font: inherit; font-size: 13px; color: {{c.muted}}; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span>Cari</span><span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: {{c.chip}}; border: 1px solid {{c.line2}}">⌘K</span>
      </button>
      <button type="button" aria-label="Tambah cepat" title="Task, note, atau event baru" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #32306F, #3157A5); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.3)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <a href="chat.html" aria-label="Chat, 5 pesan baru" style="position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{c.icon}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>
        <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #3157A5; color: #FFFFFF; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.ring}}">5</span>
      </a>
      <button type="button" onClick="{{toggleNotif}}" aria-label="Notifikasi, 3 belum dibaca" aria-expanded="{{notifExpanded}}" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{c.icon}}; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: #D4FF3A; border: 2px solid #32306F"></span>
      </button>
      <button type="button" onClick="{{toggleMe}}" aria-expanded="{{meExpanded}}" aria-label="Menu akun" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 4px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; cursor: pointer; font: inherit">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: {{avatarBg}}; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{initials}}</span>
        <span style="font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: {{roleBg}}; color: {{roleInk}}">{{roleLabel}}</span>
      </button>

      <sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; top: 56px; right: 40px; width: 360px; padding: 16px; border-radius: 22px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><strong style="font-size: 15px">Notifikasi</strong><span style="font-size: 12.5px; font-weight: 700; color: {{c.link}}">Tandai dibaca</span></div>
          <div style="display: flex; flex-direction: column">
