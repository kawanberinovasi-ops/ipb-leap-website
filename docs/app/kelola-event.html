<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tambah Event · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Tambah Event · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/kelola-event.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.spin{animation:spin 18s linear infinite}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="KelolaEvent"></div>
<template data-dc="KelolaEvent">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="pengurus" active="program" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px">
      <div>
        <a href="event.html" style="font-size: 14px; font-weight: 700; text-decoration: none">← Upcoming Event</a>
        <h1 style="margin: 8px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 48px; letter-spacing: -.02em; color: #32306F; line-height: 1">Tambah event</h1>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 14px; border-radius: 16px; background: #FFFFFF; border: 1px dashed #A3B4DA; flex: 0 1 520px">
        <span style="font-size: 13px; font-weight: 700; color: #55577A; white-space: nowrap">Event HA / CDA?</span>
        <input type="url" aria-label="Tautan event eksternal" placeholder="Tempel tautan, judul &amp; gambar terisi otomatis" style="flex: 1; min-width: 0; height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid #E3E7F2; font: inherit; font-size: 13px">
        <button type="button" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">Ambil</button>
      </div>
    </div>

    <sc-if value="{{notPublished}}" hint-placeholder-val="{{ true }}">
      <div class="rise" style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <section style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

          <div style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
            <h2 style="margin: 0 0 14px; font-size: 17px; font-weight: 800">1 · Poster</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
              <label style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 18px; border: 2px dashed #A3B4DA; background: #F8F9FD; cursor: pointer; font-size: 13.5px; font-weight: 700">Unggah poster (4:5 atau 1:1)<input type="file" accept="image/*" onChange="{{onPoster}}" style="font: inherit; font-size: 12.5px; color: #6B6D8C"></label>
              <div style="flex: 1 1 220px">
                <span style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px">atau poster otomatis, pilih tema</span>
                <div style="display: flex; gap: 8px">
                  <sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
                    <button type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" aria-pressed="{{t.pressed}}" style="width: 44px; height: 44px; border-radius: 14px; cursor: pointer; background: {{t.bg}}; border: 3px solid {{t.ring}}"></button>
                  </sc-for>
                </div>
              </div>
            </div>
          </div>

          <div style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 17px; font-weight: 800">2 · Info event</h2>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Judul event<input type="text" value="{{title}}" onChange="{{onTitle}}" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 15px; font-weight: 700"></label>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Penyelenggara<select onChange="{{onOrg}}" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>IPB LEAP</option><option>HA IPB</option><option>CDA IPB</option><option>Mitra</option></select></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Kategori<select style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Workshop</option><option>Kelas</option><option>Talkshow</option><option>Camp</option><option>Career</option></select></label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Deskripsi<textarea rows="3" style="resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; line-height: 1.5">Latihan public speaking intensif bareng praktisi: struktur pesan, storytelling, dan sesi praktik dengan feedback langsung.</textarea></label>
          </div>

          <div style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 17px; font-weight: 800">3 · Waktu &amp; tempat pelaksanaan</h2>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Tanggal<input type="date" value="2026-11-21" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Sampai<input type="date" value="2026-11-21" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Mulai (WIB)<input type="time" value="09:00" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Selesai (WIB)<input type="time" value="12:00" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
            </div>
            <div>
              <span style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px">Format</span>
              <div role="radiogroup" aria-label="Format event" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
                <sc-for list="{{formats}}" as="f" hint-placeholder-count="3">
                  <button type="button" role="radio" aria-checked="{{f.checked}}" onClick="{{f.pick}}" style="{{f.style}}"><strong style="display: block; font-size: 14.5px">{{f.label}}</strong><span style="font-size: 12px; opacity: .8">{{f.hint}}</span></button>
                </sc-for>
              </div>
            </div>
            <sc-if value="{{needPlace}}" hint-placeholder-val="{{ true }}">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Lokasi<input type="text" value="Auditorium Andi Hakim Nasoetion, Kampus IPB Dramaga" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
            </sc-if>
            <sc-if value="{{needLink}}" hint-placeholder-val="{{ false }}">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Link online<span style="display: flex; gap: 8px"><input type="url" value="Dibuat otomatis: Google Meet" style="flex: 1; height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"><button type="button" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Pakai Zoom</button></span></label>
            </sc-if>
          </div>

          <div style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 17px; font-weight: 800">4 · Pendaftaran</h2>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Dibuka<input type="date" value="2026-10-20" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Ditutup<input type="date" value="2026-11-15" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 700">Kuota<input type="number" value="150" style="height: 44px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px"></label>
            </div>
            <div>
              <span style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px">Daftar di mana</span>
              <div role="radiogroup" aria-label="Tempat pendaftaran" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <button type="button" role="radio" aria-checked="{{platPressed}}" onClick="{{usePlat}}" style="{{platStyle}}"><strong style="display: block; font-size: 14.5px">Di platform</strong><span style="font-size: 12px; opacity: .8">1 klik, data dari profil</span></button>
                <button type="button" role="radio" aria-checked="{{extPressed}}" onClick="{{useExt}}" style="{{extStyle}}"><strong style="display: block; font-size: 14.5px">Tautan eksternal</strong><span style="font-size: 12px; opacity: .8">Form/situs penyelenggara</span></button>
              </div>
            </div>
            <sc-if value="{{isExt}}" hint-placeholder-val="{{ false }}">
              <input type="url" aria-label="Tautan pendaftaran" placeholder="https://…" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px">
            </sc-if>
            <div>
              <span style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px">Boleh daftar</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{targets}}" as="t" hint-placeholder-count="5">
                  <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; font-weight: 600">
              <label style="display: flex; gap: 8px; align-items: center"><input type="checkbox" checked=""> Daftar tunggu otomatis saat penuh</label>
              <label style="display: flex; gap: 8px; align-items: center"><input type="checkbox" checked=""> Presensi scan QR ID card</label>
              <label style="display: flex; gap: 8px; align-items: center"><input type="checkbox" checked=""> E-sertifikat untuk yang hadir</label>
            </div>
            <div>
              <span style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px">Pertanyaan tambahan (opsional)</span>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{questions}}" as="q" hint-placeholder-count="1">
                  <div style="display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 13px; background: #F8F9FD; font-size: 14px"><span style="flex: 1; font-weight: 600">{{q.text}}</span><span style="font-size: 12px; font-weight: 700; color: #6B6D8C">{{q.type}}</span><button type="button" onClick="{{q.remove}}" aria-label="Hapus pertanyaan" style="width: 28px; height: 28px; border-radius: 8px; border: 1px solid #E3E7F2; background: #FFFFFF; cursor: pointer; color: #B42318">×</button></div>
                </sc-for>
                <button type="button" onClick="{{addQ}}" style="align-self: flex-start; height: 38px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed #A3B4DA; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #3157A5; cursor: pointer">+ Tambah pertanyaan</button>
              </div>
            </div>
          </div>

          <div style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
            <h2 style="margin: 0 0 12px; font-size: 17px; font-weight: 800">5 · Syarat &amp; ketentuan</h2>
            <textarea rows="5" aria-label="Syarat dan ketentuan" style="width: 100%; box-sizing: border-box; resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; line-height: 1.6">1. Peserta aktif IPB LEAP Batch 2026 atau mahasiswa IPB.
2. Wajib hadir penuh untuk mendapatkan e-sertifikat.
3. Konfirmasi kehadiran paling lambat H-1; yang batal tanpa kabar tidak diprioritaskan di event berikutnya.
4. Dokumentasi kegiatan dapat dipakai untuk publikasi IPB LEAP.</textarea>
            <p style="margin: 8px 0 0; font-size: 12.5px; color: #6B6D8C">Pendaftar wajib mencentang persetujuan S&amp;K sebelum daftar.</p>
          </div>
        </section>

        <aside style="flex: 1 1 320px; max-width: 380px; min-width: 0; position: sticky; top: 96px; display: flex; flex-direction: column; gap: 14px">
          <span style="font-size: 13px; font-weight: 800; color: #6B6D8C">Pratinjau kartu event</span>
          <div style="padding: 8px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 24px 50px -30px rgba(50,48,111,.6)">
            <div style="position: relative; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: {{theme.bg}}; color: {{theme.ink}}; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
              <sc-if value="{{hasPoster}}" hint-placeholder-val="{{ false }}">
                <img src="{{poster}}" alt="Poster event" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
              </sc-if>
              <sc-if value="{{noPoster}}" hint-placeholder-val="{{ true }}">
                <div aria-hidden="true" class="spin" style="position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 18px dashed {{theme.accent}}; opacity: .55"></div>
              </sc-if>
              <sc-if value="{{noPoster}}" hint-placeholder-val="{{ true }}">
                <div aria-hidden="true" style="position: absolute; left: -30px; bottom: 80px; width: 140%; height: 34px; background: {{theme.accent}}; transform: rotate(-12deg); opacity: .9"></div>
              </sc-if>
              <span style="position: relative; align-self: flex-start; font-size: 11px; font-weight: 900; letter-spacing: .1em; padding: 5px 9px; border-radius: 7px; background: rgba(255,255,255,.92); color: #0D0D1A">{{org}}</span>
              <sc-if value="{{noPoster}}" hint-placeholder-val="{{ true }}">
                <div style="position: relative">
                  <span style="display: block; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 32px; line-height: .95; letter-spacing: -.02em">{{title}}</span>
                  <span style="display: block; margin-top: 12px; font-size: 13px; font-weight: 800">Sab, 21 Nov · 09.00–12.00 WIB</span>
                </div>
              </sc-if>
            </div>
            <div style="padding: 14px 6px 6px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: #FEF3C7; color: #92400E">Segera Dibuka</span><span style="font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: #E4EBF8; color: #3157A5">{{formatLabel}}</span></div>
              <strong style="font-size: 15.5px">{{title}}</strong>
              <span style="font-size: 12.5px; color: #55577A">Daftar 20 Okt – 15 Nov · {{whereLabel}} · kuota 150</span>
            </div>
          </div>
          <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; font-weight: 600"><input type="checkbox" checked="" style="margin-top: 3px"> Kirim notifikasi ke target saat pendaftaran dibuka</label>
          <button class="btn" type="button" onClick="{{publish}}" style="height: 54px; border-radius: 18px; border: 0; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Terbitkan event</button>
          <button type="button" style="height: 44px; border-radius: 14px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Simpan draft</button>
        </aside>
      </div>
    </sc-if>

    <sc-if value="{{published}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="max-width: 560px; margin: 40px auto; text-align: center; padding: 40px; border-radius: 32px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
        <div aria-hidden="true" style="width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 28px; background: #D4FF3A; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; transform: rotate(-6deg)">✓</div>
        <h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 32px; color: #32306F">Event terbit!</h2>
        <p style="margin: 10px 0 24px; font-size: 15px; line-height: 1.6; color: #55577A">"{{title}}" tampil di Upcoming Event semua target, masuk kalender Program IPB LEAP, dan notifikasi terkirim saat pendaftaran dibuka 20 Okt.</p>
        <a href="event.html" style="display: inline-flex; height: 48px; padding: 0 18px; border-radius: 14px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font-weight: 800; text-decoration: none; align-items: center">Lihat di Upcoming Event</a>
      </div>
    </sc-if>
  </main>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; gap: 6px; cursor: pointer">Batch 2026
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">

        style: 'display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; font: inherit; font-size: 14.5px; cursor: pointer; text-decoration: none; ' + (on ? 'background: ' + c.navOnBg + '; color: ' + c.navOnInk + '; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 18px -10px rgba(50,48,111,.8)' : 'background: transparent; color: ' + c.navInk + '; font-weight: 600'),
        toggle: () => this.setState({ open: open ? null : m.key, notif: false, me: false })
      });
    });
    return Object.assign({}, p, {
      c: c,
      ...(actor?{name:actor.display_name,subtitle:granted.map(r=>({mentee:'Mentee',asmen:'Asmen',mentor:'Mentor',program:'Pengurus',finance:'Bendahara',system:'Super Admin'}[r]||r)).join(' · '),initials:(actor.display_name||'').split(/\s+/).slice(0,2).map(n=>n[0]).join('')}:{}),
      logout: async(e)=>{e.preventDefault();if(location.pathname.includes('/review-penilaian/')){location.href='index.html';return;}try{await(await import(new URL('../assets/assessment/session.mjs',location.href).href)).signOut(e);}catch(error){alert(error.message||'Belum berhasil keluar. Coba lagi.');}},
      items: items,
      homeHref: items[0].href,
      notifOpen: this.state.notif,
      meOpen: this.state.me,
      notifExpanded: this.state.notif ? 'true' : 'false',
      meExpanded: this.state.me ? 'true' : 'false',
      toggleNotif: () => this.setState({ notif: !this.state.notif, me: false, open: null }),
      toggleMe: () => this.setState({ me: !this.state.me, notif: false, open: null })
    });
  }
}
</script>
<script src="../assets/leap-runtime.js"></script>
</body>
