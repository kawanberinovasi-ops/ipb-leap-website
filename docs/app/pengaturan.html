<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengaturan · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Pengaturan · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/pengaturan.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-120%) rotate(18deg)}60%,100%{transform:translateX(220%) rotate(18deg)}}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}15%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
.rise{animation:rise .4s cubic-bezier(.2,.9,.3,1.15) both}
.sheen{animation:sheen 4.5s ease-in-out infinite}
.toast{animation:toast 2.4s ease both}
.theme-all,.theme-all *{transition:background-color .35s, color .35s, border-color .35s}
.tab:hover{filter:brightness(.97)}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.16)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="Settings"></div>
<template data-dc="Settings">
<div class="theme-all" style="min-height: 100vh; background: {{t.page}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{t.ink}}">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="{{role}}" active="none" theme="{{themeName}}" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px">
      <div>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">Akun kamu</span>
        <h1 style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 50px; letter-spacing: -.02em; color: {{t.brand}}; line-height: 1">Pengaturan</h1>
      </div>
      <div role="group" aria-label="Pratinjau sebagai role" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; border-radius: 14px; background: {{t.soft}}">
        <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; padding: 0 8px; align-self: center">Pratinjau:</span>
        <sc-for list="{{roleTabs}}" as="r" hint-placeholder-count="4">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <aside style="flex: 1 1 240px; max-width: 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 26px; background: {{t.card}}; border: 1px solid {{t.line}}">
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="7">
          <button class="tab" type="button" onClick="{{tb.pick}}" aria-current="{{tb.current}}" style="{{tb.style}}">
            <span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: {{tb.iconBg}}; color: {{tb.iconInk}}; font-size: 11.5px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{tb.short}}</span>
            <span>{{tb.label}}</span>
          </button>
        </sc-for>
        <div style="height: 1px; background: {{t.line}}; margin: 8px 4px"></div>
        <a class="btn" href="index.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(229,72,77,.1); color: #E5484D; font-weight: 800; font-size: 14px; text-decoration: none">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"></path></svg>
          Keluar
        </a>
      </aside>

      <section class="rise" style="flex: 999 1 640px; min-width: 0">

        <sc-if value="{{is.profil}}" hint-placeholder-val="{{ true }}">
          <div style="{{s.card}}">
            <h2 style="{{s.h2}}">Profil &amp; data pribadi</h2>
            <p style="{{s.sub}}">Diisi sekali, dipakai di ID card, pendaftaran event, raport, dan sertifikat.</p>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px">
              <label style="{{s.label}}">Nama lengkap<input type="text" value="{{person.name}}" style="{{s.input}}"></label>
              <label style="{{s.label}}">Nama panggilan<input type="text" value="{{person.nick}}" style="{{s.input}}"></label>
              <label style="{{s.label}}">Email <span style="font-size: 11.5px; font-weight: 800; color: #16A34A">✓ terverifikasi OTP</span><input type="email" value="{{person.email}}" disabled="" style="{{s.inputOff}}"></label>
              <label style="{{s.label}}">Nomor WhatsApp<input type="tel" value="0812 3456 7890" style="{{s.input}}"></label>
              <sc-if value="{{isStudent}}" hint-placeholder-val="{{ true }}">
                <label style="{{s.label}}">Fakultas / Prodi<input type="text" value="FEM · Agribisnis" style="{{s.input}}"></label>
              </sc-if>
              <sc-if value="{{isStudent}}" hint-placeholder-val="{{ true }}">
                <label style="{{s.label}}">NIM · Angkatan<input type="text" value="H34190042 · 59" style="{{s.input}}"></label>
              </sc-if>
              <sc-if value="{{isMentor}}" hint-placeholder-val="{{ false }}">
                <label style="{{s.label}}">Instansi<input type="text" value="Perusahaan agribisnis" style="{{s.input}}"></label>
              </sc-if>
              <sc-if value="{{isMentor}}" hint-placeholder-val="{{ false }}">
                <label style="{{s.label}}">Jabatan · Alumni angkatan<input type="text" value="Head of People · 41" style="{{s.input}}"></label>
              </sc-if>
              <label style="{{s.label}}">Domisili<input type="text" value="Bogor, Jawa Barat" style="{{s.input}}"></label>
              <label style="{{s.label}}">LinkedIn<input type="url" value="linkedin.com/in/nama-kamu" style="{{s.input}}"></label>
            </div>
            <label style="{{s.label}}; margin-top: 16px">Bio singkat<textarea rows="3" style="{{s.input}}; height: auto; padding: 12px 14px; resize: vertical">Suka ngulik social enterprise dan pemberdayaan desa.</textarea></label>
            <div style="margin-top: 16px">
              <span style="{{s.labelText}}">Minat</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
                <span style="{{s.chipOn}}">Social enterprise</span><span style="{{s.chipOn}}">Kepemimpinan desa</span><span style="{{s.chipOn}}">Public speaking</span><span style="{{s.chip}}">+ Tambah</span>
              </div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 22px"><button class="btn" type="button" onClick="{{save}}" style="{{s.primary}}">Simpan perubahan</button></div>
          </div>
        </sc-if>

        <sc-if value="{{is.foto}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
            <div style="{{s.card}}; flex: 1 1 320px; min-width: 0">
              <h2 style="{{s.h2}}">Foto profil &amp; ID card</h2>
              <p style="{{s.sub}}">Satu foto dipakai untuk avatar akun dan ID card. Rasio 3:4, wajah terlihat jelas, latar polos.</p>
              <label style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; padding: 28px; border-radius: 22px; border: 2px dashed {{t.dash}}; background: {{t.soft}}; cursor: pointer; text-align: center">
                <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{t.brand}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
                <strong style="font-size: 15px">Pilih foto dari perangkat</strong>
                <span style="font-size: 12.5px; color: {{t.muted}}">JPG atau PNG, maks. 5 MB</span>
                <input type="file" accept="image/*" onChange="{{onPhoto}}" style="font: inherit; font-size: 13px; color: {{t.muted}}">
              </label>
              <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px; font-size: 13px; color: {{t.muted}}">
                <span>✓ Otomatis dipotong 3:4 untuk ID card</span>
                <span>✓ Avatar di navbar, chat, dan raport ikut berganti</span>
              </div>
            </div>

            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 20px; border-radius: 28px; background: {{t.cardGlow}}; border: 1px solid {{t.line}}">
              <div style="width: 324px; height: 514px; perspective: 1400px">
                <div style="position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.3,.5,1); transform: {{flipTransform}}">
                  <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; overflow: hidden; background: #FFFFFF; color: #0D0D1A; box-shadow: 0 40px 70px -36px rgba(13,13,26,.8); display: flex; flex-direction: column">
                    <div style="position: relative; height: 190px; background: linear-gradient(135deg, #32306F, #3157A5); overflow: hidden">
                      <div aria-hidden="true" class="sheen" style="position: absolute; top: -40px; left: 0; width: 70px; height: 300px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent)"></div>
                      <div style="position: relative; padding: 18px 20px; display: flex; justify-content: space-between; align-items: flex-start">
                        <img src="../assets/logo-white.png" alt="IPB LEAP" style="height: 44px; width: auto">
                        <span style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: rgba(255,255,255,.85); text-align: right; line-height: 1.4">BATCH<br><span style="font-size: 18px; letter-spacing: 0; color: #FFFFFF">2026</span></span>
                      </div>
                    </div>
                    <div style="position: relative; margin: -86px auto 0; width: 132px; height: 176px; border-radius: 22px; overflow: hidden; background: linear-gradient(160deg, #E4EBF8, #C9D6F0); border: 5px solid #FFFFFF; box-shadow: 0 16px 30px -18px rgba(50,48,111,.8); display: flex; align-items: center; justify-content: center; color: #3157A5">
                      <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{ false }}">
                        <img src="{{photo}}" alt="Foto profil" style="width: 100%; height: 100%; object-fit: cover">
                      </sc-if>
                      <sc-if value="{{noPhoto}}" hint-placeholder-val="{{ true }}">
                        <span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg aria-hidden="true" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg><span style="font-size: 10.5px; font-weight: 800; letter-spacing: .06em">FOTO 3:4</span></span>
                      </sc-if>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14px 20px 0; text-align: center">
                      <span style="font-size: 22px; font-weight: 800; letter-spacing: -.01em">{{person.name}}</span>
                      <span style="margin-top: 8px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 16px; border-radius: 999px; background: {{card.accent}}; color: {{card.ink}}">{{card.label}}</span>
                      <span style="margin-top: 12px; font-size: 13px; color: #55577A; font-weight: 600">{{card.group}}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-top: 1px dashed #D5DAEA; font-size: 11.5px; font-weight: 700; color: #6B6D8C">
                      <span>ID {{card.id}}</span>
                      <span style="display: flex; gap: 4px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #16A34A"></span>Aktif</span>
                    </div>
                  </div>
                  <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); border-radius: 22px; overflow: hidden; background: #0E0D2B; color: #FFFFFF; box-shadow: 0 40px 70px -36px rgba(13,13,26,.8); display: flex; flex-direction: column; align-items: center; padding: 28px 24px; box-sizing: border-box">
                    <span style="font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #A3D6E6">SCAN UNTUK VERIFIKASI &amp; PRESENSI</span>
                    <div role="img" aria-label="QR code verifikasi dan presensi" style="margin-top: 18px; padding: 14px; border-radius: 18px; background: #FFFFFF">
                      <div style="display: grid; grid-template-columns: repeat(21, 7px)">
                        <sc-for list="{{qr}}" as="q" hint-placeholder-count="441">
                          <span style="width: 7px; height: 7px; background: {{q.c}}"></span>
                        </sc-for>
                      </div>
                    </div>
                    <span style="margin-top: 12px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75)">{{card.id}}</span>
                    <div style="margin-top: 22px; width: 100%; display: flex; flex-direction: column; gap: 8px; font-size: 11.5px; line-height: 1.5; color: rgba(255,255,255,.78)">
                      <span>Tunjukkan QR ini ke panitia saat presensi event dan sesi mentoring.</span>
                      <span>Berlaku selama Batch 2026 dan tidak dapat dipindahtangankan.</span>
                    </div>
                    <div style="margin-top: auto; width: 100%; height: 6px; border-radius: 6px; background: linear-gradient(90deg, #32306F, #3157A5, {{card.accent}})"></div>
                  </div>
                </div>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
                <button class="btn" type="button" onClick="{{flip}}" style="{{s.secondary}}">Balik kartu · lihat QR</button>
                <button class="btn" type="button" style="{{s.primary}}">Unduh PDF · CR80</button>
                <button class="btn" type="button" style="{{s.secondary}}">Simpan PNG</button>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{is.tampilan}}" hint-placeholder-val="{{ false }}">
          <div style="{{s.card}}">
            <h2 style="{{s.h2}}">Tampilan</h2>
            <p style="{{s.sub}}">Langsung berlaku, coba aja klik.</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 20px">
              <sc-for list="{{themeOpts}}" as="o" hint-placeholder-count="3">
                <button class="btn" type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">
                  <span aria-hidden="true" style="display: block; height: 110px; border-radius: 14px; overflow: hidden; background: {{o.bg}}; position: relative">
                    <span style="position: absolute; left: 10px; right: 10px; top: 10px; height: 14px; border-radius: 6px; background: {{o.bar}}"></span>
                    <span style="position: absolute; left: 10px; top: 34px; width: 55%; height: 64px; border-radius: 10px; background: linear-gradient(135deg,#32306F,#3157A5)"></span>
                    <span style="position: absolute; right: 10px; top: 34px; width: 30%; height: 64px; border-radius: 10px; background: {{o.card}}"></span>
                    <span style="position: absolute; right: 18px; top: 44px; width: 18px; height: 8px; border-radius: 4px; background: #D4FF3A"></span>
                  </span>
                  <span style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px"><strong style="font-size: 15px">{{o.label}}</strong><span style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{o.ring}}; background: {{o.dot}}; box-sizing: border-box"></span></span>
                </button>
              </sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 24px">
              <div style="{{s.row}}"><span><strong style="display: block">Ukuran teks</strong><span style="{{s.hint}}">Berlaku di semua halaman</span></span>
                <span style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: {{t.soft}}"><span style="{{s.segOff}}">Kecil</span><span style="{{s.segOn}}">Normal</span><span style="{{s.segOff}}">Besar</span></span></div>
              <sc-for list="{{displayToggles}}" as="g" hint-placeholder-count="2">
                <div style="{{s.row}}"><span><strong style="display: block">{{g.label}}</strong><span style="{{s.hint}}">{{g.hint}}</span></span>
                  <button type="button" role="switch" aria-checked="{{g.checked}}" aria-label="{{g.label}}" onClick="{{g.toggle}}" style="{{g.track}}"><span style="{{g.knob}}"></span></button></div>
              </sc-for>
              <div style="{{s.row}}"><span><strong style="display: block">Bahasa</strong><span style="{{s.hint}}">Antarmuka platform</span></span><select style="{{s.input}}; width: 180px"><option>Bahasa Indonesia</option><option>English</option></select></div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{is.notif}}" hint-placeholder-val="{{ false }}">
          <div style="{{s.card}}">
            <h2 style="{{s.h2}}">Notifikasi</h2>
            <p style="{{s.sub}}">Pilih apa yang dikabari dan lewat mana. Email OTP &amp; keamanan selalu aktif.</p>
            <div style="overflow-x: auto; margin-top: 18px">
              <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px">
                <thead><tr style="text-align: left; color: {{t.muted}}; font-size: 12.5px"><th style="padding: 10px 8px; font-weight: 700">Jenis</th><th style="padding: 10px 8px; font-weight: 700; text-align: center">In-app</th><th style="padding: 10px 8px; font-weight: 700; text-align: center">Email</th><th style="padding: 10px 8px; font-weight: 700; text-align: center">Push HP</th></tr></thead>
                <tbody>
                  <sc-for list="{{notifRows}}" as="n" hint-placeholder-count="6">
                    <tr style="border-top: 1px solid {{t.line}}"><td style="padding: 12px 8px; font-weight: 700">{{n.label}}</td>
                      <sc-for list="{{n.cells}}" as="x" hint-placeholder-count="3">
                        <td style="padding: 8px; text-align: center"><button type="button" role="switch" aria-checked="{{x.checked}}" aria-label="{{x.aria}}" onClick="{{x.toggle}}" style="{{x.track}}"><span style="{{x.knob}}"></span></button></td>
                      </sc-for>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 18px">
              <div style="{{s.row}}"><span><strong style="display: block">Suara notifikasi</strong><span style="{{s.hint}}">Bunyi saat ada chat, mention, atau undangan baru</span></span>
                <span style="display: flex; gap: 8px; align-items: center"><select aria-label="Pilih suara" onChange="{{onSound}}" style="{{s.input}}; width: 150px"><option value="leap">Leap (default)</option><option value="pop">Pop</option><option value="chime">Chime</option></select><button type="button" onClick="{{testSound}}" style="{{s.secondary}}">Tes</button><button type="button" role="switch" aria-checked="{{soundSw.checked}}" aria-label="Suara notifikasi" onClick="{{soundSw.toggle}}" style="{{soundSw.track}}"><span style="{{soundSw.knob}}"></span></button></span></div>
              <div style="{{s.row}}"><span><strong style="display: block">Ringkasan email harian</strong><span style="{{s.hint}}">Gabungkan notifikasi belum dibaca, dikirim 07.00 WIB</span></span><button type="button" role="switch" aria-checked="{{digestSw.checked}}" aria-label="Ringkasan email harian" onClick="{{digestSw.toggle}}" style="{{digestSw.track}}"><span style="{{digestSw.knob}}"></span></button></div>
              <div style="{{s.row}}"><span><strong style="display: block">Jangan ganggu</strong><span style="{{s.hint}}">22.00 – 06.00 WIB, notifikasi ditahan</span></span><button type="button" role="switch" aria-checked="{{dndSw.checked}}" aria-label="Jangan ganggu" onClick="{{dndSw.toggle}}" style="{{dndSw.track}}"><span style="{{dndSw.knob}}"></span></button></div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{is.akun}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 18px">
            <div style="{{s.card}}">
              <h2 style="{{s.h2}}">Akun &amp; keamanan</h2>
              <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 14px">
                <div style="{{s.row}}"><span><strong style="display: block">Email login</strong><span style="{{s.hint}}">{{person.email}}</span></span><button type="button" style="{{s.secondary}}">Ganti email</button></div>
                <div style="{{s.row}}"><span><strong style="display: block">Password</strong><span style="{{s.hint}}">Terakhir diganti 2 bulan lalu</span></span><button type="button" style="{{s.secondary}}">Ganti password</button></div>
                <div style="{{s.row}}"><span><strong style="display: block">Masuk dengan kode OTP</strong><span style="{{s.hint}}">Login tanpa password lewat kode ke email</span></span><button type="button" role="switch" aria-checked="{{otpSw.checked}}" aria-label="Login OTP" onClick="{{otpSw.toggle}}" style="{{otpSw.track}}"><span style="{{otpSw.knob}}"></span></button></div>
              </div>
            </div>
            <div style="{{s.card}}">

      const AC = window.AudioContext || window.webkitAudioContext;

      notes.forEach((n) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(n[0], now + n[1]);
        g.gain.setValueAtTime(0.0001, now + n[1]);
        g.gain.exponentialRampToValueAtTime(0.22, now + n[1] + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now + n[1] + n[2]);

      });
    } catch (e) {}
  }

      asmen: { label: 'Asmen', accent: '#3157A5', ink: '#FFFFFF', group: 'Associate Mentor · Rajawali', id: 'IPBL-26-A031' },
      mentor: { label: 'Mentor', accent: '#32306F', ink: '#FFFFFF', group: 'Mentor · Rajawali', id: 'IPBL-26-M031' },
      pengurus: { label: 'Pengurus', accent: '#D4FF3A', ink: '#0D0D1A', group: 'Steering Team IPB Leap 2026', id: 'IPBL-26-P004' }
    };
    const roleTabs = Object.keys(cards).map((k) => ({
      label: cards[k].label, pressed: st.role === k ? 'true' : 'false',

    }));
    const themeDefs = [['light', 'Terang', '#F5F7FC', '#FFFFFF', '#FFFFFF'], ['dark', 'Gelap', '#0E0D2B', '#22205A', '#17163A'], ['system', 'Ikuti sistem', 'linear-gradient(90deg,#F5F7FC 50%,#0E0D2B 50%)', 'linear-gradient(90deg,#FFFFFF 50%,#22205A 50%)', '#8A8CA8']];
    const themeOpts = themeDefs.map((d) => {
      const on = st.theme === d[0];

        label: d[1], bg: d[2], bar: d[3], card: d[4], pressed: on ? 'true' : 'false',

    }));

    ];
    const N = 21, qr = [];
    let seed = 7;
    const finder = (x, y) => {
      const boxes = [[0, 0], [N - 7, 0], [0, N - 7]];
      for (const b of boxes) {
        const dx = x - b[0], dy = y - b[1];
        if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) return (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)) ? 1 : 0;
      }
      return -1;
    };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      const f = finder(x, y);
      qr.push({ c: (f === -1 ? (seed % 100) < 48 : f === 1) ? '#0D0D1A' : '#FFFFFF' });
    }
    return {
      t: t, s: s, is: is, tabs: tabs, roleTabs: roleTabs, themeOpts: themeOpts, displayToggles: displayToggles, notifRows: notifRows, privacyToggles: privacyToggles, qr: qr,

      soundSw: sw(st.sw.sound, flipSw('sound'), 'Suara'),
      digestSw: sw(st.sw.digest, flipSw('digest'), 'Digest'),
      dndSw: sw(st.sw.dnd, flipSw('dnd'), 'Jangan ganggu'),
      otpSw: sw(st.sw.otp, flipSw('otp'), 'OTP'),
      onSound: (e) => { this.setState({ sound: e.target.value }); this.beep(e.target.value); },
      testSound: () => this.beep(st.sound),
      save: () => this.showToast('Profil tersimpan'),
      toast: !!st.toast, toastText: st.toast || ''
    };
  }
}
</script>
