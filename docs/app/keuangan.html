<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keuangan · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Keuangan · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/keuangan.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.96) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes flash{0%{background:#EEFFB8}100%{background:transparent}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rise{animation:rise .5s cubic-bezier(.2,.9,.3,1.15) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.up{transform-origin:bottom;animation:up .8s cubic-bezier(.2,.9,.3,1) both}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.pop{animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
.flash{animation:flash 1.6s ease both}
.scan{animation:scan 1s linear infinite}
.bar:hover{filter:brightness(1.12)}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
.row:hover{background:#F7F9FF}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="Keuangan"></div>
<template data-dc="Keuangan">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="bendahara" active="workspace" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">
    <div class="rise" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6B6D8C"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Khusus Bendahara · pengurus lain hanya melihat saldo di beranda</span>
        <h1 style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 50px; letter-spacing: -.02em; color: #32306F; line-height: 1">Keuangan</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <button class="btn" type="button" style="height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Export LPJ (Excel/PDF)</button>
        <button class="btn" type="button" onClick="{{openTx}}" style="height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer">+ Catat transaksi</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
      <div class="rise d1" style="padding: 24px; border-radius: 26px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 24px 40px -28px rgba(50,48,111,.9)"><span style="font-size: 13px; font-weight: 700; color: #A3D6E6">Total saldo</span><div style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 36px; margin-top: 6px">{{totalLabel}}</div><span style="font-size: 12.5px; color: rgba(255,255,255,.8)">per 13 Okt 2026</span></div>
      <div class="rise d2" style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)"><span style="font-size: 13px; font-weight: 700; color: #6B6D8C">Rekening Program</span><div style="font-size: 26px; font-weight: 800; color: #32306F; margin-top: 8px">{{bankLabel}}</div></div>
      <div class="rise d2" style="padding: 24px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)"><span style="font-size: 13px; font-weight: 700; color: #6B6D8C">Kas Tunai</span><div style="font-size: 26px; font-weight: 800; color: #32306F; margin-top: 8px">{{cashLabel}}</div></div>
      <div class="rise d3" style="padding: 24px; border-radius: 26px; background: #EEFFB8"><span style="font-size: 13px; font-weight: 700; color: #3A4A00">Total anggaran dari RAB</span><div style="font-size: 26px; font-weight: 800; color: #0D0D1A; margin-top: 8px">{{budgetLabel}}</div><span style="font-size: 12.5px; color: #3A4A00">{{rabCount}} RAB terbaca</span></div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch">
      <section style="flex: 999 1 560px; min-width: 0; padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 18px 40px -30px rgba(50,48,111,.45)">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <h2 style="margin: 0; font-size: 19px; font-weight: 800">September jadi bulan tersibuk: masuk Rp30 jt, keluar Rp18,6 jt</h2>
          <div style="display: flex; gap: 14px; font-size: 13px; font-weight: 700; color: #33355A"><span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; border-radius: 4px; background: #3157A5"></span>Pemasukan</span><span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; border-radius: 4px; background: #2FA3C7"></span>Pengeluaran</span></div>
        </div>
        <p style="margin: 4px 0 18px; font-size: 13px; color: #6B6D8C">Cashflow per bulan, dalam juta rupiah</p>
        <div role="img" aria-label="Pemasukan dan pengeluaran per bulan: Juli 25 dan 8,4; Agustus 12,5 dan 14,2; September 30 dan 18,6; Oktober 10 dan 6,1 juta rupiah" style="position: relative; height: 240px; display: flex; align-items: flex-end; gap: 24px; padding: 0 8px 32px; border-bottom: 1px solid #D5DAEA">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="4">
            <div style="position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px">
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 36%">
                <span style="font-size: 12px; font-weight: 800; color: #33355A; margin-bottom: 4px">{{m.inLabel}}</span>
                <div class="bar up" title="{{m.name}} · Pemasukan Rp{{m.inLabel}} jt" style="width: 100%; height: {{m.inH}}px; border-radius: 4px 4px 0 0; background: #3157A5"></div>
              </div>
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 36%">
                <span style="font-size: 12px; font-weight: 800; color: #33355A; margin-bottom: 4px">{{m.outLabel}}</span>
                <div class="bar up" title="{{m.name}} · Pengeluaran Rp{{m.outLabel}} jt" style="width: 100%; height: {{m.outH}}px; border-radius: 4px 4px 0 0; background: #2FA3C7"></div>
              </div>
              <span style="position: absolute; bottom: -26px; font-size: 13px; font-weight: 700; color: #55577A">{{m.name}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="flex: 1 1 380px; min-width: 0; padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
        <h2 style="margin: 0 0 4px; font-size: 19px; font-weight: 800">Anggaran (RAB) vs realisasi</h2>
        <p style="margin: 0 0 18px; font-size: 13px; color: #6B6D8C">Anggaran terbaca otomatis dari RAB yang diunggah</p>
        <div style="display: flex; flex-direction: column; gap: 16px; font-size: 13.5px">
          <sc-for list="{{budgets}}" as="b" hint-placeholder-count="4">
            <div class="{{b.cls}}" style="border-radius: 10px">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px"><span style="font-weight: 700">{{b.name}}</span><span style="color: {{b.ink}}"><strong>{{b.used}}</strong> / {{b.total}}{{b.note}}</span></div>
              <div style="height: 10px; border-radius: 10px; background: #EDF0F7; overflow: hidden"><div class="grow" style="width: {{b.pct}}%; height: 100%; border-radius: 10px; background: {{b.color}}"></div></div>
            </div>
          </sc-for>
        </div>
      </section>
    </div>

    <section style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px">
        <div><h2 style="margin: 0; font-size: 19px; font-weight: 800">RAB (Rencana Anggaran Biaya)</h2><p style="margin: 4px 0 0; font-size: 13.5px; color: #6B6D8C; max-width: 620px">Buat di Google Sheets dari template resmi, lalu unggah atau tempel tautannya. Sistem membaca pos dan total anggaran, lalu memasukkannya ke dashboard di atas.</p></div>
        <a class="btn" href="https://docs.google.com/spreadsheets/create" target="_blank" rel="noopener" style="height: 46px; padding: 0 16px; border-radius: 14px; background: #16A34A; color: #FFFFFF; font-weight: 800; font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 20px; height: 24px; border-radius: 3px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><span style="width: 12px; height: 10px; border: 2px solid #16A34A; border-radius: 1px; box-sizing: border-box"></span></span>Buat RAB dari template ↗</a>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
        <label style="flex: 1 1 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 22px; border-radius: 22px; border: 2px dashed #A3B4DA; background: #F8F9FD; cursor: pointer; text-align: center">
          <strong style="font-size: 15px">Unggah RAB</strong>
          <span style="font-size: 12.5px; color: #6B6D8C">.xlsx, .csv, atau tempel tautan Google Sheets</span>
          <input type="file" accept=".xlsx,.xls,.csv" onChange="{{onRab}}" style="font: inherit; font-size: 13px; color: #6B6D8C">
          <span style="display: flex; gap: 6px; width: 100%; max-width: 360px; margin-top: 4px"><input type="url" aria-label="Tautan Google Sheets RAB" placeholder="https://docs.google.com/spreadsheets/…" style="flex: 1; min-width: 0; height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid #D5DAEA; font: inherit; font-size: 12.5px"><button type="button" onClick="{{linkRab}}" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 12.5px; cursor: pointer">Baca</button></span>
        </label>
        <sc-if value="{{reading}}" hint-placeholder-val="{{ false }}">
          <div style="flex: 1 1 300px; padding: 22px; border-radius: 22px; background: #E4EBF8; display: flex; flex-direction: column; justify-content: center; gap: 12px">
            <strong style="font-size: 15px; color: #24427F">Membaca {{readingName}}…</strong>
            <div style="height: 8px; border-radius: 8px; background: rgba(255,255,255,.7); overflow: hidden"><div class="scan" style="width: 60%; height: 100%; background: linear-gradient(90deg,transparent,#3157A5,transparent)"></div></div>
            <span style="font-size: 12.5px; color: #3157A5">Mencocokkan kolom Uraian, Volume, Harga satuan, Jumlah</span>
          </div>
        </sc-if>
        <sc-if value="{{hasParsed}}" hint-placeholder-val="{{ false }}">
          <div class="pop" style="flex: 1 1 300px; padding: 22px; border-radius: 22px; background: #EEFFB8; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #3A4A00">✓ TERBACA OTOMATIS</span>
            <strong style="font-size: 17px">RAB Community Gathering</strong>
            <span style="font-size: 13.5px; color: #3A4A00">9 pos anggaran · total Rp12.400.000 · masuk ke grafik anggaran</span>
            <span style="font-size: 12.5px; color: #3A4A00">Konsumsi Rp4,5 jt · Venue Rp3 jt · Dokumentasi Rp1,6 jt · lainnya Rp3,3 jt</span>
          </div>
        </sc-if>
      </div>
      <div style="overflow-x: auto; margin-top: 18px">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px">
          <thead><tr style="text-align: left; color: #6B6D8C; font-size: 12.5px"><th style="padding: 10px 12px; font-weight: 700">RAB</th><th style="padding: 10px 12px; font-weight: 700">Proker</th><th style="padding: 10px 12px; font-weight: 700">Sumber</th><th style="padding: 10px 12px; font-weight: 700">Diunggah</th><th style="padding: 10px 12px; font-weight: 700; text-align: right">Total</th></tr></thead>
          <tbody>
            <sc-for list="{{rabs}}" as="r" hint-placeholder-count="3">
              <tr class="row" style="border-top: 1px solid #F0F2F8"><td style="padding: 12px; font-weight: 700">{{r.name}}</td><td style="padding: 12px; color: #55577A">{{r.proker}}</td><td style="padding: 12px"><span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: #DCFCE7; color: #166534">{{r.src}}</span></td><td style="padding: 12px; color: #55577A">{{r.when}}</td><td style="padding: 12px; text-align: right; font-weight: 800">{{r.total}}</td></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </section>

    <section style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px">
        <h2 style="margin: 0; font-size: 19px; font-weight: 800">Transaksi</h2>
        <div role="tablist" aria-label="Filter transaksi" style="display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: #E9EDF7">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px">
          <thead><tr style="text-align: left; color: #6B6D8C; font-size: 12.5px"><th style="padding: 10px 12px; font-weight: 700">Tanggal</th><th style="padding: 10px 12px; font-weight: 700">Keterangan</th><th style="padding: 10px 12px; font-weight: 700">Kategori · Proker</th><th style="padding: 10px 12px; font-weight: 700">Akun</th><th style="padding: 10px 12px; font-weight: 700">Bukti</th><th style="padding: 10px 12px; font-weight: 700; text-align: right">Nominal</th></tr></thead>
          <tbody>
            <sc-for list="{{tx}}" as="t" hint-placeholder-count="6">
              <tr class="row {{t.cls}}" style="border-top: 1px solid #F0F2F8"><td style="padding: 12px; color: #55577A; white-space: nowrap">{{t.date}}</td><td style="padding: 12px; font-weight: 700">{{t.desc}}</td><td style="padding: 12px; color: #55577A">{{t.cat}}</td><td style="padding: 12px; color: #55577A">{{t.acct}}</td><td style="padding: 12px"><span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: #F1F4FB; color: #3157A5">{{t.proof}}</span></td><td style="padding: 12px; text-align: right; font-weight: 800; white-space: nowrap; color: {{t.ink}}">{{t.amount}}</td></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <p style="margin: 12px 0 0; font-size: 12.5px; color: #6B6D8C">Transaksi tidak dapat dihapus. Koreksi dibuat sebagai transaksi pembalik dan tercatat di log audit.</p>
    </section>
  </main>

  <sc-if value="{{txOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: rgba(13,13,26,.42); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px">
      <div class="pop" role="dialog" aria-label="Catat transaksi" style="width: 100%; max-width: 580px; max-height: 92vh; overflow: auto; padding: 26px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 40px 80px -30px rgba(13,13,26,.6)">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px"><h2 style="margin: 0; font-size: 22px; font-weight: 800; color: #32306F">Catat transaksi</h2><button type="button" onClick="{{closeTx}}" aria-label="Tutup" style="width: 36px; height: 36px; border-radius: 11px; border: 1px solid #E3E7F2; background: #FFFFFF; cursor: pointer">×</button></div>
        <div role="radiogroup" aria-label="Jenis transaksi" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 5px; border-radius: 16px; background: #F1F2F6; margin-bottom: 16px">
          <button type="button" role="radio" aria-checked="{{outChecked}}" onClick="{{setOut}}" style="{{outStyle}}">− Pengeluaran</button>
          <button type="button" role="radio" aria-checked="{{inChecked}}" onClick="{{setIn}}" style="{{inStyle}}">+ Pemasukan</button>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nominal
          <span style="display: flex; align-items: center; border-radius: 16px; border: 1.5px solid #D5DAEA; padding: 0 14px"><span style="font-size: 22px; font-weight: 800; color: #6B6D8C">Rp</span><input type="text" inputmode="numeric" value="{{amountText}}" onChange="{{onAmount}}" aria-label="Nominal rupiah" style="flex: 1; height: 60px; border: 0; padding: 0 10px; font: inherit; font-size: 28px; font-weight: 800; color: #0D0D1A; background: transparent; outline: none"></span>
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Tanggal<input type="date" value="2026-10-13" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Akun kas<select onChange="{{onAcct}}" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Rekening Program</option><option>Kas Tunai</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Kategori
            <sc-if value="{{isOut}}" hint-placeholder-val="{{ true }}"><select onChange="{{onCat}}" style="width: 100%; height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Konsumsi</option><option>Transportasi</option><option>Venue</option><option>Produksi</option><option>Lainnya</option></select></sc-if>
            <sc-if value="{{isIn}}" hint-placeholder-val="{{ false }}"><select onChange="{{onCat}}" style="width: 100%; height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Sponsor</option><option>Hibah</option><option>Iuran</option><option>Lainnya</option></select></sc-if>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Proker<select onChange="{{onProker}}" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Leadership Camp</option><option>Kelas bulanan</option><option>Merchandise</option><option>Community Gathering</option><option>Umum</option></select></label>
        </div>

<script type="text/x-dc" data-dc="Keuangan" data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', txOpen: false, kind: 'out', amount: 450000, acct: 'Kas Tunai', cat: 'Konsumsi', proker: 'Leadership Camp', desc: 'Snack rapat panitia', proof: 'nota.jpg', newTx: [], reading: false, readingName: '', parsed: false };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  startRead(name) {
    this.setState({ reading: true, readingName: name, parsed: false });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ reading: false, parsed: true }), 1600);
  }
  renderVals() {
    const st = this.state;
    const rp = (n) => 'Rp' + Math.abs(n).toLocaleString('id-ID');
    const raw = [['Jul', 25, 8.4], ['Agu', 12.5, 14.2], ['Sep', 30, 18.6], ['Okt', 10, 6.1]];
    const f = (x) => String(x).replace('.', ',');
    const months = raw.map((m) => ({ name: m[0], inLabel: f(m[1]), outLabel: f(m[2]), inH: Math.round(m[1] / 30 * 180), outH: Math.round(m[2] / 30 * 180) }));
    const base = [
      ['12 Okt', 'Konsumsi Sesi Kelas Oktober', 'Konsumsi · Kelas bulanan', 'Kas Tunai', 'nota.jpg', -1850000],
      ['10 Okt', 'Sponsor tahap 2 (mitra agribisnis)', 'Sponsor · Umum', 'Rekening Program', 'transfer.pdf', 10000000],
      ['8 Okt', 'Cetak ID card 140 pcs', 'Produksi · Merchandise', 'Rekening Program', 'invoice.pdf', -2380000],
      ['3 Okt', 'Sewa venue Leadership Camp (DP)', 'Venue · Leadership Camp', 'Rekening Program', 'kwitansi.jpg', -1870000],
      ['29 Sep', 'Hibah HA IPB', 'Hibah · Umum', 'Rekening Program', 'transfer.pdf', 20000000]
    ];
    const all = st.newTx.concat(base);
    let bank = 41750000, cash = 6500000;
    st.newTx.forEach((t) => { if (t[3] === 'Kas Tunai') cash += t[5]; else bank += t[5]; });
    const tx = all.filter((t) => st.filter === 'all' || (st.filter === 'in' ? t[5] > 0 : t[5] < 0)).map((t, i) => ({
      date: t[0], desc: t[1], cat: t[2], acct: t[3], proof: t[4], amount: (t[5] < 0 ? '− ' : '+ ') + rp(t[5]), ink: t[5] < 0 ? '#0D0D1A' : '#166534', cls: t[6] ? 'flash' : ''
    }));
    const filters = [['all', 'Semua'], ['in', 'Masuk'], ['out', 'Keluar']].map((x) => ({
      label: x[1], selected: st.filter === x[0] ? 'true' : 'false',
      style: 'height: 34px; padding: 0 12px; border-radius: 10px; border: 0; font: inherit; font-size: 13px; cursor: pointer; ' + (st.filter === x[0] ? 'background: #FFFFFF; color: #32306F; font-weight: 800; box-shadow: 0 4px 12px -6px rgba(50,48,111,.5)' : 'background: transparent; color: #6B6D8C; font-weight: 700'),
      pick: () => this.setState({ filter: x[0] })
    }));
    const bdefs = [['Leadership Camp', 9.8, 25], ['Kelas bulanan', 7.2, 9], ['Merchandise & ID card', 6.4, 6], ['Graduation & FALP', 0, 30]];
    if (st.parsed) bdefs.push(['Community Gathering', 0, 12.4, true]);
    const budgets = bdefs.map((b) => {
      const over = b[1] > b[2];
      return { name: b[0], used: 'Rp' + f(b[1]), total: f(b[2]) + ' jt', note: over ? ' · lewat ' + Math.round((b[1] / b[2] - 1) * 100) + '%' : (b[3] ? ' · baru' : ''), pct: Math.min(100, Math.round(b[1] / b[2] * 100)), color: over ? '#E5484D' : '#3157A5', ink: over ? '#B42318' : '#55577A', cls: b[3] ? 'flash' : '' };
    });
    const rabs = [
      { name: 'RAB Leadership Camp v2', proker: 'Leadership Camp', src: 'Google Sheets', when: '2 Okt · Bendahara', total: 'Rp25.000.000' },
      { name: 'RAB Kelas Bulanan', proker: 'Kelas bulanan', src: 'Excel', when: '18 Agu · Bendahara', total: 'Rp9.000.000' },
      { name: 'RAB Graduation', proker: 'Graduation & FALP', src: 'Google Sheets', when: '1 Sep · Bendahara', total: 'Rp30.000.000' }
    ];
    if (st.parsed) rabs.unshift({ name: 'RAB Community Gathering', proker: 'Community Gathering', src: st.readingName.indexOf('docs.google') >= 0 || st.readingName === 'Google Sheets' ? 'Google Sheets' : 'Excel', when: 'Baru saja · Bendahara', total: 'Rp12.400.000' });
    const totalBudget = bdefs.reduce((s, b) => s + b[2], 0);
    const cats = st.kind === 'out' ? ['Konsumsi', 'Transportasi', 'Venue', 'Produksi', 'Lainnya'] : ['Sponsor', 'Hibah', 'Iuran', 'Lainnya'];
    const segOn = 'height: 44px; border-radius: 12px; border: 0; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; background: #FFFFFF; box-shadow: 0 6px 14px -8px rgba(50,48,111,.5); color: ';
    const segOff = 'height: 44px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; background: transparent; color: #6B6D8C';
    return {
      months: months, tx: tx, filters: filters, budgets: budgets, rabs: rabs, cats: cats,
      isOut: st.kind === 'out', isIn: st.kind === 'in',
      totalLabel: rp(bank + cash), bankLabel: rp(bank), cashLabel: rp(cash),
      budgetLabel: 'Rp' + f(Math.round(totalBudget * 10) / 10) + ' jt', rabCount: rabs.length,
      reading: st.reading, readingName: st.readingName, hasParsed: st.parsed && !st.reading,
      onRab: (e) => { const fl = e.target.files && e.target.files[0]; if (fl) this.startRead(fl.name); },
      linkRab: () => this.startRead('Google Sheets'),
      txOpen: st.txOpen,
      openTx: () => this.setState({ txOpen: true }),
      closeTx: () => this.setState({ txOpen: false }),
      outStyle: st.kind === 'out' ? segOn + '#B42318' : segOff, inStyle: st.kind === 'in' ? segOn + '#166534' : segOff,
      outChecked: st.kind === 'out' ? 'true' : 'false', inChecked: st.kind === 'in' ? 'true' : 'false',
      setOut: () => this.setState({ kind: 'out', cat: 'Konsumsi' }), setIn: () => this.setState({ kind: 'in', cat: 'Sponsor' }),
      amountText: st.amount ? st.amount.toLocaleString('id-ID') : '',
      onAmount: (e) => this.setState({ amount: Number(String(e.target.value).replace(/[^0-9]/g, '')) || 0 }),
      onAcct: (e) => this.setState({ acct: e.target.value }),
      onCat: (e) => this.setState({ cat: e.target.value }),
      onProker: (e) => this.setState({ proker: e.target.value }),
      desc: st.desc,
      onDesc: (e) => this.setState({ desc: e.target.value }),
      onProof: (e) => { const fl = e.target.files && e.target.files[0]; if (fl) this.setState({ proof: fl.name }); },
      saveTx: () => {
        const n = (st.kind === 'out' ? -1 : 1) * st.amount;
        this.setState({ txOpen: false, filter: 'all', newTx: [['13 Okt', st.desc || 'Transaksi baru', st.cat + ' · ' + st.proker, st.acct, st.proof, n, true]].concat(st.newTx.map((t) => t.slice(0, 6))) });
      }
    };
  }
}
</script>
