<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proker & Task · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Proker & Task · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/proker.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.96) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes land{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.grow{transform-origin:left;animation:grow .8s cubic-bezier(.2,.9,.3,1) both}
.pop{animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
.land{animation:land .35s cubic-bezier(.2,.9,.3,1.3) both}
.toast{animation:toast 2.2s ease both}
.lift{transition:transform .18s, box-shadow .18s}
.lift:hover{transform:translateY(-3px);box-shadow:0 18px 36px -22px rgba(50,48,111,.55) !important}
.gapp{transition:transform .18s}
.gapp:hover{transform:translateY(-4px) rotate(-2deg)}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
.note-item input[type=text]:focus{outline:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3157A5}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="Proker"></div>
<template data-dc="Proker">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="pengurus" active="workspace" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6B6D8C">Workspace pengurus · Drive IPB LEAP tersambung otomatis</span>
        <h1 style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 50px; letter-spacing: -.02em; color: #32306F; line-height: 1">Proker &amp; Task</h1>
      </div>
      <div style="display: flex; gap: 10px">
        <a class="btn" href="file-manager.html" style="height: 46px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D5DAEA; font-weight: 700; font-size: 14px; color: #0D0D1A; text-decoration: none; display: flex; align-items: center">File Manager</a>
        <a class="btn" href="template.html" style="height: 46px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D5DAEA; font-weight: 700; font-size: 14px; color: #0D0D1A; text-decoration: none; display: flex; align-items: center">Template</a>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
      <aside style="flex: 1 1 260px; max-width: 310px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <button class="btn" type="button" onClick="{{openNew}}" style="height: 48px; border-radius: 15px; border: 0; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.25)">+ Proker baru</button>
        <sc-for list="{{prokers}}" as="p" hint-placeholder-count="5">
          <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">
            <span style="display: flex; justify-content: space-between; width: 100%; gap: 8px"><span style="font-weight: 800; font-size: 14.5px; text-align: left">{{p.name}}</span><span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 7px; background: {{p.sBg}}; color: {{p.sInk}}; white-space: nowrap">{{p.status}}</span></span>
            <span style="font-size: 12.5px; color: #6B6D8C; text-align: left">{{p.div}} · PIC {{p.pic}}</span>
            <span style="width: 100%; height: 6px; border-radius: 6px; background: #E3E7F2; overflow: hidden"><span style="display: block; width: {{p.pct}}%; height: 100%; background: {{p.bar}}"></span></span>
          </button>
        </sc-for>
      </aside>

      <section style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
        <div class="rise" style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 18px 40px -30px rgba(50,48,111,.45)">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
            <div><h2 style="margin: 0; font-size: 26px; font-weight: 800; color: #32306F">{{cur.name}}</h2><p style="margin: 4px 0 0; font-size: 14px; color: #55577A">{{cur.div}} · PIC {{cur.pic}} · {{cur.dates}} · anggaran {{cur.budget}}</p></div>
            <span style="font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 12px; background: #F1F4FB; color: #32306F">{{donePct}}% task selesai</span>
          </div>
          <div style="margin-top: 20px">
            <span style="display: block; font-size: 13px; font-weight: 800; margin-bottom: 10px">Buat dokumen baru · terbuka di tab baru, tersimpan di folder proker</span>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
              <sc-for list="{{apps}}" as="g" hint-placeholder-count="4">
                <a class="gapp" href="{{g.url}}" target="_blank" rel="noopener" onClick="{{g.open}}" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px; border-radius: 22px; background: {{g.tint}}; text-decoration: none; color: #0D0D1A">
                  <span aria-hidden="true" style="position: relative; width: 44px; height: 54px; border-radius: 6px 14px 6px 6px; background: {{g.color}}; box-shadow: 0 10px 18px -10px {{g.color}}; display: flex; align-items: center; justify-content: center">
                    <span style="position: absolute; right: 0; top: 0; width: 14px; height: 14px; border-radius: 0 14px 0 6px; background: rgba(255,255,255,.45)"></span>
                    <span style="{{g.glyph}}"></span>
                  </span>
                  <strong style="font-size: 14px">{{g.name}}</strong>
                </a>
              </sc-for>
            </div>
          </div>
          <div style="margin-top: 18px">
            <span style="display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px">Terakhir dibuka</span>
            <div style="display: flex; flex-direction: column">
              <sc-for list="{{recents}}" as="r" hint-placeholder-count="4">
                <a class="{{r.cls}}" href="{{r.url}}" target="_blank" rel="noopener" style="display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 12px; border-bottom: 1px solid #F0F2F8; text-decoration: none; color: #0D0D1A">
                  <span aria-hidden="true" style="width: 24px; height: 30px; flex: none; border-radius: 4px 8px 4px 4px; background: {{r.color}}"></span>
                  <span style="flex: 1; min-width: 0"><strong style="display: block; font-size: 14px">{{r.name}}</strong><span style="font-size: 12px; color: #6B6D8C">{{r.app}} · diedit {{r.edited}}</span></span>
                  <span style="font-size: 12px; font-weight: 700; color: #3157A5; white-space: nowrap">Dilihat {{r.seen}}</span>
                </a>
              </sc-for>
            </div>
          </div>
        </div>

        <div style="padding: 22px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px">
            <h2 style="margin: 0; font-size: 19px; font-weight: 800">Task proker</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <input type="text" aria-label="Task baru" value="{{draft}}" onChange="{{onDraft}}" placeholder="Task baru…" style="width: 220px; height: 40px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px">
              <input type="date" aria-label="Deadline" value="{{draftDue}}" onChange="{{onDue}}" style="height: 40px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13px">
              <button type="button" onClick="{{addTask}}" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">+ Tambah</button>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
              <div style="padding: 14px; border-radius: 22px; background: {{c.bg}}; min-height: 160px">
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; margin-bottom: 12px"><span>{{c.name}}</span><span style="color: #6B6D8C">{{c.count}}</span></div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{c.items}}" as="t" hint-placeholder-count="2">
                    <div class="land" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 6px 16px -12px rgba(50,48,111,.5)">
                      <button type="button" role="checkbox" aria-checked="{{t.checked}}" aria-label="Tandai selesai: {{t.title}}" onClick="{{t.toggle}}" style="{{t.box}}">{{t.mark}}</button>
                      <span style="flex: 1; min-width: 0">
                        <span style="{{t.titleStyle}}">{{t.title}}</span>
                        <span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px"><span style="font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 7px; background: {{t.dueBg}}; color: {{t.dueInk}}">{{t.dueLabel}}</span><span style="font-size: 11.5px; font-weight: 700; color: #6B6D8C">{{t.pic}}</span></span>
                        <sc-if value="{{t.canStart}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{t.start}}" style="margin-top: 8px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-size: 11.5px; font-weight: 800; color: #3157A5; cursor: pointer">Mulai →</button></sc-if>
                      </span>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; border-radius: 28px; overflow: hidden; background: #FFFDF5; border: 1px solid #F4E7B8; min-height: 360px">
          <div style="flex: 1 1 220px; max-width: 260px; border-right: 1px solid #F4E7B8; background: #FFF8E1; padding: 14px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px"><strong style="font-size: 15px">Notulensi</strong><button type="button" onClick="{{newNote}}" aria-label="Catatan baru" title="Catatan baru" style="width: 34px; height: 34px; border-radius: 10px; border: 0; background: #F5C518; color: #0D0D1A; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button></div>
            <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
              <button type="button" onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" style="{{n.style}}"><strong style="display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</strong><span style="font-size: 12px; color: #8A7A3E">{{n.date}} · {{n.done}}/{{n.total}} selesai</span></button>
            </sc-for>
          </div>
          <div style="flex: 999 1 360px; min-width: 0; padding: 22px 24px">
            <span style="font-size: 12px; font-weight: 700; color: #8A7A3E">{{note.date}}</span>
            <input type="text" aria-label="Judul catatan" value="{{note.title}}" onChange="{{onNoteTitle}}" style="display: block; width: 100%; margin: 4px 0 14px; border: 0; background: transparent; font: inherit; font-size: 24px; font-weight: 800; color: #0D0D1A; padding: 0">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <sc-for list="{{note.items}}" as="i" hint-placeholder-count="3">
                <div class="note-item" style="display: flex; align-items: center; gap: 10px; padding: 4px 0">
                  <button type="button" role="checkbox" aria-checked="{{i.checked}}" aria-label="Centang item" onClick="{{i.toggle}}" style="{{i.circle}}">{{i.mark}}</button>
                  <input type="text" aria-label="Isi item" value="{{i.text}}" onChange="{{i.edit}}" style="{{i.textStyle}}">
                  <button type="button" onClick="{{i.remove}}" aria-label="Hapus item" style="width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: #C2363B; cursor: pointer; font-size: 18px">×</button>
                </div>
              </sc-for>
              <button type="button" onClick="{{addItem}}" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 6px 0; border: 0; background: transparent; font: inherit; font-size: 14.5px; color: #B8860B; cursor: pointer; font-weight: 700"><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px dashed #E0B840; box-sizing: border-box"></span>Tambah item</button>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px">
              <button type="button" onClick="{{deleteNote}}" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #F4E7B8; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #C2363B; cursor: pointer">Hapus catatan</button>
              <button type="button" onClick="{{saveNote}}" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: #F5C518; color: #0D0D1A; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">Simpan</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <sc-if value="{{newOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: rgba(13,13,26,.42); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px">
      <div class="pop" role="dialog" aria-label="Proker baru" style="width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; padding: 26px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 40px 80px -30px rgba(13,13,26,.6)">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px"><h2 style="margin: 0; font-size: 22px; font-weight: 800; color: #32306F">Proker baru</h2><button type="button" onClick="{{closeNew}}" aria-label="Tutup" style="width: 36px; height: 36px; border-radius: 11px; border: 1px solid #E3E7F2; background: #FFFFFF; cursor: pointer">×</button></div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nama proker<input type="text" value="{{newName}}" onChange="{{onNewName}}" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 15px; font-weight: 700"></label>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Divisi<select onChange="{{onNewDiv}}" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Operations &amp; Community</option><option>Program Development</option><option>Growth &amp; Partnership</option><option>Branding &amp; Creative</option></select></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">PIC<select style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Community Engagement Lead</option><option>Head of Operations</option><option>Project Management &amp; Monitoring Lead</option></select></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Mulai<input type="date" value="2026-11-01" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Selesai<input type="date" value="2026-12-20" style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
          </div>
          <div><span style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px">Anggota tim</span><div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-radius: 14px; border: 1.5px solid #D5DAEA"><span style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #E4EBF8; color: #24427F">Graphic Design Lead</span><span style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #E4EBF8; color: #24427F">Multimedia Lead</span><input type="text" aria-label="Tambah anggota" placeholder="+ ketik nama" style="flex: 1; min-width: 120px; border: 0; font: inherit; font-size: 13px"></div></div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Tujuan<textarea rows="2" style="resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px">Mempererat jejaring mentee lintas kelompok sebelum Leadership Camp.</textarea></label>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Target / KPI<input type="text" value="Hadir ≥ 100 orang" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Anggaran (RAB)<select style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Belum ada, buat dari template</option><option>RAB Community Gathering</option></select></label>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #F8F9FD; font-size: 14px">
            <label style="display: flex; gap: 10px; align-items: center"><input type="checkbox" checked=""> Buat folder otomatis di Shared Drive IPB LEAP</label>
            <label style="display: flex; gap: 10px; align-items: center"><input type="checkbox" checked=""> Buat grup chat proker untuk tim</label>
            <label style="display: flex; gap: 10px; align-items: center"><input type="checkbox"> Tambah milestone ke kalender divisi</label>
          </div>
          <button class="btn" type="button" onClick="{{createProker}}" style="height: 52px; border-radius: 16px; border: 0; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Buat proker</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 14px 20px; border-radius: 16px; background: #0D0D1A; color: #FFFFFF; font-weight: 700; font-size: 14px; z-index: 90">{{toastText}}</div>
  </sc-if>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">

    const A = {

    const apps = Object.keys(A).map((k) => Object.assign({ name: k }, A[k], {
