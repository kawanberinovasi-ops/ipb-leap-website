<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Super Admin · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/super-admin.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.blink{animation:blink 1.6s ease-in-out infinite}
.loading{animation:bar 1.1s ease-in-out infinite}
.row:hover{background:#F7F9FF}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="SuperAdmin"></div>
<template data-dc="SuperAdmin">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="superadmin" active="beranda" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">

    <section class="rise" style="position: relative; overflow: hidden; border-radius: 30px; padding: 28px 32px; background: #0D0D1A; color: #FFFFFF; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(420px 240px at 100% 0%, rgba(49,87,165,.5), transparent 70%), radial-gradient(300px 200px at 0% 100%, rgba(212,255,58,.14), transparent 70%)"></div>
      <div style="position: relative">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">KONSOL SUPER ADMIN</span>
        <h1 style="margin: 8px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">{{headline}}</h1>
        <p style="margin: 10px 0 0; font-size: 15px; color: rgba(255,255,255,.78); max-width: 560px">Jaga data, server, dan hak akses semua role. Super Admin tidak mengurus konten program.</p>
      </div>
      <div style="position: relative; display: flex; flex-wrap: wrap; gap: 10px">
        <button class="btn" type="button" onClick="{{toggleMaint}}" aria-pressed="{{maintPressed}}" style="{{maintStyle}}">{{maintLabel}}</button>
      </div>
    </section>

    <div role="tablist" aria-label="Bagian konsol" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-radius: 16px; background: #E9EDF7; align-self: flex-start">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isSistem}}" hint-placeholder-val="{{ true }}">
      <div class="rise" style="display: flex; flex-direction: column; gap: 20px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
          <sc-for list="{{services}}" as="s" hint-placeholder-count="7">
            <div style="padding: 18px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
              <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 14.5px">{{s.name}}</strong><span class="{{s.cls}}" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: {{s.ink}}"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{s.dot}}"></span>{{s.status}}</span></div>
              <div style="font-size: 12.5px; color: #6B6D8C; margin-top: 6px">{{s.meta}}</div>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
          <section style="flex: 1 1 420px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
            <h2 style="margin: 0 0 16px; font-size: 18px; font-weight: 800">Kapasitas</h2>
            <div style="display: flex; flex-direction: column; gap: 16px; font-size: 13.5px">
              <sc-for list="{{quotas}}" as="q" hint-placeholder-count="4">
                <div>
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px"><span style="font-weight: 700">{{q.name}}</span><span style="color: #55577A"><strong style="color: #0D0D1A">{{q.used}}</strong> / {{q.max}}</span></div>
                  <div style="height: 10px; border-radius: 10px; background: #EDF0F7; overflow: hidden"><div style="height: 100%; width: {{q.pct}}%; border-radius: 10px; background: {{q.color}}"></div></div>
                </div>
              </sc-for>
            </div>
          </section>

          <section style="flex: 1 1 420px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Backup &amp; pemulihan</h2>
              <button class="btn" type="button" onClick="{{runBackup}}" disabled="{{backupBusy}}" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">{{backupLabel}}</button>
            </div>
            <sc-if value="{{backupBusy}}" hint-placeholder-val="{{ false }}">
              <div style="height: 6px; border-radius: 6px; background: #EDF0F7; overflow: hidden; margin-bottom: 12px"><div class="loading" style="width: 40%; height: 100%; border-radius: 6px; background: #3157A5"></div></div>
            </sc-if>
            <div style="display: flex; flex-direction: column; font-size: 13.5px">
              <sc-for list="{{backups}}" as="b" hint-placeholder-count="4">
                <div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F0F2F8"><span><strong>{{b.when}}</strong><br><span style="color: #6B6D8C; font-size: 12.5px">{{b.kind}} · {{b.size}}</span></span><span style="font-size: 12px; font-weight: 800; color: #166534; align-self: center">{{b.status}}</span></div>
              </sc-for>
            </div>
            <p style="margin: 12px 0 0; font-size: 12.5px; color: #6B6D8C">Backup harian 02.00 WIB, disimpan 30 hari. Uji pemulihan terakhir: 1 Agu 2026 (awal Batch).</p>
          </section>
        </div>

        <section style="padding: 24px; border-radius: 28px; background: #FFF7ED; border: 1px solid #FED7AA">
          <h2 style="margin: 0 0 12px; font-size: 18px; font-weight: 800">Peringatan keamanan</h2>
          <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13.5px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF"><span><strong>9 percobaan login gagal</strong> untuk satu akun mentee dalam 10 menit · dikunci otomatis 15 menit</span><button type="button" style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E7F2; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer">Lihat</button></div>
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF"><span><strong>Token Google Drive</strong> akun Workspace IPB LEAP kedaluwarsa 21 hari lagi</span><button type="button" style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E7F2; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer">Perbarui</button></div>
          </div>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{isUsers}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
          <div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E7F2"><span style="font-size: 12.5px; color: #6B6D8C; font-weight: 700">Mentee</span><div style="font-size: 26px; font-weight: 800; color: #32306F">128</div></div>
          <div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E7F2"><span style="font-size: 12.5px; color: #6B6D8C; font-weight: 700">Asmen</span><div style="font-size: 26px; font-weight: 800; color: #32306F">31</div></div>
          <div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E7F2"><span style="font-size: 12.5px; color: #6B6D8C; font-weight: 700">Mentor</span><div style="font-size: 26px; font-weight: 800; color: #32306F">31</div></div>
          <div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E7F2"><span style="font-size: 12.5px; color: #6B6D8C; font-weight: 700">Pengurus</span><div style="font-size: 26px; font-weight: 800; color: #32306F">21</div></div>
          <div style="padding: 16px; border-radius: 20px; background: #FEF3C7; border: 1px solid #FDE68A"><span style="font-size: 12.5px; color: #92400E; font-weight: 700">Menunggu verifikasi</span><div style="font-size: 26px; font-weight: 800; color: #0D0D1A">12</div></div>
        </div>

        <section style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px">
            <div><h2 style="margin: 0; font-size: 18px; font-weight: 800">Hak akses khusus</h2><p style="margin: 2px 0 0; font-size: 13px; color: #6B6D8C">Role dasar tetap (Mentee, Asmen, Mentor, Pengurus). Hak khusus ditambahkan per orang.</p></div>
            <input type="search" aria-label="Cari pengguna" placeholder="Cari nama atau email" style="height: 40px; width: 240px; padding: 0 12px; border-radius: 12px; border: 1px solid #E3E7F2; background: #F5F7FC; font: inherit; font-size: 13px">
          </div>
          <div style="overflow-x: auto">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px">
              <thead><tr style="text-align: left; color: #6B6D8C; font-size: 12.5px"><th style="padding: 10px 12px; font-weight: 700">Pengguna</th><th style="padding: 10px 12px; font-weight: 700">Role · jabatan</th><th style="padding: 10px 12px; font-weight: 700; text-align: center">PIC Verifikasi</th><th style="padding: 10px 12px; font-weight: 700; text-align: center">Akses Keuangan</th><th style="padding: 10px 12px; font-weight: 700; text-align: center">Super Admin</th><th style="padding: 10px 12px; font-weight: 700">Status</th><th style="padding: 10px 12px"></th></tr></thead>
              <tbody>
                <sc-for list="{{users}}" as="u" hint-placeholder-count="6">
                  <tr class="row" style="border-top: 1px solid #F0F2F8">
                    <td style="padding: 12px"><strong>{{u.name}}</strong><br><span style="font-size: 12.5px; color: #6B6D8C">{{u.email}}</span></td>
                    <td style="padding: 12px; color: #33355A">{{u.role}}</td>
                    <td style="padding: 12px; text-align: center"><button type="button" role="switch" aria-checked="{{u.p0.checked}}" aria-label="PIC Verifikasi untuk {{u.name}}" onClick="{{u.p0.toggle}}" style="{{u.p0.track}}"><span style="{{u.p0.knob}}"></span></button></td>
                    <td style="padding: 12px; text-align: center"><button type="button" role="switch" aria-checked="{{u.p1.checked}}" aria-label="Akses Keuangan untuk {{u.name}}" onClick="{{u.p1.toggle}}" style="{{u.p1.track}}"><span style="{{u.p1.knob}}"></span></button></td>
                    <td style="padding: 12px; text-align: center"><button type="button" role="switch" aria-checked="{{u.p2.checked}}" aria-label="Super Admin untuk {{u.name}}" onClick="{{u.p2.toggle}}" style="{{u.p2.track}}"><span style="{{u.p2.knob}}"></span></button></td>
                    <td style="padding: 12px"><span style="font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: {{u.sBg}}; color: {{u.sInk}}">{{u.status}}</span></td>
                    <td style="padding: 12px; white-space: nowrap"><button type="button" onClick="{{u.toggleActive}}" style="height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid #E3E7F2; background: #FFFFFF; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer">{{u.activeLabel}}</button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
          <p style="margin: 12px 0 0; font-size: 12.5px; color: #6B6D8C">Setiap perubahan hak akses tercatat di Audit Log dan dikabari ke pengguna lewat email.</p>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{isData}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
        <section style="flex: 1 1 420px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
          <h2 style="margin: 0 0 14px; font-size: 18px; font-weight: 800">Batch</h2>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{batches}}" as="b" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: {{b.bg}}; border: 1px solid {{b.border}}">
                <span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 26px; color: #32306F">{{b.year}}</span>
                <span style="flex: 1; font-size: 13px; color: #55577A">{{b.meta}}</span>
                <span style="font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: {{b.sBg}}; color: {{b.sInk}}">{{b.status}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px">
            <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Arsipkan Batch 2026</button>
            <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Export semua data (Excel)</button>
          </div>
        </section>

        <section style="flex: 999 1 520px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1.5px solid #3157A5; box-shadow: 0 20px 44px -30px rgba(49,87,165,.8)">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #3157A5">CLONE BATCH</span>
          <h2 style="margin: 4px 0 6px; font-size: 22px; font-weight: 800; color: #32306F">Siapkan Batch 2027 dari pengaturan 2026</h2>
          <p style="margin: 0 0 16px; font-size: 13.5px; color: #55577A; line-height: 1.55">Yang disalin hanya pengaturan. Data peserta, nilai, chat, dan transaksi tidak ikut, jadi Batch baru mulai bersih.</p>
          <sc-if value="{{notCloned}}" hint-placeholder-val="{{ true }}">
            <div>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px">
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Salin dari<select style="height: 44px; padding: 0 10px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Batch 2026</option><option>Batch 2025</option></select></label>
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nama batch baru<input type="text" value="Batch 2027" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px">
                <sc-for list="{{cloneItems}}" as="c" hint-placeholder-count="6">
                  <button type="button" role="checkbox" aria-checked="{{c.checked}}" onClick="{{c.toggle}}" style="{{c.style}}"><span style="{{c.box}}">{{c.mark}}</span><span style="text-align: left"><strong style="display: block; font-size: 13.5px">{{c.label}}</strong><span style="font-size: 12px; color: #6B6D8C">{{c.desc}}</span></span></button>
                </sc-for>
              </div>
              <button class="btn" type="button" onClick="{{doClone}}" style="margin-top: 16px; width: 100%; height: 52px; border-radius: 16px; border: 0; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Buat Batch 2027 ({{cloneCount}} pengaturan)</button>
            </div>
          </sc-if>
          <sc-if value="{{cloned}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 18px; border-radius: 20px; background: #EEFFB8; display: flex; gap: 14px; align-items: center">
              <span aria-hidden="true" style="width: 48px; height: 48px; flex: none; border-radius: 16px; background: #D4FF3A; border: 2px solid #0D0D1A; display: flex; align-items: center; justify-content: center; font-weight: 900">✓</span>
              <span style="font-size: 14px; line-height: 1.5; color: #2B3600"><strong style="display: block; color: #0D0D1A">Batch 2027 dibuat (status: Persiapan)</strong>{{cloneCount}} pengaturan tersalin. Aktifkan saat rekrutmen dibuka; Batch 2026 tetap aktif sampai diarsipkan.</span>
            </div>
          </sc-if>
        </section>

        <section style="flex: 1 1 100%; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
          <h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 800">Permintaan data pribadi (UU PDP)</h2>
          <p style="margin: 0 0 14px; font-size: 13px; color: #6B6D8C">Dikirim pengguna dari Pengaturan › Privasi.</p>
          <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13.5px">
            <sc-for list="{{pdp}}" as="r" hint-placeholder-count="2">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #F8F9FD">
                <span style="flex: 1; min-width: 220px"><strong>{{r.who}}</strong> · {{r.kind}}<br><span style="font-size: 12.5px; color: #6B6D8C">{{r.when}}</span></span>
                <sc-if value="{{r.pending}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{r.done}}" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #32306F; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 12.5px; cursor: pointer">{{r.action}}</button></sc-if>
                <sc-if value="{{r.isDone}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; font-weight: 800; color: #166534">✓ Selesai</span></sc-if>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{isAudit}}" hint-placeholder-val="{{ false }}">
      <section class="rise" style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 800">Audit log</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{auditFilters}}" as="f" hint-placeholder-count="5">
              <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="overflow-x: auto">
          <table style="width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px">
            <thead><tr style="text-align: left; color: #6B6D8C; font-size: 12.5px"><th style="padding: 10px 12px; font-weight: 700">Waktu</th><th style="padding: 10px 12px; font-weight: 700">Aktor</th><th style="padding: 10px 12px; font-weight: 700">Aksi</th><th style="padding: 10px 12px; font-weight: 700">Kategori</th><th style="padding: 10px 12px; font-weight: 700">IP</th></tr></thead>
            <tbody>
              <sc-for list="{{logs}}" as="l" hint-placeholder-count="8">
