<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Catat Sesi Mentoring · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/catat-sesi.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes hop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-22px) rotate(-8deg)}70%{transform:translateY(0)}100%{transform:translateY(0)}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.hop{animation:hop .9s cubic-bezier(.3,1.4,.5,1) both}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="CatatSesi"></div>
<template data-dc="CatatSesi">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="asmen" active="kelompok" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px">
    <a href="kelompok.html" style="font-size: 14px; font-weight: 700; text-decoration: none">← Kembali ke Kelompok Rajawali</a>
    <h1 style="margin: 10px 0 20px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; letter-spacing: -.02em; color: #32306F; line-height: 1">Catat sesi mentoring</h1>

    <sc-if value="{{notSaved}}" hint-placeholder-val="{{ true }}">
      <div class="rise" style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
          <div style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 18px 40px -30px rgba(50,48,111,.45)">
            <h2 style="margin: 0 0 16px; font-size: 18px; font-weight: 800">1 · Detail sesi</h2>
            <div role="group" aria-label="Jenis sesi" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px">
              <button type="button" onClick="{{setGroup}}" aria-pressed="{{groupPressed}}" style="{{groupStyle}}"><strong style="display: block; font-size: 15px">Sesi kelompok</strong><span style="font-size: 12.5px; opacity: .8">Semua mentee Rajawali</span></button>
              <button type="button" onClick="{{setOne}}" aria-pressed="{{onePressed}}" style="{{oneStyle}}"><strong style="display: block; font-size: 15px">1-on-1</strong><span style="font-size: 12.5px; opacity: .8">Satu mentee</span></button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Sesi ke<input type="text" value="#6" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Tanggal<input type="date" value="2026-10-18" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Durasi<select style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>2 jam</option><option>1 jam</option><option>1,5 jam</option></select></label>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Tema kurikulum<select style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Oktober · Komunikasi &amp; Influence</option><option>September · Problem framing</option></select></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Format<select style="height: 46px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Online · Google Meet</option><option>Offline</option><option>Hybrid</option></select></label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; margin-top: 12px">Topik sesi<input type="text" value="Negosiasi dengan stakeholder desa" style="height: 46px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px"></label>
            <p style="margin: 12px 0 0; font-size: 12.5px; color: #3157A5; font-weight: 700">Terhubung ke event kalender "Sesi Mentoring #6 · Sab 18 Okt 09.00"</p>
          </div>

          <div style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">2 · Kehadiran</h2><span style="font-size: 13px; font-weight: 800; color: #166534">{{presentCount}}/{{totalCount}} hadir</span></div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #F8F9FD">
                  <span style="width: 38px; height: 38px; border-radius: 50%; background: {{p.bg}}; color: {{p.ink}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.initials}}</span>
                  <strong style="flex: 1; min-width: 140px; font-size: 14.5px">{{p.name}}</strong>
                  <span role="radiogroup" aria-label="Kehadiran {{p.name}}" style="display: flex; gap: 6px">
                    <sc-for list="{{p.opts}}" as="o" hint-placeholder-count="3">
                      <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
                    </sc-for>
                  </span>
                </div>
              </sc-for>
            </div>
            <p style="margin: 12px 0 0; font-size: 12.5px; color: #6B6D8C">Peserta yang check-in lewat QR ID card sudah otomatis tercentang Hadir.</p>
          </div>

          <div style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
            <h2 style="margin: 0 0 14px; font-size: 18px; font-weight: 800">3 · Ringkasan &amp; tindak lanjut</h2>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Ringkasan diskusi<textarea rows="4" style="resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; line-height: 1.5">Simulasi negosiasi dengan kepala desa. Tiap mentee latihan 5 menit, Mentor Dian memberi feedback. Kesimpulan: siapkan data margin petani sebelum pertemuan desa.</textarea></label>
            <span style="display: block; font-size: 13px; font-weight: 700; margin: 16px 0 8px">Tindak lanjut (otomatis jadi task untuk yang ditunjuk)</span>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{actions}}" as="a" hint-placeholder-count="2">
                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid #E3E7F2">
                  <span style="flex: 1; min-width: 200px; font-size: 14px; font-weight: 600">{{a.text}}</span>
                  <span style="font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: #E4EBF8; color: #3157A5">@{{a.who}}</span>
                  <span style="font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: #FEF3C7; color: #92400E">{{a.due}}</span>
                  <button type="button" onClick="{{a.remove}}" aria-label="Hapus tindak lanjut" style="width: 30px; height: 30px; border-radius: 9px; border: 1px solid #E3E7F2; background: #FFFFFF; cursor: pointer; color: #B42318">×</button>
                </div>
              </sc-for>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <input type="text" aria-label="Tindak lanjut baru" value="{{draft}}" onChange="{{onDraft}}" placeholder="Tulis tindak lanjut…" style="flex: 1 1 240px; height: 44px; padding: 0 12px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px">
                <select aria-label="Ditugaskan ke" onChange="{{onWho}}" style="height: 44px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px; background: #FFFFFF"><option>Semua mentee</option><option>Nabila</option><option>Fajar</option><option>Gita</option><option>Yusuf</option></select>
                <input type="date" aria-label="Tenggat" value="2026-10-25" style="height: 44px; padding: 0 10px; border-radius: 13px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 14px">
                <button type="button" onClick="{{addAction}}" style="height: 44px; padding: 0 16px; border-radius: 13px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; cursor: pointer">+ Tambah</button>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px">
              <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed #A3B4DA; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #3157A5; cursor: pointer">+ Foto dokumentasi</button>
              <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed #A3B4DA; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #3157A5; cursor: pointer">+ Materi / tautan Drive</button>
            </div>
          </div>
        </section>

        <aside style="flex: 1 1 300px; min-width: 0; position: sticky; top: 96px; display: flex; flex-direction: column; gap: 14px">
          <div style="padding: 24px; border-radius: 28px; color: #FFFFFF; background: linear-gradient(135deg,#32306F,#3157A5); box-shadow: inset 0 1px 0 rgba(255,255,255,.25)">
            <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #A3D6E6">RINGKASAN</span>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px; font-size: 14px">
              <div style="display: flex; justify-content: space-between"><span>Jenis</span><strong>{{kindLabel}}</strong></div>
              <div style="display: flex; justify-content: space-between"><span>Hadir</span><strong>{{presentCount}} dari {{totalCount}}</strong></div>
              <div style="display: flex; justify-content: space-between"><span>Tindak lanjut</span><strong>{{actionCount}} task</strong></div>
            </div>
            <p style="margin: 14px 0 0; font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,.8)">Kehadiran masuk ke status monitoring dan komponen "Kehadiran sesi" di raport.</p>
          </div>
          <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; font-weight: 600; padding: 0 4px"><input type="checkbox" checked="" style="margin-top: 3px"> Kirim ringkasan ke grup chat Rajawali</label>
          <button class="btn" type="button" onClick="{{save}}" style="height: 54px; border-radius: 18px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Simpan sesi</button>
          <button type="button" style="height: 44px; border-radius: 14px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Simpan sebagai draft</button>
        </aside>
      </div>
    </sc-if>

    <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="max-width: 560px; margin: 40px auto; text-align: center; padding: 40px; border-radius: 32px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
        <div class="hop" aria-hidden="true" style="width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 28px; background: #D4FF3A; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg)"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0D0D1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M9 5h10v10"></path></svg></div>
        <h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 34px; color: #32306F">Sesi #6 tercatat!</h2>
        <p style="margin: 10px 0 24px; font-size: 15px; line-height: 1.6; color: #55577A">{{presentCount}} hadir, {{actionCount}} task tindak lanjut terkirim ke yang ditunjuk, dan ringkasan diposting ke grup Rajawali.</p>
        <div style="display: flex; gap: 10px; justify-content: center"><a href="monitoring-progres.html" style="height: 48px; padding: 0 18px; border-radius: 14px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font-weight: 800; text-decoration: none; display: flex; align-items: center">Lihat monitoring</a><button type="button" onClick="{{reset}}" style="height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer">Catat sesi lain</button></div>
      </div>
    </sc-if>
  </main>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; gap: 6px; cursor: pointer">Batch 2026
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="position: relative">
          <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
          </sc-if>
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="{{it.style}}">{{it.label}}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 310px; padding: 8px; border-radius: 20px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{it.children}}" as="ch" hint-placeholder-count="3">
                  <a href="{{ch.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: {{c.ink}}">
                    <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #32306F">{{ch.short}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ch.label}}</span><span style="font-size: 12.5px; color: {{c.muted}}; line-height: 1.4">{{ch.desc}}</span></span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; position: relative">
      <button type="button" aria-label="Cari (Ctrl K)" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line2}}; background: {{c.field}}; font: inherit; font-size: 13px; color: {{c.muted}}; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span>Cari</span><span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: {{c.chip}}; border: 1px solid {{c.line2}}">⌘K</span>
      </button>
      <button type="button" aria-label="Tambah cepat" title="Task, note, atau event baru" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #32306F, #3157A5); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.3)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <a href="chat.html" aria-label="Chat, 5 pesan baru" style="position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{c.icon}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>
        <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #3157A5; color: #FFFFFF; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.ring}}">5</span>
      </a>
      <button type="button" onClick="{{toggleNotif}}" aria-label="Notifikasi, 3 belum dibaca" aria-expanded="{{notifExpanded}}" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{c.icon}}; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: #D4FF3A; border: 2px solid #32306F"></span>
      </button>
      <button type="button" onClick="{{toggleMe}}" aria-expanded="{{meExpanded}}" aria-label="Menu akun" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 4px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; cursor: pointer; font: inherit">

<script type="text/x-dc" data-dc="CatatSesi" data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      kind: 'group', saved: false, draft: '', who: 'Semua mentee',
      att: { m1: 'H', m2: 'H', m3: 'I', m4: 'H' },
      actions: [{ id: 1, text: 'Hitung margin petani sebelum/sesudah', who: 'Nabila', due: '25 Okt' }, { id: 2, text: 'Latihan pitch 3 menit, rekam video', who: 'Semua mentee', due: '25 Okt' }]
    };
  }
  renderVals() {
    const st = this.state;
    const defs = [
      { id: 'm1', name: 'Nabila Putri', initials: 'NP', bg: 'linear-gradient(135deg,#3157A5,#A3D6E6)', ink: '#FFFFFF' },
      { id: 'm2', name: 'Fajar Akbar', initials: 'FA', bg: '#A3D6E6', ink: '#1F5566' },
      { id: 'm3', name: 'Gita Wulandari', initials: 'GW', bg: '#D4FF3A', ink: '#0D0D1A' },
      { id: 'm4', name: 'Yusuf Saputra', initials: 'YS', bg: '#32306F', ink: '#FFFFFF' }
    ];
    const list = st.kind === 'group' ? defs : defs.slice(2, 3);
    const O = [['H', 'Hadir', '#16A34A'], ['I', 'Izin', '#F59E0B'], ['A', 'Absen', '#E5484D']];
    const people = list.map((p) => Object.assign({}, p, {
      opts: O.map((o) => {
        const on = st.att[p.id] === o[0];
        return {
          label: o[1], checked: on ? 'true' : 'false',
          style: 'height: 36px; padding: 0 12px; border-radius: 11px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; ' + (on ? 'background: ' + o[2] + '; color: #FFFFFF; border: 1.5px solid ' + o[2] : 'background: #FFFFFF; color: #55577A; border: 1.5px solid #D5DAEA'),
          pick: () => { const a = Object.assign({}, st.att); a[p.id] = o[0]; this.setState({ att: a }); }
        };
      })
    }));
    const present = list.filter((p) => st.att[p.id] === 'H').length;
    const segOn = 'padding: 14px 16px; border-radius: 18px; font: inherit; text-align: left; cursor: pointer; background: #32306F; color: #FFFFFF; border: 2px solid #32306F';
    const segOff = 'padding: 14px 16px; border-radius: 18px; font: inherit; text-align: left; cursor: pointer; background: #FFFFFF; color: #0D0D1A; border: 2px solid #E3E7F2';
    return {
      people: people,
      presentCount: present, totalCount: list.length,
      groupStyle: st.kind === 'group' ? segOn : segOff, oneStyle: st.kind === 'one' ? segOn : segOff,
      groupPressed: st.kind === 'group' ? 'true' : 'false', onePressed: st.kind === 'one' ? 'true' : 'false',
      setGroup: () => this.setState({ kind: 'group' }), setOne: () => this.setState({ kind: 'one' }),
      kindLabel: st.kind === 'group' ? 'Kelompok' : '1-on-1 · Gita',
      actions: st.actions.map((a) => Object.assign({}, a, { remove: () => this.setState({ actions: st.actions.filter((x) => x.id !== a.id) }) })),
      actionCount: st.actions.length,
      draft: st.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onWho: (e) => this.setState({ who: e.target.value }),
      addAction: () => { if (!st.draft.trim()) return; this.setState({ actions: st.actions.concat([{ id: Date.now(), text: st.draft.trim(), who: st.who, due: '25 Okt' }]), draft: '' }); },
      notSaved: !st.saved, saved: st.saved,
      save: () => this.setState({ saved: true }),
      reset: () => this.setState({ saved: false })
    };
  }
}
</script>
