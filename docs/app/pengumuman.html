<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat Pengumuman · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Buat Pengumuman · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/pengumuman.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/portal/app.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/navigation/mobile.css?v=20261105">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(18px,-18px) rotate(-10deg)}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.chip{transition:all .15s}
.chip:hover{transform:translateY(-1px)}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div id="app" data-page="Pengumuman"></div>
<template data-dc="Pengumuman">
<div data-portal-shell style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="pengurus" active="program" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">
    <div>
      <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6B6D8C">Program · broadcast</span>
      <h1 style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 48px; letter-spacing: -.02em; color: #32306F; line-height: 1">{{heading}}</h1>
    </div>

    <p role="alert" style="color:#943B26">{{error}}</p><label>Cohort <select onChange="{{onCohort}}"><template data-dc-each="{{cohorts}}" data-as="c"><option value="{{c.id}}" selected="{{c.selected}}">{{c.name}}</option></template></select></label><button type="button" onClick="{{onReload}}" style="align-self:flex-start;padding:10px 16px;border:1px solid #D5DAEA;border-radius:12px;background:white;color:#32306F;font:inherit;font-weight:700">Muat ulang pengumuman</button>
    <sc-if value="{{canManage}}">
    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
      <section class="rise" style="flex: 999 1 600px; min-width: 0; padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 18px 40px -30px rgba(50,48,111,.45); display: flex; flex-direction: column; gap: 18px">
        <div>
          <span style="display: block; font-size: 14px; font-weight: 800; margin-bottom: 10px">Kirim ke</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
              <button class="chip" type="button" onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}" style="{{r.style}}"><span style="{{r.box}}">{{r.mark}}</span>{{r.label}} <span style="opacity: .7; font-weight: 600">{{r.count}}</span></button>
            </sc-for>
          </div>
          <span style="display: block; font-size: 13px; font-weight: 700; color: #6B6D8C; margin: 14px 0 8px">Atau pilih lebih spesifik</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 16px; border: 1.5px solid #D5DAEA; min-height: 48px; align-items: center">
            <sc-for list="{{specifics}}" as="x" hint-placeholder-count="2">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 6px 6px 6px 10px; border-radius: 10px; background: {{x.bg}}; color: {{x.ink}}">{{x.label}}<button type="button" onClick="{{x.remove}}" aria-label="Hapus {{x.label}}" style="width: 20px; height: 20px; border-radius: 6px; border: 0; background: rgba(255,255,255,.7); cursor: pointer; font-size: 12px">×</button></span>
            </sc-for>
            <select aria-label="Tambah penerima" onChange="{{addSpecific}}" style="flex: 1; min-width: 200px; height: 34px; border: 0; font: inherit; font-size: 13.5px; color: #55577A; background: transparent">
              <option value="">+ Kelompok atau orang…</option><template data-dc-each="{{specificOptions}}" data-as="o"><option value="{{o.value}}">{{o.label}}</option></template>
            </select>
          </div>
          <p style="margin: 10px 0 0; font-size: 13px; font-weight: 700; color: #3157A5">Penerima aktif saat ini: {{total}} orang</p>
        </div>

        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 800">Judul<input data-announcement-title type="text" value="{{title}}" onChange="{{onTitle}}" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 16px; font-weight: 700"></label>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 800">Isi pengumuman
          <span style="display: flex; gap: 4px; padding: 6px; border-radius: 12px 12px 0 0; border: 1.5px solid #D5DAEA; border-bottom: 0; background: #F8F9FD"><span style="width: 30px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900">B</span><span style="width: 30px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-style: italic; font-weight: 700">I</span><span style="width: 30px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700">•</span><span style="width: 30px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #3157A5">@</span><span style="width: 30px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span></span>
          <textarea data-announcement-body rows="6" value="{{body}}" onChange="{{onBody}}" style="margin-top: -8px; resize: vertical; padding: 14px; border-radius: 0 0 14px 14px; border: 1.5px solid #D5DAEA; font: inherit; font-weight: 500; font-size: 14.5px; line-height: 1.55"></textarea>
        </label>

        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" disabled style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed #A3B4DA; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #3157A5; cursor: pointer">+ Lampiran / dokumen (belum tersedia)</button>
          <button type="button" disabled style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed #A3B4DA; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #3157A5; cursor: pointer">+ Tautkan event (belum tersedia)</button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; padding: 16px; border-radius: 20px; background: #F8F9FD">
          <div>
            <span style="display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px">Kanal</span>
            <label style="display: flex; gap: 8px; font-size: 14px; padding: 4px 0"><input type="checkbox" checked="" disabled=""> In-app (selalu)</label>
            <label style="display: flex; gap: 8px; font-size: 14px; padding: 4px 0"><input type="checkbox" disabled> Email (belum terhubung)</label>
            <label style="display: flex; gap: 8px; font-size: 14px; padding: 4px 0"><input type="checkbox" disabled> Push notification + suara (belum terhubung)</label>
          </div>
          <div>
            <span style="display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px">Waktu kirim</span>
            <div role="group" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #E9EDF7">
              <button type="button" onClick="{{now}}" aria-pressed="{{nowPressed}}" style="{{nowStyle}}">Sekarang</button>
              <button type="button" onClick="{{later}}" aria-pressed="{{laterPressed}}" style="{{laterStyle}}">Jadwalkan</button>
            </div>
            <sc-if value="{{isLater}}" hint-placeholder-val="{{ false }}">
              <input type="datetime-local" value="{{publishAt}}" onChange="{{onPublishAt}}" aria-label="Jadwal kirim" title="Waktu Asia/Jakarta (WIB)" style="margin-top: 8px; width: 100%; box-sizing: border-box; height: 42px; padding: 0 10px; border-radius: 12px; border: 1.5px solid #D5DAEA; font: inherit; font-size: 13.5px">
            </sc-if>
          </div>
          <div>
            <span style="display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px">Tampilan</span>
            <label style="display: flex; gap: 8px; font-size: 14px; padding: 4px 0"><input type="checkbox" checked="{{pinned}}" onChange="{{onPinned}}"> Sematkan di beranda</label>
            <label style="display: flex; gap: 8px; font-size: 14px; padding: 4px 0"><input type="checkbox" checked="{{important}}" onChange="{{onImportant}}"> Tandai penting (badge merah)</label>
          </div>
        </div>
      </section>

      <aside style="flex: 1 1 340px; min-width: 0; position: sticky; top: 96px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-size: 13px; font-weight: 800; color: #6B6D8C">Pratinjau di HP penerima</span>
        <div style="padding: 14px; border-radius: 32px; background: #0D0D1A; box-shadow: 0 30px 60px -30px rgba(13,13,26,.8)">
          <div style="border-radius: 22px; background: #F5F7FC; padding: 16px; min-height: 300px">
            <div style="display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 16px; background: rgba(255,255,255,.9); box-shadow: 0 10px 20px -14px rgba(0,0,0,.4)">
              <img src="../assets/logo-color.png" alt="" style="width: 34px; height: auto">
              <span style="flex: 1; min-width: 0"><strong style="display: block; font-size: 12.5px">IPB LEAP · sekarang</strong><span style="display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span></span>
            </div>
            <div style="margin-top: 14px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E7F2">
              <span style="font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; background: #D4FF3A; color: #0D0D1A">PENGUMUMAN</span>
              <strong style="display: block; font-size: 16px; margin-top: 10px">{{title}}</strong>
              <p style="margin: 8px 0 0; font-size: 13.5px; line-height: 1.55; color: #33355A; white-space: pre-line">{{body}}</p>
              <span style="display: block; margin-top: 10px; font-size: 12px; color: #6B6D8C">Dari {{actorName}} · untuk {{toLabel}}</span>
            </div>
          </div>
        </div>
        <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
          <button class="btn" type="button" onClick="{{send}}" disabled="{{busy}}" style="height: 54px; border-radius: 18px; border: 0; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.25)">{{sendLabel}}</button>
        </sc-if>
        <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #EEFFB8; font-size: 14px"><span style="width: 40px; height: 40px; border-radius: 14px; background: #D4FF3A; border: 2px solid #0D0D1A; display: flex; align-items: center; justify-content: center; font-weight: 900">✓</span><span><strong style="display: block">Pengumuman tersimpan</strong>Terbit sesuai jadwal di aplikasi. Tidak ada email atau push yang dikirim.</span></div>
        </sc-if>
      </aside>
    </div>

    <section style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
      <h2 style="margin: 0 0 14px; font-size: 19px; font-weight: 800">Riwayat pengumuman</h2>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 680px">
          <thead><tr style="text-align: left; color: #6B6D8C; font-size: 12.5px"><th style="padding: 10px 12px; font-weight: 700">Judul</th><th style="padding: 10px 12px; font-weight: 700">Penerima</th><th style="padding: 10px 12px; font-weight: 700">Dikirim</th><th style="padding: 10px 12px; font-weight: 700">Status</th></tr></thead>
          <tbody>
            <template data-dc-each="{{history}}" data-as="h">
              <tr id="{{h.anchor}}" style="border-top: 1px solid #F0F2F8"><td style="padding: 12px; font-weight: 700">{{h.title}}</td><td style="padding: 12px; color: #55577A">{{h.to}}</td><td style="padding: 12px; color: #55577A">{{h.when}}</td><td style="padding:12px">{{h.status}}<sc-if value="{{h.canWithdraw}}"><button type="button" onClick="{{h.withdraw}}">Tarik</button></sc-if></td></tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
    </sc-if>
    <sc-if value="{{readOnly}}"><section style="padding:24px;border-radius:28px;background:white;border:1px solid #E3E7F2"><sc-if value="{{noNews}}"><p>Belum ada pengumuman pengurus untuk akunmu.</p></sc-if><sc-for list="{{news}}" as="a"><article id="{{a.anchor}}" style="padding:20px 0;border-bottom:1px solid #E3E7F2"><h2>{{a.title}}</h2><small>{{a.when}}</small><p style="white-space:pre-wrap;line-height:1.7">{{a.body}}</p></article></sc-for></section></sc-if>
  </main>
</div>
</template>
<template data-dc="Navbar">
<header class="leap-erp-header" style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <span class="leap-batch-label" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; white-space: nowrap">Batch 2026</span>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="position: relative">
          <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
          </sc-if>
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="{{it.style}}">{{it.label}}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 310px; padding: 8px; border-radius: 20px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{it.children}}" as="ch" hint-placeholder-count="3">
                  <a href="{{ch.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: {{c.ink}}">
                    <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #32306F">{{ch.short}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ch.label}}</span><span style="font-size: 12.5px; color: {{c.muted}}; line-height: 1.4">{{ch.desc}}</span></span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; position: relative">
      <button type="button" aria-label="Cari (Ctrl K)" data-leap-search style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line2}}; background: {{c.field}}; font: inherit; font-size: 13px; color: {{c.muted}}; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span>Cari</span><span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: {{c.chip}}; border: 1px solid {{c.line2}}">⌘K</span>
      </button>
      <a hidden data-hidden-feature="chat" href="chat.html" aria-label="Chat, 5 pesan baru" style="display:none!important;position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{c.icon}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>
        <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #3157A5; color: #FFFFFF; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.ring}}">5</span>
      </a>
      <button type="button" onClick="{{toggleNotif}}" aria-label="{{notifLabel}}" aria-expanded="{{notifExpanded}}" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{c.icon}}; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <sc-if value="{{hasUnread}}"><span style="position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: #D4FF3A; border: 2px solid #32306F"></span></sc-if>
      </button>
      <button type="button" onClick="{{toggleMe}}" aria-expanded="{{meExpanded}}" aria-label="Menu akun" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 4px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; cursor: pointer; font: inherit">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: {{avatarBg}}; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{initials}}</span>
        <span style="font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: {{roleBg}}; color: {{roleInk}}">{{roleLabel}}</span>
      </button>

      <sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; top: 56px; right: 40px; width: 360px; padding: 16px; border-radius: 22px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px">
            <strong style="font-size:15px">Notifikasi</strong>
            <sc-if value="{{hasUnread}}"><button type="button" onClick="{{markNotifications}}" style="padding:8px;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:{{c.link}};cursor:pointer">Tandai dibaca</button></sc-if>
          </div>
          <p role="status" style="margin:0;color:{{c.muted}};font-size:13px">{{notifMessage}}</p>
          <div style="display:flex;flex-direction:column;max-height:360px;overflow:auto">

<script type="text/x-dc" data-dc="Navbar" data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);

  componentDidMount(){
    const review=location.pathname.includes('/review-penilaian/');

    const updateMobile=()=>mobile?.then(m=>m.mountMobileNavigation(this.renderVals())).catch(()=>{});

      const actor=window.leapAccount?.id;

        this._notificationActor=actor;
        this._notificationRequest=null;
        this._notificationKey=null;
        this.setState({notifications:[],readIds:[],notifMessage:''});
      }
      this.setState({open:null,notif:false,me:false});
      updateMobile();
    });
    updateMobile();
    if(!review)import(new URL('../assets/assessment/session.mjs',location.href).href).then(m=>m.mountSession()).then(()=>import(new URL('../assets/portal/search.mjs?v=20261104-event',location.href).href)).then(m=>m.mountSearch()).catch(()=>{});
  }
  async toggleNotifications() {
    const open=!this.state.notif;
    this.setState({notif:open,me:false,open:null});

    const actor=window.leapAccount;
    if(!actor?.id||location.pathname.includes('/review-penilaian/')){
      this.setState({notifMessage:'Belum ada notifikasi.'});
      return;
    }
    const request=Symbol();
    this._notificationRequest=request;
    this.setState({notifMessage:'Memuat notifikasi…'});
    try{
      const {portalWorkspace,activeAnnouncements,portalURL,stamp}=await import(new URL('../assets/portal/api.mjs',location.href).href);
      const data=await portalWorkspace();
      if(this._notificationRequest!==request||window.leapAccount?.id!==actor.id)return;
      this._notificationKey='ipbleap.notifications.read.'+actor.id+'.'+data.selectedCohort;
      let readIds=this.state.readIds;
      try{readIds=JSON.parse(localStorage.getItem(this._notificationKey)||'[]');}catch{}
      if(!Array.isArray(readIds))readIds=[];
      const notifications=activeAnnouncements(data).map(a=>({
        id:a.id,title:a.title,when:stamp(a.publish_at),
        href:portalURL('pengumuman.html',data)+'#announcement-'+encodeURIComponent(a.id),
      }));
      this.setState({notifications,readIds,notifMessage:notifications.length?'':'Belum ada notifikasi.'});
    }catch{
      if(this._notificationRequest===request)this.setState({notifMessage:'Notifikasi belum dapat dimuat. Tutup dan buka kembali untuk mencoba lagi.'});
    }
  }
  markNotifications(ids) {
    const readIds=[...new Set([...this.state.readIds,...ids])];
    try{localStorage.setItem(this._notificationKey,JSON.stringify(readIds));}catch{}
    this.setState({readIds});
  }

    const dark = (this.props.theme ?? 'light') === 'dark';

    const people = {

      mentee: { name: 'Akun mentee', subtitle: 'Mentee', initials: 'M', avatarBg: 'linear-gradient(135deg,#3157A5,#A3D6E6)', roleLabel: 'Mentee', roleBg: '#E3F3F8', roleInk: '#1F5566' },
