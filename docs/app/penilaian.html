<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penilaian 360° · IPB Leap Management System</title>
<meta name="description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Penilaian 360° · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/penilaian.html">
<meta property="og:image" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/assets/logo-color.png">
<meta name="theme-color" content="#32306F">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes hop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-22px) rotate(-8deg)}70%{transform:translateY(0)}85%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.rise{animation:rise .5s cubic-bezier(.2,.9,.3,1.15) both}
.hop{animation:hop .9s cubic-bezier(.3,1.4,.5,1) both}
.pop{animation:pop .35s ease both}
.seg{transition:all .15s}
.seg:hover{border-color:#3157A5 !important}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
input[type=range]{accent-color:#3157A5}
textarea:focus{outline:none;border-color:#3157A5 !important;box-shadow:0 0 0 4px rgba(49,87,165,.14)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="Penilaian"></div>
<template data-dc="Penilaian">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="asmen" active="kelompok" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px">
    <div class="rise" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px">
      <div>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6B6D8C">Penilaian bulanan 360° · Kelompok Rajawali</span>
        <h1 style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; letter-spacing: -.02em; color: #32306F">Oktober 2026</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <span style="font-size: 13.5px; font-weight: 700; padding: 10px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E7F2">Dibuka 25 Okt – 5 Nov</span>
        <span style="font-size: 13.5px; font-weight: 800; padding: 10px 14px; border-radius: 14px; background: #FEF3C7; color: #92400E">Sisa 3 hari</span>
        <span style="font-size: 13.5px; font-weight: 800; padding: 10px 14px; border-radius: 14px; background: #32306F; color: #FFFFFF">{{sentCount}} / 5 terkirim</span>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <aside style="flex: 1 1 260px; max-width: 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 700; color: #6B6D8C; padding: 0 4px">Form yang harus kamu isi</span>
        <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
          <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">
            <span style="width: 42px; height: 42px; flex: none; border-radius: 50%; background: {{p.bg}}; color: {{p.ink}}; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{p.initials}}</span>
            <span style="flex: 1; min-width: 0; text-align: left"><span style="display: block; font-weight: 700; font-size: 14.5px">{{p.name}}</span><span style="font-size: 12.5px; color: #6B6D8C">{{p.form}}</span></span>
            <span style="font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: {{p.stBg}}; color: {{p.stInk}}">{{p.status}}</span>
          </button>
        </sc-for>
        <div style="margin-top: 8px; padding: 16px; border-radius: 20px; background: #E3F3F8; font-size: 13px; line-height: 1.55; color: #1F5566">
          <strong style="display: block; color: #0D0D1A; margin-bottom: 4px">Kamu juga dinilai</strong>
          Mentee mengisi feedback 360° untukmu (anonim), dan Mentor mengisi Raport Asmen.
        </div>
      </aside>

      <section style="flex: 999 1 560px; min-width: 0; border-radius: 28px; padding: 28px; background: linear-gradient(180deg, #FFFFFF, #FAFBFF); border: 1px solid rgba(50,48,111,.08); box-shadow: inset 0 1px 0 #FFFFFF, 0 20px 50px -34px rgba(50,48,111,.5)">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 22px">
          <div>
            <h2 style="margin: 0; font-size: 24px; font-weight: 800; color: #32306F">{{selForm}} · {{selName}}</h2>
            <p style="margin: 4px 0 0; font-size: 13.5px; color: #6B6D8C">Rubric Raport Mentee v2 · 6 indikator · total bobot 100% · tersimpan otomatis</p>
          </div>
          <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 12px; background: #DCFCE7; color: #166534">Terkirim · terkunci</span>
          </sc-if>
        </div>

        <div style="display: flex; flex-direction: column; gap: 22px">
          <sc-for list="{{aspects}}" as="a" hint-placeholder-count="3">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px">
                <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #3157A5">{{a.name}}</span>
                <span style="font-size: 13px; font-weight: 800; color: #32306F">{{a.subtotal}} poin</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px">
                <sc-for list="{{a.items}}" as="i" hint-placeholder-count="2">
                  <div style="padding: 16px 18px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8EBF4">
                    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
                      <span style="font-weight: 700; font-size: 15px">{{i.name}}</span>
                      <span style="font-size: 12.5px; color: #6B6D8C; font-weight: 600">Bobot {{i.weight}}% · skala {{i.scaleLabel}}</span>
                    </div>
                    <sc-if value="{{i.isFive}}" hint-placeholder-val="{{ true }}">
                      <div>
                        <div role="radiogroup" aria-label="{{i.name}}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px">
                          <sc-for list="{{i.levels}}" as="l" hint-placeholder-count="5">
                            <button class="seg" type="button" role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" disabled="{{l.disabled}}" style="{{l.style}}">{{l.n}}</button>
                          </sc-for>
                        </div>
                        <p style="margin: 10px 0 0; font-size: 13px; color: #55577A; line-height: 1.5"><strong style="color: #32306F">Level {{i.value}}:</strong> {{i.levelDesc}}</p>
                      </div>
                    </sc-if>
                    <sc-if value="{{i.isHundred}}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; align-items: center; gap: 16px; margin-top: 12px">
                        <input type="range" min="1" max="100" value="{{i.value}}" onChange="{{i.onRange}}" disabled="{{i.disabledBool}}" aria-label="{{i.name}}" style="flex: 1">
                        <span style="width: 64px; text-align: center; padding: 8px 0; border-radius: 12px; background: #F1F4FB; font-weight: 800; font-size: 16px; color: #32306F">{{i.value}}</span>
                      </div>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>

          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700">Komentar untuk {{selFirst}} <span style="font-weight: 500; color: #6B6D8C; font-size: 12.5px">Wajib, minimal 20 karakter. Ditampilkan di raport.</span>
            <textarea rows="3" placeholder="Apa yang sudah bagus, dan satu hal yang perlu dilatih bulan depan." style="resize: vertical; padding: 14px; border-radius: 16px; border: 1.5px solid #D5DAEA; font: inherit; font-weight: 500; font-size: 14px">Inisiatifnya kuat saat memimpin diskusi proposal. Bulan depan latih ringkas saat presentasi.</textarea>
          </label>
        </div>
      </section>

      <aside style="flex: 1 1 300px; max-width: 360px; min-width: 0; position: sticky; top: 96px; display: flex; flex-direction: column; gap: 16px">
        <div class="pop" style="border-radius: 28px; padding: 26px; color: #FFFFFF; background: linear-gradient(135deg, #32306F, #3157A5); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 28px 50px -30px rgba(50,48,111,.9); position: relative; overflow: hidden">
          <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(260px 160px at 100% 0%, rgba(163,214,230,.4), transparent 70%)"></div>
          <div style="position: relative">
            <span style="font-size: 13px; font-weight: 700; opacity: .85">Skor form (dihitung otomatis)</span>
            <div style="display: flex; align-items: flex-end; gap: 10px; margin: 6px 0 12px">
              <span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 68px; line-height: .9; letter-spacing: -.03em">{{scoreText}}</span>
              <span style="margin-bottom: 8px; font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: #D4FF3A; color: #0D0D1A">{{predikat}}</span>
            </div>
            <div style="height: 10px; border-radius: 10px; background: rgba(255,255,255,.2); overflow: hidden"><div style="height: 100%; width: {{scorePct}}%; border-radius: 10px; background: linear-gradient(90deg, #A3D6E6, #D4FF3A); transition: width .3s"></div></div>
          </div>
        </div>

        <div style="border-radius: 24px; padding: 22px; background: #FFFFFF; border: 1px solid #E3E7F2">
          <span style="font-size: 13px; font-weight: 800; color: #32306F">Nilai bulanan {{selFirst}}</span>
          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px; font-size: 14px">
            <div style="display: flex; justify-content: space-between"><span style="color: #55577A">Skor Mentor × 50%</span><strong>{{mentorText}}</strong></div>
            <div style="display: flex; justify-content: space-between"><span style="color: #55577A">Skor kamu (Asmen) × 50%</span><strong>{{scoreText}}</strong></div>
            <div style="height: 1px; background: #E3E7F2"></div>
            <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700">Nilai bulanan</span><span style="font-size: 22px; font-weight: 800; color: #32306F">{{monthlyText}}</span></div>
            <sc-if value="{{mentorMissing}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 12.5px; color: #92400E; background: #FEF3C7; padding: 8px 10px; border-radius: 10px">Mentor belum mengisi. Jika sampai 5 Nov kosong, nilai memakai skor kamu 100% dan ditandai "Penilai tidak lengkap".</span>
            </sc-if>
          </div>
        </div>

        <sc-if value="{{notLocked}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <button class="btn" type="button" onClick="{{submit}}" style="height: 54px; border: 0; border-radius: 18px; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 16px 30px -18px rgba(13,13,26,.9)">Kirim penilaian</button>
            <span style="font-size: 12.5px; color: #6B6D8C; text-align: center">Setelah dikirim, form terkunci. Pembukaan ulang lewat pengurus.</span>
          </div>
        </sc-if>
        <sc-if value="{{justSent}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #EEFFB8">
            <span class="hop" aria-hidden="true" style="width: 48px; height: 48px; flex: none; border-radius: 16px; background: #D4FF3A; border: 2px solid #0D0D1A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D0D1A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M9 5h10v10"></path></svg></span>
            <span style="font-size: 14px; line-height: 1.45; color: #2B3600"><strong style="display: block; color: #0D0D1A">Leap! Terkirim.</strong>Lanjut ke form berikutnya.</span>
          </div>
        </sc-if>
      </aside>
    </div>
  </main>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; gap: 6px; cursor: pointer">Batch 2026
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="position: relative">
          <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
          </sc-if>
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="{{it.style}}">{{it.label}}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 310px; padding: 8px; border-radius: 20px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{it.children}}" as="ch" hint-placeholder-count="3">
                  <a href="{{ch.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: {{c.ink}}">
                    <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #32306F">{{ch.short}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ch.label}}</span><span style="font-size: 12.5px; color: {{c.muted}}; line-height: 1.4">{{ch.desc}}</span></span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; position: relative">
      <button type="button" aria-label="Cari (Ctrl K)" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line2}}; background: {{c.field}}; font: inherit; font-size: 13px; color: {{c.muted}}; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span>Cari</span><span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: {{c.chip}}; border: 1px solid {{c.line2}}">⌘K</span>
      </button>
      <button type="button" aria-label="Tambah cepat" title="Task, note, atau event baru" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #32306F, #3157A5); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.3)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <a href="chat.html" aria-label="Chat, 5 pesan baru" style="position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{c.icon}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>
        <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #3157A5; color: #FFFFFF; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.ring}}">5</span>
      </a>
      <button type="button" onClick="{{toggleNotif}}" aria-label="Notifikasi, 3 belum dibaca" aria-expanded="{{notifExpanded}}" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{c.icon}}; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: #D4FF3A; border: 2px solid #32306F"></span>
      </button>
      <button type="button" onClick="{{toggleMe}}" aria-expanded="{{meExpanded}}" aria-label="Menu akun" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 4px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; cursor: pointer; font: inherit">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: {{avatarBg}}; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{initials}}</span>
        <span style="font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: {{roleBg}}; color: {{roleInk}}">{{roleLabel}}</span>
      </button>

      <sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; top: 56px; right: 40px; width: 360px; padding: 16px; border-radius: 22px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><strong style="font-size: 15px">Notifikasi</strong><span style="font-size: 12.5px; font-weight: 700; color: {{c.link}}">Tandai dibaca</span></div>
          <div style="display: flex; flex-direction: column">

<script type="text/x-dc" data-dc="Penilaian" data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sel: 'm1',
      status: { m1: 'Draft', m2: 'Terkirim', m3: 'Belum', m4: 'Terkirim', d1: 'Terkirim' },
      vals: {
        m1: { k1: 4, k2: 4, c1: 5, c2: 4, h1: 92, h2: 85 },
        m2: { k1: 4, k2: 3, c1: 4, c2: 4, h1: 83, h2: 80 },
        m3: { k1: 3, k2: 3, c1: 3, c2: 3, h1: 60, h2: 60 },
        m4: { k1: 5, k2: 4, c1: 4, c2: 5, h1: 100, h2: 95 },
        d1: { k1: 5, k2: 5, c1: 4, c2: 5, h1: 100, h2: 90 }
      },
      justSent: false
    };
  }
  renderVals() {
    const st = this.state;
    const peopleDefs = [
      { id: 'm1', name: 'Nabila Putri', initials: 'NP', form: 'Raport Mentee', bg: 'linear-gradient(135deg,#3157A5,#A3D6E6)', ink: '#FFFFFF', mentor: 88.0 },
      { id: 'm2', name: 'Fajar Akbar', initials: 'FA', form: 'Raport Mentee', bg: '#A3D6E6', ink: '#1F5566', mentor: 79.5 },
      { id: 'm3', name: 'Gita Wulandari', initials: 'GW', form: 'Raport Mentee', bg: '#D4FF3A', ink: '#0D0D1A', mentor: null },
      { id: 'm4', name: 'Yusuf Saputra', initials: 'YS', form: 'Raport Mentee', bg: '#32306F', ink: '#FFFFFF', mentor: 91.2 },
      { id: 'd1', name: 'Dian Hapsari', initials: 'DH', form: 'Raport Mentor', bg: 'linear-gradient(135deg,#0D0D1A,#32306F)', ink: '#FFFFFF', mentor: null }
    ];
    const stColor = { Belum: ['#FEE2E2', '#991B1B'], Draft: ['#FEF3C7', '#92400E'], Terkirim: ['#DCFCE7', '#166534'] };
    const people = peopleDefs.map((p) => {
      const on = st.sel === p.id;
      const s = st.status[p.id];
      return Object.assign({}, p, {
        status: s, stBg: stColor[s][0], stInk: stColor[s][1],
        pressed: on ? 'true' : 'false',
        style: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 20px; font: inherit; cursor: pointer; color: #0D0D1A; background: ' + (on ? '#FFFFFF' : 'transparent') + '; border: 1.5px solid ' + (on ? '#3157A5' : 'transparent') + '; box-shadow: ' + (on ? '0 14px 30px -20px rgba(49,87,165,.7)' : 'none'),
        pick: () => this.setState({ sel: p.id, justSent: false })
      });
    });
    const cur = peopleDefs.find((p) => p.id === st.sel);
    const locked = st.status[st.sel] === 'Terkirim';
    const v = st.vals[st.sel];
    const lvl = {
      k1: ['Menunggu arahan', 'Mulai bila diminta', 'Mengambil peran saat perlu', 'Proaktif memulai dan menuntaskan', 'Menggerakkan orang lain tanpa diminta'],
      k2: ['Ragu, tidak memutuskan', 'Memutuskan tanpa data', 'Memutuskan dengan data cukup', 'Menimbang opsi dan risiko', 'Tegas, terukur, dan menjelaskan alasannya'],
      c1: ['Sulit dipahami', 'Pesan kurang runtut', 'Jelas dalam situasi biasa', 'Runtut dan meyakinkan', 'Menginspirasi dan adaptif ke audiens'],
      c2: ['Bekerja sendiri', 'Ikut bila diajak', 'Kooperatif', 'Aktif mendukung tim', 'Menyatukan tim saat ada konflik']
    };
    const defs = [
      { name: 'Kepemimpinan', items: [
        { id: 'k1', name: 'Inisiatif & ownership', weight: 20, max: 5 },
        { id: 'k2', name: 'Pengambilan keputusan', weight: 15, max: 5 }
      ] },
      { name: 'Komunikasi', items: [
        { id: 'c1', name: 'Komunikasi & presentasi', weight: 20, max: 5 },
        { id: 'c2', name: 'Kolaborasi tim', weight: 15, max: 5 }
      ] },
      { name: 'Komitmen', items: [
        { id: 'h1', name: 'Kehadiran sesi mentoring', weight: 15, max: 100 },
        { id: 'h2', name: 'Ketepatan tugas & update progres', weight: 15, max: 100 }
      ] }
    ];
    const setVal = (id, n) => {
      if (locked) return;
      const all = Object.assign({}, st.vals);
      all[st.sel] = Object.assign({}, all[st.sel]);
      all[st.sel][id] = n;
      const status = Object.assign({}, st.status);
      if (status[st.sel] === 'Belum') status[st.sel] = 'Draft';
      this.setState({ vals: all, status: status });
    };
    let total = 0;
    const fmt = (x) => x.toFixed(1).replace('.', ',');
    const aspects = defs.map((a) => {
      let sub = 0;
      const items = a.items.map((i) => {
        const val = v[i.id];
        const pts = val / i.max * 100 * i.weight / 100;
        sub += pts;
        const five = i.max === 5;
        return Object.assign({}, i, {
          value: val,
          isFive: five,
          isHundred: !five,
          scaleLabel: five ? '1–5' : '1–100',
          disabledBool: locked,
          levelDesc: five ? lvl[i.id][val - 1] : '',
          onRange: (e) => setVal(i.id, Number(e.target.value)),
          levels: five ? [1, 2, 3, 4, 5].map((n) => ({
            n: n,
            checked: n === val ? 'true' : 'false',
            disabled: locked,
            pick: () => setVal(i.id, n),
            style: 'height: 46px; border-radius: 14px; font: inherit; font-weight: 800; font-size: 16px; cursor: ' + (locked ? 'default' : 'pointer') + '; ' + (n === val ? 'background: #32306F; color: #FFFFFF; border: 1.5px solid #32306F; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 20px -12px rgba(50,48,111,.9)' : (n < val ? 'background: #E4EBF8; color: #32306F; border: 1.5px solid #E4EBF8' : 'background: #FFFFFF; color: #55577A; border: 1.5px solid #D5DAEA'))
          })) : []
        });
      });
      total += sub;
      return { name: a.name, items: items, subtotal: fmt(sub) };
    });
    const pred = total >= 85 ? 'A · Sangat Baik' : total >= 70 ? 'B · Baik' : total >= 55 ? 'C · Cukup' : 'D · Perlu Pembinaan';
    const isMentorForm = st.sel === 'd1';
    const mentorScore = cur.mentor;
    const monthly = isMentorForm ? null : (mentorScore == null ? total : (mentorScore * 0.5 + total * 0.5));
    return {
      people: people,
      aspects: aspects,
      selName: cur.name,
      selForm: cur.form,
      selFirst: cur.name.split(' ')[0],
      scoreText: fmt(total),
      scorePct: Math.round(total),
      predikat: pred,
      mentorText: isMentorForm ? '—' : (mentorScore == null ? 'belum' : fmt(mentorScore)),
      monthlyText: monthly == null ? '—' : fmt(monthly),
      mentorMissing: !isMentorForm && mentorScore == null,
      locked: locked,
      notLocked: !locked,
      justSent: st.justSent && locked,
      sentCount: Object.keys(st.status).filter((k) => st.status[k] === 'Terkirim').length,
      submit: () => { const s = Object.assign({}, st.status); s[st.sel] = 'Terkirim'; this.setState({ status: s, justSent: true }); }
    };
  }
}
</script>
