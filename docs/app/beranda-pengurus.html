<html lang="id">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Beranda Pengurus · IPB Leap Management System">
<meta property="og:description" content="Prototype IPB Leap Management System — platform mentoring IPB LEAP untuk mentee, asmen, mentor, pengurus, dan bendahara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kawanberinovasi-ops.github.io/ipb-leap-website/app/beranda-pengurus.html">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dash{0%{transform:translateX(-30%);opacity:0}30%{opacity:1}100%{transform:translateX(70%);opacity:0}}
.rise{animation:rise .5s cubic-bezier(.2,.9,.3,1.15) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.speed{animation:dash 2.8s ease-in-out infinite}.s2{animation-delay:.7s}
.lift{transition:transform .18s, box-shadow .18s}
.lift:hover{transform:translateY(-4px);box-shadow:0 22px 44px -24px rgba(50,48,111,.55) !important}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
.row:hover{background:#F7F9FF}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="BerandaPengurus"></div>
<template data-dc="BerandaPengurus">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="pengurus" active="beranda" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; justify-content: flex-end">
      <div role="group" aria-label="Pratinjau jabatan" style="display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: #E9EDF7; align-items: center">
        <span style="font-size: 12px; font-weight: 700; color: #6B6D8C; padding: 0 8px">Pratinjau jabatan:</span>
        <button type="button" onClick="{{asOps}}" aria-pressed="{{opsPressed}}" style="{{opsTab}}">Head of Operations</button>
        <button type="button" onClick="{{asPic}}" aria-pressed="{{picPressed}}" style="{{picTab}}">PIC Verifikasi</button>
      </div>
    </div>

    <section class="rise" style="position: relative; overflow: hidden; border-radius: 32px; padding: 30px 34px; background: #0E0D2B; color: #FFFFFF; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 22px">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(500px 280px at 0% 0%, rgba(49,87,165,.55), transparent 70%), radial-gradient(360px 240px at 100% 100%, rgba(212,255,58,.18), transparent 70%)"></div>
      <div aria-hidden="true" style="position: absolute; left: 34%; top: 24px; width: 36%; display: flex; flex-direction: column; gap: 10px">
        <div class="speed" style="height: 4px; width: 80%; border-radius: 4px; background: linear-gradient(90deg, transparent, rgba(163,214,230,.6))"></div>
        <div class="speed s2" style="height: 4px; width: 60%; border-radius: 4px; background: linear-gradient(90deg, transparent, rgba(212,255,58,.6))"></div>
      </div>
      <div style="position: relative">
        <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .1em; color: #A3D6E6">STEERING TEAM IPB LEAP 2026 · {{jabatanUpper}}</span>
        <h1 style="margin: 8px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">Fokus minggu ini.</h1>
        <p style="margin: 12px 0 0; font-size: 15.5px; color: rgba(255,255,255,.82); max-width: 560px">{{openTasks}} task belum selesai, 1 lewat tenggat. 2 proker yang kamu pegang sedang berjalan.</p>
      </div>
      <div style="position: relative; display: flex; flex-wrap: wrap; gap: 10px">
        <a class="btn" href="pengumuman.html" style="height: 48px; padding: 0 18px; border-radius: 16px; background: #D4FF3A; color: #0D0D1A; font-weight: 800; font-size: 14px; text-decoration: none; display: flex; align-items: center">+ Pengumuman</a>
        <a class="btn" href="kelola-event.html" style="height: 48px; padding: 0 18px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; display: flex; align-items: center">+ Event</a>
        <a class="btn" href="proker.html" style="height: 48px; padding: 0 18px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; display: flex; align-items: center">+ Task</a>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
      <section class="rise d1" style="flex: 999 1 560px; min-width: 0; padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 18px 40px -30px rgba(50,48,111,.45)">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">Task saya</h2>
          <a href="proker.html" style="font-size: 13px; font-weight: 700">Semua task →</a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{tasks}}" as="t" hint-placeholder-count="5">
            <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="{{t.row}}">
              <span style="{{t.box}}">{{t.mark}}</span>
              <span style="flex: 1; text-align: left; min-width: 0"><span style="{{t.titleStyle}}">{{t.title}}</span><span style="display: block; font-size: 12.5px; color: #6B6D8C">{{t.proker}}</span></span>
              <span style="font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 9px; background: {{t.dueBg}}; color: {{t.dueInk}}; white-space: nowrap">{{t.due}}</span>
            </button>
          </sc-for>
        </div>
      </section>

      <aside style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div class="rise d2" style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
          <h2 style="margin: 0 0 14px; font-size: 18px; font-weight: 800">Jadwal minggu ini</h2>
          <div style="display: flex; flex-direction: column; gap: 12px; font-size: 14px">
            <div style="display: flex; gap: 12px; align-items: center"><span style="width: 50px; height: 54px; flex: none; border-radius: 16px; background: #32306F; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 10.5px; font-weight: 700; opacity: .8">RAB</span><strong style="font-size: 19px; line-height: 1">14</strong></span><span><strong style="display: block">Rapat divisi Operations</strong><span style="font-size: 12.5px; color: #6B6D8C">19.30 · Google Meet</span></span></div>
            <div style="display: flex; gap: 12px; align-items: center"><span style="width: 50px; height: 54px; flex: none; border-radius: 16px; background: #E4EBF8; color: #3157A5; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 10.5px; font-weight: 700">JUM</span><strong style="font-size: 19px; line-height: 1">16</strong></span><span><strong style="display: block">Survei venue Leadership Camp</strong><span style="font-size: 12.5px; color: #6B6D8C">10.00 · Bogor</span></span></div>
            <div style="display: flex; gap: 12px; align-items: center"><span style="width: 50px; height: 54px; flex: none; border-radius: 16px; background: #E3F3F8; color: #1F5566; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 10.5px; font-weight: 700">SAB</span><strong style="font-size: 19px; line-height: 1">18</strong></span><span><strong style="display: block">Rapat Steering Team</strong><span style="font-size: 12.5px; color: #6B6D8C">09.00 · Sekretariat</span></span></div>
          </div>
        </div>
        <div class="rise d3" style="padding: 22px; border-radius: 28px; background: #F1F4FB">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #6B6D8C">PROGRAM SEKILAS</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px">
            <div><strong style="display: block; font-size: 22px; color: #32306F">128</strong><span style="font-size: 12px; color: #55577A">mentee aktif</span></div>
            <div><strong style="display: block; font-size: 22px; color: #B42318">3</strong><span style="font-size: 12px; color: #55577A">status merah</span></div>
            <div><strong style="display: block; font-size: 22px; color: #32306F">Rp48 jt</strong><span style="font-size: 12px; color: #55577A">saldo kas</span></div>
          </div>
        </div>
      </aside>
    </div>

    <section style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px"><h2 style="margin: 0; font-size: 20px; font-weight: 800">Proker yang kamu pegang</h2><a href="proker.html" style="font-size: 13px; font-weight: 700">Buka workspace →</a></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px">
        <a class="lift" href="proker.html" style="padding: 20px; border-radius: 22px; background: linear-gradient(180deg,#FFFFFF,#F7F9FF); border: 1px solid #E3E7F2; text-decoration: none; color: #0D0D1A">
          <div style="display: flex; justify-content: space-between"><strong style="font-size: 16px">Leadership Camp</strong><span style="font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: #E4EBF8; color: #3157A5">PIC</span></div>
          <div style="height: 8px; border-radius: 8px; background: #E3E7F2; margin: 14px 0 10px; overflow: hidden"><div class="grow" style="width: 45%; height: 100%; background: linear-gradient(90deg,#3157A5,#A3D6E6)"></div></div>
          <span style="font-size: 13px; color: #55577A">45% · milestone berikut: kunci venue, 20 Okt</span>
        </a>
        <a class="lift" href="proker.html" style="padding: 20px; border-radius: 22px; background: linear-gradient(180deg,#FFFFFF,#F7F9FF); border: 1px solid #E3E7F2; text-decoration: none; color: #0D0D1A">
          <div style="display: flex; justify-content: space-between"><strong style="font-size: 16px">Community Gathering</strong><span style="font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: #F1F2F6; color: #55577A">Anggota</span></div>
          <div style="height: 8px; border-radius: 8px; background: #E3E7F2; margin: 14px 0 10px; overflow: hidden"><div class="grow" style="width: 20%; height: 100%; background: linear-gradient(90deg,#3157A5,#A3D6E6)"></div></div>
          <span style="font-size: 13px; color: #55577A">20% · konsep acara dibahas 18 Okt</span>
        </a>
        <div style="padding: 20px; border-radius: 22px; background: #FFFBEB; border: 1px solid #FDE68A">
          <strong style="font-size: 15px">Dokumen terakhir dibuka</strong>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px; font-size: 13.5px">
            <span><strong>Konsep Leadership Camp</strong> · Docs · 2 jam lalu</span>
            <span><strong>RAB Leadership Camp</strong> · Sheets · kemarin</span>
            <span><strong>Survei peserta</strong> · Forms · 3 hari lalu</span>
          </div>
        </div>
      </div>
    </section>

    <sc-if value="{{isPic}}" hint-placeholder-val="{{ false }}">
      <section class="rise" style="padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1.5px solid #3157A5; box-shadow: 0 18px 40px -30px rgba(49,87,165,.7)">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px">
          <div><h2 style="margin: 0; font-size: 20px; font-weight: 800">Verifikasi akun</h2><p style="margin: 2px 0 0; font-size: 13px; color: #6B6D8C">Hanya terlihat oleh PIC Verifikasi. Hak ini diberikan Super Admin.</p></div>
          <button class="btn" type="button" onClick="{{approveAll}}" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">Setujui semua ({{pendingCount}})</button>
        </div>
        <sc-for list="{{applicants}}" as="a" hint-placeholder-count="4">
          <div class="row" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 14px; border-bottom: 1px solid #F0F2F8">
            <span style="width: 40px; height: 40px; border-radius: 50%; background: {{a.bg}}; color: {{a.ink}}; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none">{{a.initials}}</span>
            <span style="flex: 1; min-width: 180px"><span style="display: block; font-weight: 700; font-size: 14.5px">{{a.name}}</span><span style="font-size: 12.5px; color: #6B6D8C">{{a.email}} · {{a.when}}</span></span>
            <span style="font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: {{a.roleBg}}; color: {{a.roleInk}}">{{a.role}}</span>
            <sc-if value="{{a.pending}}" hint-placeholder-val="{{ true }}">
              <span style="display: flex; gap: 6px">
                <button type="button" onClick="{{a.reject}}" aria-label="Tolak {{a.name}}" style="width: 36px; height: 36px; border-radius: 11px; border: 1px solid #E3E7F2; background: #FFFFFF; cursor: pointer; font-size: 16px; color: #B42318">×</button>
                <button type="button" onClick="{{a.approve}}" style="height: 36px; padding: 0 12px; border-radius: 11px; border: 0; background: #32306F; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer">Setujui</button>
              </span>
            </sc-if>
            <sc-if value="{{a.decided}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 12.5px; font-weight: 800; padding: 8px 12px; border-radius: 11px; background: {{a.doneBg}}; color: {{a.doneInk}}">{{a.doneLabel}}</span>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-if>
    <sc-if value="{{notPic}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 22px; background: #FFFFFF; border: 1px dashed #C9CFE2; font-size: 14px; color: #55577A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6D8C" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        Verifikasi akun mentee, asmen, dan mentor hanya untuk PIC Verifikasi. Ganti pratinjau ke "PIC Verifikasi" di atas untuk melihatnya.
      </div>
    </sc-if>
  </main>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; gap: 6px; cursor: pointer">Batch 2026
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="position: relative">
          <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
          </sc-if>
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="{{it.style}}">{{it.label}}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 310px; padding: 8px; border-radius: 20px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{it.children}}" as="ch" hint-placeholder-count="3">
                  <a href="{{ch.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: {{c.ink}}">
                    <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #32306F">{{ch.short}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ch.label}}</span><span style="font-size: 12.5px; color: {{c.muted}}; line-height: 1.4">{{ch.desc}}</span></span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; position: relative">
      <button type="button" aria-label="Cari (Ctrl K)" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line2}}; background: {{c.field}}; font: inherit; font-size: 13px; color: {{c.muted}}; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span>Cari</span><span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: {{c.chip}}; border: 1px solid {{c.line2}}">⌘K</span>
      </button>
      <button type="button" aria-label="Tambah cepat" title="Task, note, atau event baru" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #32306F, #3157A5); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.3)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>

    const defs = [

    };
  }
