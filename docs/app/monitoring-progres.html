<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#F5F7FC}
a{color:#3157A5}a:hover{color:#32306F}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.toast{animation:toast 2.4s ease both}
.cell{transition:transform .15s}
.cell:hover{transform:scale(1.04)}
.btn{transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}


body{margin:0}

</style>

<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div style="position:relative;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:8px 16px;background:#0D0D1A;color:#FFFFFF;font:600 12.5px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center"><span style="padding:3px 9px;border-radius:999px;background:#D4FF3A;color:#0D0D1A;font-weight:800">PROTOTYPE</span><span>IPB Leap Management System · semua data masih contoh</span><a href="../index.html" style="color:#A3D6E6;font-weight:800;text-decoration:none">← Kembali ke website</a></div>
<div id="app" data-page="MonitoringProgres"></div>
<template data-dc="MonitoringProgres">
<div style="min-height: 100vh; background: #F5F7FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D0D1A">
  <div style="position: sticky; top: 0; z-index: 50">
    <dc-import name="Navbar" role="asmen" active="kelompok" hint-size="100%,73px"></dc-import>
  </div>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">
    <div class="rise" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6B6D8C">Kelompok Rajawali · frekuensi update bulanan</span>
        <h1 style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 50px; letter-spacing: -.02em; color: #32306F; line-height: 1">Monitoring Progres</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <select aria-label="Periode" style="height: 46px; padding: 0 12px; border-radius: 14px; border: 1px solid #D5DAEA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px"><option>Agustus – Oktober 2026</option><option>Seluruh Batch</option></select>
        <button class="btn" type="button" onClick="{{remind}}" style="height: 46px; padding: 0 16px; border-radius: 14px; border: 0; background: #0D0D1A; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer">Ingatkan yang belum update ({{pendingCount}})</button>
        <a class="btn" href="catat-sesi.html" style="height: 46px; padding: 0 16px; border-radius: 14px; background: linear-gradient(135deg,#32306F,#3157A5); color: #FFFFFF; font-weight: 800; font-size: 14px; text-decoration: none; display: flex; align-items: center">+ Catat sesi</a>
      </div>
    </div>

    <section class="rise" style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08); box-shadow: 0 18px 40px -30px rgba(50,48,111,.45)">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px">
        <h2 style="margin: 0; font-size: 19px; font-weight: 800">Gita perlu disapa: update September terlambat, Oktober belum masuk</h2>
        <div style="display: flex; gap: 14px; font-size: 12.5px; font-weight: 700; color: #33355A"><span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; border-radius: 4px; background: #16A34A"></span>Tepat waktu</span><span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; border-radius: 4px; background: #F59E0B"></span>Terlambat</span><span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; border-radius: 4px; background: #E3E7F2; border: 1px dashed #A3A6C2"></span>Belum</span></div>
      </div>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 14px; min-width: 860px">
          <thead><tr style="text-align: left; color: #6B6D8C; font-size: 12.5px"><th style="padding: 0 12px; font-weight: 700">Mentee</th><th style="padding: 0 8px; font-weight: 700">Agustus</th><th style="padding: 0 8px; font-weight: 700">September</th><th style="padding: 0 8px; font-weight: 700">Oktober</th><th style="padding: 0 8px; font-weight: 700">Kehadiran sesi #1–#5</th><th style="padding: 0 8px; font-weight: 700">Status</th></tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
              <tr>
                <td style="padding: 10px 12px; background: #F8F9FD; border-radius: 16px 0 0 16px"><span style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 50%; background: {{r.bg}}; color: {{r.ink}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.initials}}</span><strong>{{r.name}}</strong></span></td>
                <sc-for list="{{r.months}}" as="m" hint-placeholder-count="3">
                  <td style="padding: 6px; background: #F8F9FD"><button class="cell" type="button" onClick="{{m.open}}" style="{{m.style}}"><span style="font-weight: 800; font-size: 13px">{{m.label}}</span><span style="font-size: 11.5px; opacity: .85">{{m.sub}}</span></button></td>
                </sc-for>
                <td style="padding: 6px 8px; background: #F8F9FD"><span style="display: flex; gap: 4px"><sc-for list="{{r.att}}" as="a" hint-placeholder-count="5"><span title="{{a.title}}" style="width: 22px; height: 22px; border-radius: 7px; background: {{a.bg}}; color: {{a.ink}}; font-size: 10.5px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{a.mark}}</span></sc-for></span></td>
                <td style="padding: 6px 12px; background: #F8F9FD; border-radius: 0 16px 16px 0"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: {{r.sBg}}; color: {{r.sInk}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.light}}"></span>{{r.status}}</span></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <p style="margin: 8px 0 0; font-size: 12.5px; color: #6B6D8C">Klik sel bulan untuk membuka isi update. Kotak kehadiran: ✓ hadir, I izin, × absen.</p>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
      <section style="flex: 999 1 600px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px">
          <h2 style="margin: 0; font-size: 19px; font-weight: 800">Update · {{selTitle}}</h2>
          <span style="font-size: 12.5px; font-weight: 800; padding: 6px 10px; border-radius: 10px; background: {{selBadgeBg}}; color: {{selBadgeInk}}">{{selBadge}}</span>
        </div>
        <sc-if value="{{selHas}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <div style="padding: 16px; border-radius: 18px; background: #F0FDF4"><span style="font-size: 12px; font-weight: 800; color: #166534; letter-spacing: .06em">CAPAIAN</span><p style="margin: 8px 0 0; font-size: 14px; line-height: 1.55">{{sel.a}}</p></div>
            <div style="padding: 16px; border-radius: 18px; background: #FFFBEB"><span style="font-size: 12px; font-weight: 800; color: #92400E; letter-spacing: .06em">KENDALA</span><p style="margin: 8px 0 0; font-size: 14px; line-height: 1.55">{{sel.b}}</p></div>
            <div style="padding: 16px; border-radius: 18px; background: #EEF2FC"><span style="font-size: 12px; font-weight: 800; color: #3157A5; letter-spacing: .06em">RENCANA</span><p style="margin: 8px 0 0; font-size: 14px; line-height: 1.55">{{sel.c}}</p></div>
          </div>
        </sc-if>
        <sc-if value="{{selEmpty}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 28px; border-radius: 20px; border: 1.5px dashed #D5DAEA; text-align: center; font-size: 14px; color: #55577A">Belum ada update untuk periode ini. Pengingat otomatis terkirim H-2 dan saat terlambat.</div>
        </sc-if>
      </section>
      <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="padding: 22px; border-radius: 26px; background: #32306F; color: #FFFFFF">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #A3D6E6">ATURAN STATUS OTOMATIS</span>
          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px; font-size: 13.5px; line-height: 1.45">
            <span><strong style="color: #86EFAC">Hijau</strong> · update tepat waktu, hadir ≥ 80%, nilai ≥ 70</span>
            <span><strong style="color: #FCD34D">Kuning</strong> · telat 1 periode, hadir 60–79%, atau nilai 55–69</span>
            <span><strong style="color: #FCA5A5">Merah</strong> · 2 periode tanpa update, hadir &lt; 60%, atau nilai &lt; 55</span>
          </div>
        </div>
        <div style="padding: 22px; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(50,48,111,.08)">
          <h3 style="margin: 0 0 12px; font-size: 16px; font-weight: 800">Sesi mentoring tercatat</h3>
          <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13.5px">
            <div style="display: flex; justify-content: space-between"><span><strong>#5</strong> · 4 Okt · Stakeholder desa</span><span style="font-weight: 800; color: #166534">4/4</span></div>
            <div style="display: flex; justify-content: space-between"><span><strong>#4</strong> · 20 Sep · Problem framing</span><span style="font-weight: 800; color: #92400E">3/4</span></div>
            <div style="display: flex; justify-content: space-between"><span><strong>#3</strong> · 6 Sep · Visi pribadi</span><span style="font-weight: 800; color: #166534">4/4</span></div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 14px 20px; border-radius: 16px; background: #0D0D1A; color: #FFFFFF; font-weight: 700; font-size: 14px; z-index: 90">Pengingat terkirim via notifikasi &amp; email</div>
  </sc-if>
</div>
</template>
<template data-dc="Navbar">
<header style="position: relative; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.ink}}; background: {{c.bar}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid {{c.line}}; box-shadow: 0 10px 30px -24px rgba(50,48,111,.5)">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{homeHref}}" aria-label="Beranda IPB Leap Management System" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <img src="{{c.logo}}" alt="" style="height: 38px; width: auto">
        <span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; color: {{c.brand}}; letter-spacing: -.01em">LEAP</span><span style="font-size: 10.5px; font-weight: 700; color: {{c.muted}}; letter-spacing: .06em; text-transform: uppercase">Management System</span></span>
      </a>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; font: inherit; font-size: 12.5px; font-weight: 700; color: {{c.brand}}; display: flex; align-items: center; gap: 6px; cursor: pointer">Batch 2026
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <nav aria-label="Menu utama" style="flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="position: relative">
          <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
          </sc-if>
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="{{it.style}}">{{it.label}}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 310px; padding: 8px; border-radius: 20px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{it.children}}" as="ch" hint-placeholder-count="3">
                  <a href="{{ch.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: {{c.ink}}">
                    <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #32306F">{{ch.short}}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ch.label}}</span><span style="font-size: 12.5px; color: {{c.muted}}; line-height: 1.4">{{ch.desc}}</span></span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; position: relative">
      <button type="button" aria-label="Cari (Ctrl K)" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line2}}; background: {{c.field}}; font: inherit; font-size: 13px; color: {{c.muted}}; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span>Cari</span><span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: {{c.chip}}; border: 1px solid {{c.line2}}">⌘K</span>
      </button>
      <button type="button" aria-label="Tambah cepat" title="Task, note, atau event baru" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #32306F, #3157A5); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.3)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <a href="chat.html" aria-label="Chat, 5 pesan baru" style="position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{c.icon}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>
        <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #3157A5; color: #FFFFFF; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.ring}}">5</span>
      </a>
      <button type="button" onClick="{{toggleNotif}}" aria-label="Notifikasi, 3 belum dibaca" aria-expanded="{{notifExpanded}}" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{c.icon}}; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: #D4FF3A; border: 2px solid #32306F"></span>
      </button>
      <button type="button" onClick="{{toggleMe}}" aria-expanded="{{meExpanded}}" aria-label="Menu akun" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 4px; border-radius: 999px; border: 1px solid {{c.line2}}; background: {{c.chip}}; cursor: pointer; font: inherit">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: {{avatarBg}}; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{initials}}</span>
        <span style="font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: {{roleBg}}; color: {{roleInk}}">{{roleLabel}}</span>
      </button>

      <sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; top: 56px; right: 40px; width: 360px; padding: 16px; border-radius: 22px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><strong style="font-size: 15px">Notifikasi</strong><span style="font-size: 12.5px; font-weight: 700; color: {{c.link}}">Tandai dibaca</span></div>
          <div style="display: flex; flex-direction: column">
            <div style="display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid {{c.line}}"><span style="width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #3157A5; flex: none"></span><span style="font-size: 13.5px; line-height: 1.5">Periode penilaian Oktober ditutup <strong>H-3</strong>. Masih ada 2 form.<br><span style="color: {{c.muted}}; font-size: 12px">10 menit lalu</span></span></div>
            <div style="display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid {{c.line}}"><span style="width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #3157A5; flex: none"></span><span style="font-size: 13.5px; line-height: 1.5">Kamu diundang ke <strong>Sesi Mentoring #6</strong>, Sab 18 Okt 09.00.<br><span style="color: {{c.muted}}; font-size: 12px">1 jam lalu</span></span></div>
            <div style="display: flex; gap: 12px; padding: 12px 4px"><span style="width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #3157A5; flex: none"></span><span style="font-size: 13.5px; line-height: 1.5">Pendaftaran <strong>Leadership Camp</strong> dibuka hari ini.<br><span style="color: {{c.muted}}; font-size: 12px">3 jam lalu</span></span></div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{meOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; top: 56px; right: 0; width: 270px; padding: 8px; border-radius: 22px; background: {{c.pop}}; border: 1px solid {{c.line2}}; box-shadow: 0 24px 60px -24px rgba(13,13,26,.55); z-index: 60; display: flex; flex-direction: column">
          <div style="padding: 12px; border-bottom: 1px solid {{c.line}}; margin-bottom: 4px"><div style="font-weight: 800; font-size: 14.5px">{{name}}</div><div style="font-size: 12.5px; color: {{c.muted}}">{{subtitle}}</div></div>
          <a href="pengaturan.html" style="padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: {{c.ink}}; text-decoration: none">Profil &amp; ID Card</a>
          <a href="pengaturan.html" style="padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: {{c.ink}}; text-decoration: none">Pengaturan</a>
          <a href="index.html" onClick="{{logout}}" style="padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #E5484D; text-decoration: none">Keluar</a>
        </div>
      </sc-if>
