<head>

<style>
[data-dc-host]{display:contents}
html{scroll-behavior:smooth}

body{margin:0;background:#0E0D2B}
a{color:#D4FF3A}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes blobA{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-120px,80px) scale(1.15)}66%{transform:translate(60px,140px) scale(.9)}}
@keyframes blobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(220px,-120px) scale(1.2)}}
@keyframes blobC{0%,100%{transform:translate(0,0) scale(.9)}25%{transform:translate(160px,-60px) scale(1.1)}75%{transform:translate(-140px,90px) scale(1)}}
@keyframes gridMove{from{transform:translate(0,0)}to{transform:translate(34px,34px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translateY(-120px) scale(1.1)}}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes comet{0%{left:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rise{animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
.b-a{animation:blobA 18s ease-in-out infinite}.b-b{animation:blobB 22s ease-in-out infinite}.b-c{animation:blobC 26s ease-in-out infinite}
.gridmove{animation:gridMove 6s linear infinite}
.ring{animation:spin 26s linear infinite}.ring2{animation-duration:38s;animation-direction:reverse}
.spark{animation-name:spark;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.gtext{background:linear-gradient(90deg,#FFFFFF 0%,#D4FF3A 25%,#A3D6E6 50%,#FFFFFF 75%,#D4FF3A 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 5s linear infinite}
.track{transform-origin:left;animation:draw 1.8s cubic-bezier(.6,0,.2,1) .3s both}
.trackfill{background:linear-gradient(90deg,#A3D6E6,#D4FF3A,#A3D6E6);background-size:200% 100%;animation:flow 3s linear infinite}
.comet{animation:comet 4.5s cubic-bezier(.5,0,.5,1) 2.1s infinite}
.node{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.ping{animation:ping 1.8s ease-out infinite}
.floaty{animation:floatY 5s ease-in-out infinite}
.marquee{animation:marquee 28s linear infinite}
.phase{transition:transform .25s, background .25s}
.phase:hover{transform:translateY(-6px);background:rgba(255,255,255,.12) !important}
@keyframes glowPulse{0%,100%{box-shadow:0 20px 40px -18px rgba(212,255,58,.7),0 0 0 0 rgba(212,255,58,.45)}50%{box-shadow:0 20px 40px -18px rgba(212,255,58,.7),0 0 0 12px rgba(212,255,58,0)}}
@keyframes nudgeX{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.wacta{animation:glowPulse 2.2s ease-in-out infinite;transition:transform .2s}.wacta:hover{transform:translateY(-3px) scale(1.02)}
.arrowmove{display:inline-block;animation:nudgeX 1.2s ease-in-out infinite}
@keyframes chainIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chainstep{animation:chainIn .6s cubic-bezier(.2,.9,.3,1.2) both}
.barup{transform-origin:bottom;animation:barUp 1.2s cubic-bezier(.2,.9,.3,1.1) both}
.pillar{transition:transform .25s}.pillar:hover{transform:translateY(-6px) scale(1.02)}
.engine{transition:transform .25s}
.engine:hover{transform:translateY(-6px) rotate(-1deg)}
@media (max-width: 900px){.h1{font-size:52px !important}.tl{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.tlline{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

</style>

<body>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk melihat halaman ini.</p></noscript>
<div id="app" data-page="PubTentang"></div>
<template data-dc="PubTentang">
<div style="position: relative; overflow: hidden; background: linear-gradient(180deg, #32306F 0%, #2C3F8E 26%, #24306F 52%, #1A1A4E 78%, #0E0D2B 100%); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF">
  <div style="position: sticky; top: 0; z-index: 50"><dc-import name="PubNav" active="tentang" hint-size="100%,73px"></dc-import></div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
    <div class="b-a" style="position: absolute; right: -8%; top: 0; width: 760px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(163,214,230,.45), transparent 65%); filter: blur(50px)"></div>
    <div class="b-b" style="position: absolute; left: -12%; top: 18%; width: 700px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(212,255,58,.2), transparent 65%); filter: blur(60px)"></div>
    <div class="b-c" style="position: absolute; left: 30%; top: 42%; width: 680px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(110,90,230,.45), transparent 65%); filter: blur(70px)"></div>
    <div class="b-a" style="position: absolute; right: 5%; top: 70%; width: 600px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(49,87,165,.7), transparent 65%); filter: blur(60px); animation-delay: -7s"></div>
    <div class="gridmove" style="position: absolute; inset: -60px; background-image: radial-gradient(rgba(255,255,255,.14) 1.2px, transparent 1.6px); background-size: 34px 34px; -webkit-mask-image: linear-gradient(180deg, #000, #000 60%, transparent); mask-image: linear-gradient(180deg, #000, #000 60%, transparent)"></div>
    <div class="ring" style="position: absolute; right: -200px; top: -160px; width: 680px; height: 680px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(212,255,58,.4) 40deg, transparent 90deg, rgba(163,214,230,.4) 200deg, transparent 260deg); -webkit-mask-image: radial-gradient(circle, transparent 62%, #000 63%, #000 64%, transparent 65%); mask-image: radial-gradient(circle, transparent 62%, #000 63%, #000 64%, transparent 65%)"></div>
    <div class="ring ring2" style="position: absolute; left: -320px; top: 46%; width: 860px; height: 860px; border-radius: 50%; background: conic-gradient(from 90deg, transparent 0deg, rgba(255,255,255,.28) 60deg, transparent 120deg); -webkit-mask-image: radial-gradient(circle, transparent 66%, #000 67%, #000 67.6%, transparent 68.5%); mask-image: radial-gradient(circle, transparent 66%, #000 67%, #000 67.6%, transparent 68.5%)"></div>
    <sc-for list="{{sparks}}" as="p" hint-placeholder-count="18">
      <span class="spark" style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; width: {{p.s}}px; height: {{p.s}}px; border-radius: 50%; background: {{p.c}}; box-shadow: 0 0 12px {{p.c}}; animation-duration: {{p.d}}s; animation-delay: {{p.delay}}s"></span>
    </sc-for>
  </div>

  <section style="position: relative; max-width: 1360px; margin: 0 auto; padding: 88px 24px 40px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
    <div style="flex: 1 1 600px; min-width: 0">
      <span class="rise" style="display: inline-block; font-size: 12.5px; font-weight: 800; letter-spacing: .12em; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25)">ABOUT US · IPB LEAP</span>
      <h1 class="rise d1 h1" style="margin: 22px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 84px; line-height: .92; letter-spacing: -.03em">From Mentoring<br>to <span class="gtext">Acceleration.</span></h1>
      <p class="rise d2" style="margin: 24px 0 0; font-size: 18px; line-height: 1.7; color: rgba(255,255,255,.86); max-width: 640px">IPB LEAP (Leadership Acceleration Program) adalah program Himpunan Alumni IPB yang sebelumnya dikenal sebagai Mentoring Leader. IPB LEAP exists to make promising IPB talents move faster.</p>
    </div>
    <div class="rise d3" style="flex: 1 1 380px; min-width: 0; position: relative; height: 360px">
      <sc-for list="{{orbs}}" as="o" hint-placeholder-count="4">
        <div class="floaty" style="position: absolute; left: {{o.x}}px; top: {{o.y}}px; --r: {{o.r}}deg; animation-duration: {{o.dur}}s; animation-delay: {{o.delay}}s">
          <span class="gtext" style="display: block; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: {{o.fs}}px; line-height: .85; letter-spacing: -.035em; filter: drop-shadow(0 10px 24px rgba(14,13,43,.5))">{{o.value}}</span>
          <span style="display: inline-block; margin-top: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(14,13,43,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 12.5px; font-weight: 800">{{o.label}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <div aria-hidden="true" style="position: relative; overflow: hidden; padding: 18px 0; margin: 24px 0 0; transform: rotate(-1.5deg); background: #D4FF3A; color: #0D0D1A">
    <div class="marquee" style="display: flex; width: max-content; gap: 40px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 26px; white-space: nowrap">
      <sc-for list="{{marq}}" as="m" hint-placeholder-count="12"><span>{{m}}</span><span>✦</span></sc-for>
    </div>
  </div>

  <main style="position: relative; max-width: 1360px; margin: 0 auto; padding: 96px 24px 110px; display: flex; flex-direction: column; gap: 110px">
    <section style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
      <div style="flex: 1 1 480px; min-width: 0">
        <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">CERITA KAMI</span>
        <h2 style="margin: 12px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">7 batch, ±1.400 mentee, satu pertanyaan baru.</h2>
        <p style="margin: 20px 0 0; font-size: 17px; line-height: 1.75; color: rgba(255,255,255,.82)">Selama 7 batch, Mentoring Leader (MenLead) membangun ruang mentoring lintas generasi alumni IPB. Sekitar 1.400 mentee telah dibina oleh para alumni yang berkarier di berbagai bidang.</p>
        <p style="margin: 14px 0 0; font-size: 17px; line-height: 1.75; color: rgba(255,255,255,.82)">Kini pertanyaannya bukan lagi sekadar "bagaimana memastikan mentoring berjalan?", tetapi bagaimana talenta muda IPB bisa bergerak lebih cepat menuju hasil yang bermakna.</p>
      </div>
      <blockquote style="flex: 1 1 440px; min-width: 0; margin: 0; position: relative; padding: 40px 36px; border-radius: 34px; background: linear-gradient(150deg, #3157A5 0%, #32306F 70%); box-shadow: 0 40px 80px -40px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.15); overflow: hidden">
        <span aria-hidden="true" class="b-a" style="position: absolute; right: -100px; top: -120px; width: 320px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(212,255,58,.35), transparent 65%); filter: blur(24px)"></span>
        <span aria-hidden="true" style="position: absolute; left: 22px; top: -18px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 160px; line-height: 1; color: rgba(212,255,58,.25)">“</span>
        <span style="position: relative; display: block; font-size: 23px; line-height: 1.5; font-weight: 700">Bagaimana talenta muda IPB mencapai sesuatu dalam 12 bulan yang biasanya membutuhkan 2–3 tahun jika berjalan sendiri?</span>
        <span class="gtext" style="position: relative; display: block; margin-top: 18px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 26px">THAT IS ACCELERATION.</span>
      </blockquote>
    </section>

    <section id="framework" style="position: relative; padding: 56px 48px; border-radius: 40px; background: linear-gradient(140deg, #3157A5 0%, #32306F 55%, #1A1A4E 100%); overflow: hidden; box-shadow: 0 50px 100px -50px rgba(0,0,0,.8)">
      <span aria-hidden="true" class="b-a" style="position: absolute; right: -160px; top: -200px; width: 520px; height: 460px; border-radius: 50%; background: radial-gradient(circle, rgba(212,255,58,.3), transparent 65%); filter: blur(40px)"></span>
      <span aria-hidden="true" class="ring" style="position: absolute; left: -220px; bottom: -300px; width: 600px; height: 600px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(163,214,230,.45) 60deg, transparent 140deg); -webkit-mask-image: radial-gradient(circle, transparent 64%, #000 65%, #000 66%, transparent 67%); mask-image: radial-gradient(circle, transparent 64%, #000 65%, #000 66%, transparent 67%)"></span>
      <div style="position: relative">
        <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">PROGRAM FRAMEWORK · NORTH STAR</span>
        <h2 style="margin: 12px 0 0; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 64px; line-height: .95; letter-spacing: -.025em">Accelerate <span class="gtext">Real Progress.</span></h2>
        <p style="margin: 18px 0 0; font-size: 17px; line-height: 1.7; color: rgba(255,255,255,.84); max-width: 720px">Keberhasilan IPB LEAP diukur dari seberapa jauh seseorang bergerak dari titik awal menuju hasil yang bermakna. Quality over quantity: lebih baik 100 orang benar-benar bergerak daripada 300 orang hanya mengikuti kegiatan.</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 30px">
          <sc-for list="{chain}" as="c" hint-placeholder-count="4">
            <span class="chainstep" style="display: flex; align-items: center; gap: 12px; animation-delay: {c.delay}s"><span style="padding: 14px 22px; border-radius: 18px; background: {c.bg}; color: {c.ink}; font-weight: 900; font-size: 16px">{c.t}</span><span class="arrowmove" style="color: #D4FF3A; font-weight: 900; font-size: 20px; opacity: {c.arrow}">→</span></span>
          </sc-for>
        </div>
      </div>
    </section>

    <section>
      <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">ACCELERATION ECOSYSTEM</span>
      <h2 style="margin: 12px 0 36px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">Enam pilar akselerasi.</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px">
        <sc-for list="{pillars}" as="p" hint-placeholder-count="6">
          <div class="pillar rise" style="position: relative; padding: 24px 22px; border-radius: 26px; background: {p.bg}; color: {p.ink}; min-height: 170px; display: flex; flex-direction: column; animation-delay: {p.delay}s">
            <span style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 15px; opacity: .65">{p.no}</span>
            <strong style="margin-top: auto; font-size: 18px; letter-spacing: .05em">{p.name}</strong>
            <span style="margin-top: 6px; font-size: 13.5px; line-height: 1.5; opacity: .82">{p.desc}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section>
      <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">FIVE PATHWAYS</span>
      <h2 style="margin: 12px 0 36px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">Lima pathway, lima tujuan.</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
        <sc-for list="{pathways}" as="w" hint-placeholder-count="5">
          <div class="engine rise" style="position: relative; overflow: hidden; padding: 26px; min-height: 260px; border-radius: 30px; background: {w.bg}; color: {w.ink}; display: flex; flex-direction: column; box-shadow: 0 30px 60px -36px rgba(0,0,0,.7); animation-delay: {w.delay}s">
            <span aria-hidden="true" style="position: absolute; right: -10px; bottom: -36px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 150px; line-height: 1; opacity: .13">{w.no}</span>
            <span style="position: relative; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 34px">{w.no}</span>
            <strong style="position: relative; margin-top: 8px; font-size: 15px; letter-spacing: .05em">{w.name}</strong>
            <span style="position: relative; margin-top: auto; font-size: 20px; font-weight: 800">{w.goal}</span>
            <span style="position: relative; margin-top: 4px; font-size: 13.5px; line-height: 1.5; opacity: .82">{w.desc}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section>
      <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">TIMELINE PROGRAM</span>
      <h2 style="margin: 12px 0 8px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">12 bulan, 6 fase melompat.</h2>
      <p style="margin: 0 0 44px; font-size: 16px; color: rgba(255,255,255,.75); max-width: 640px">Perjalanan setiap mentee dari menemukan arah sampai menunjukkan hasil nyata.</p>
      <div style="position: relative">
        <div class="tlline" aria-hidden="true" style="position: absolute; left: 8%; right: 8%; top: 27px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12)">
          <div class="track trackfill" style="position: absolute; inset: 0; border-radius: 6px"></div>
          <span class="comet" style="position: absolute; top: -7px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 6px rgba(212,255,58,.35), 0 0 30px 8px rgba(212,255,58,.7)"></span>
        </div>
        <ol class="tl" style="position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{phases}}" as="f" hint-placeholder-count="6">
            <li style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px">
              <span class="node" style="position: relative; width: 60px; height: 60px; border-radius: 50%; background: {{f.bg}}; color: {{f.ink}}; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 20px; box-shadow: 0 14px 30px -10px rgba(0,0,0,.6); animation-delay: {{f.delay}}s">
                <span aria-hidden="true" class="ping" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid {{f.bg}}; animation-delay: {{f.delay}}s"></span>{{f.no}}
              </span>
              <div class="phase rise" style="width: 100%; padding: 20px 16px; border-radius: 24px; background: rgba(255,255,255,.06); animation-delay: {{f.delay}}s">
                <strong style="display: block; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 22px; color: {{f.title}}">{{f.name}}</strong>
                <span style="display: block; margin-top: 8px; font-size: 13.5px; line-height: 1.55; color: rgba(255,255,255,.78)">{{f.desc}}</span>
              </div>
            </li>
          </sc-for>
        </ol>
      </div>
    </section>

    <section style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
      <div style="flex: 1 1 380px; min-width: 0">
        <span style="font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #D4FF3A">LEARN LESS. EXPERIENCE MORE.</span>
        <h2 style="margin: 12px 0 12px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -.02em">70% belajar dengan turun langsung.</h2>
        <p style="margin: 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,.8)">Kurikulum dirancang mundur dari hasil: KPI 12 bulan, lalu milestone, pengalaman, akses, mentor, baru materi. Setiap aktivitas harus menjawab: ini mempercepat bagian mana?</p>
      </div>
      <div style="flex: 1 1 520px; min-width: 0; display: flex; align-items: flex-end; gap: 14px; height: 320px">
        <sc-for list="{comp}" as="c" hint-placeholder-count="3">

  renderVals() {
    const active = this.props.active ?? 'home';
    const defs = [
      { key: 'home', label: 'Beranda', href: 'index.html' },
      { key: 'tentang', label: 'Tentang', href: 'tentang.html' },
      { key: 'komunitas', label: 'Komunitas', children: [
        { label: 'Our Mentor', desc: 'Alumni IPB lintas profesi', href: 'mentor.html', short: 'MT', tint: '#E7E6F3' },
        { label: 'Our Asmen', desc: 'Associate Mentor tiap kelompok', href: 'asmen.html', short: 'AS', tint: '#E4EBF8' },
        { label: 'Our Mentee', desc: 'Talenta muda di lima pathway', href: 'mentee.html', short: 'MN', tint: '#E3F3F8' }
      ] },
      { key: 'kegiatan', label: 'Kegiatan', href: 'kegiatan.html' },
      { key: 'showcase', label: 'Leap Showcase', href: 'showcase.html' },
      { key: 'prestasi', label: 'Prestasi', href: 'prestasi.html' },
      { key: 'event', label: 'Event', href: 'event.html' },
      { key: 'kontak', label: 'Kontak', href: 'kontak.html' }
    ];
    const items = defs.map((m) => {
      const on = m.key === active;
      const open = this.state.open === m.key;
      return Object.assign({}, m, {
        isLink: !m.children, hasChildren: !!m.children, open: open,
        expanded: open ? 'true' : 'false', current: on ? 'page' : 'false',
        style: 'display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 12px; border: 0; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; ' + (on ? 'background: #32306F; color: #FFFFFF; font-weight: 700' : 'background: transparent; color: #33355A; font-weight: 600'),
        toggle: () => this.setState({ open: open ? null : m.key })
      });
    });
    return { items: items };
  }
}
</script>
<script src="assets/leap-runtime.js"></script>
</body>
